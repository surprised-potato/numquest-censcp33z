<style>
/* Layout concept: a drafting sheet. Left rail = sheet index, top bar = title block with the player's level,
   each stage opens with a title-block hero, labs are plotted on gridded vellum.
   Palette: blueprint blue + vellum white, safety orange for action, hard-hat gold for XP. */
:root{
  --bg:#edf3fa; --grid:rgba(28,95,168,.10); --grid2:rgba(28,95,168,.05);
  --paper:#fbfdff; --paper2:#e2ecf7; --ink:#0f2a47; --muted:#4b6580;
  --line:#1c5fa8; --soft:#b7cde4; --accent:#d9480f; --on-accent:#ffffff;
  --gold:#f2b705; --on-gold:#2e2300; --good:#17803f; --bad:#c92a2a; --warn:#a85d00;
  --plot:#ffffff; --c1:#1c5fa8; --c2:#d9480f; --c3:#17803f;
  --hud:#0f2a47; --on-hud:#eaf3ff; --hud-soft:#1d4577; --shadow:rgba(15,42,71,.20);
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a2140; --grid:rgba(150,195,255,.11); --grid2:rgba(150,195,255,.05);
    --paper:#0f2f58; --paper2:#133b6b; --ink:#e8f1ff; --muted:#9fb8d6;
    --line:#7fb3ff; --soft:#2a5088; --accent:#ff8a3d; --on-accent:#1a0c00;
    --gold:#ffd23f; --on-gold:#2e2300; --good:#4ade80; --bad:#ff7b7b; --warn:#ffb84d;
    --plot:#0a2447; --c1:#7fb3ff; --c2:#ff9a5c; --c3:#6ee7a0;
    --hud:#06152b; --on-hud:#e8f1ff; --hud-soft:#143a69; --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a2140; --grid:rgba(150,195,255,.11); --grid2:rgba(150,195,255,.05);
  --paper:#0f2f58; --paper2:#133b6b; --ink:#e8f1ff; --muted:#9fb8d6;
  --line:#7fb3ff; --soft:#2a5088; --accent:#ff8a3d; --on-accent:#1a0c00;
  --gold:#ffd23f; --on-gold:#2e2300; --good:#4ade80; --bad:#ff7b7b; --warn:#ffb84d;
  --plot:#0a2447; --c1:#7fb3ff; --c2:#ff9a5c; --c3:#6ee7a0;
  --hud:#06152b; --on-hud:#e8f1ff; --hud-soft:#143a69; --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0; background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 64px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hud);z-index:60}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;line-height:1.1;margin:0;letter-spacing:.01em}
h2{font-size:1.7rem;font-weight:600;text-transform:uppercase}
h3{font-size:1.25rem;font-weight:600}
p{margin:.5rem 0}
a{color:var(--line)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono)}
sub,sup{line-height:0}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hud);color:var(--on-hud);margin:0 -16px;padding:8px 16px;border-bottom:3px solid var(--gold)}
@supports (padding:max(1px)){.hud{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.hud-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.lvl{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0}
.hex{flex:0 0 auto;width:46px;height:50px;background:var(--gold);color:var(--on-gold);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:700;line-height:1}
.hex small{font-size:.6rem;letter-spacing:.08em}
.hex b{font-size:1.35rem}
.lvl-t{min-width:0;flex:1}
.lvl-n{font-family:var(--f-disp);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:1.05rem;line-height:1.1}
.xpbar{height:12px;background:rgba(255,255,255,.14);margin-top:4px;position:relative;border:1px solid var(--hud-soft)}
.xpfill{height:100%;width:0;background:repeating-linear-gradient(135deg,var(--gold) 0 8px,#c99700 8px 16px);transition:width .5s}
.xpnum{font-family:var(--f-mono);font-size:.78rem;color:#b9d0ee;margin-top:2px}
.chip{display:flex;align-items:center;gap:7px;padding:5px 10px;background:var(--hud-soft);font-family:var(--f-disp);font-weight:600;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip b{font-family:var(--f-mono);font-size:1.05rem;font-weight:600;letter-spacing:0}
.nut{width:15px;height:17px;background:var(--gold);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);position:relative;display:inline-block}
.nut::after{content:"";position:absolute;inset:4px 3px;background:var(--hud-soft);border-radius:50%}
.chip.hot{background:var(--accent);color:var(--on-accent)}
.ctl-btn{border:1px solid var(--hud-soft);background:transparent;color:var(--on-hud);padding:5px 10px;cursor:pointer;font-family:var(--f-disp);font-weight:600;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase}
.ctl-btn:hover{background:var(--hud-soft)}
.ctl-btn[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.ctl-btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}

/* ---------- Shell ---------- */
.shell{max-width:1240px;margin:22px auto 0;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:calc(var(--hudh,76px) + env(safe-area-inset-top,0px) + 14px);background:var(--paper);border:2px solid var(--line);padding:12px;min-width:0}
.rail h4{margin:0 0 8px;font-family:var(--f-disp);font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;text-decoration:none;color:var(--ink);border:2px solid transparent;font-weight:500;line-height:1.25}
.nav a:hover{background:var(--paper2)}
.nav a.on{border-color:var(--accent);background:var(--paper2)}
.nav .sn{flex:0 0 auto;min-width:38px;text-align:center;font-family:var(--f-disp);font-weight:700;font-size:1rem;padding:1px 4px;background:var(--ink);color:var(--paper)}
.nav a.done .sn{background:var(--gold);color:var(--on-gold)}
.nav .nt{flex:1;min-width:0}
.nav .st{font-size:.8rem;color:var(--gold);letter-spacing:1px;text-shadow:0 0 1px #0007}
.nav .soon{opacity:.55;cursor:default}
.nav .soon .sn{background:var(--muted)}
.nav .div{height:0;border-top:1px dashed var(--soft);margin:6px 0}
.main{min-width:0}
.view{display:none}.view.on{display:block}

/* ---------- Hero (title block) ---------- */
.hero{background:var(--paper);border:3px solid var(--ink);position:relative;padding:22px 22px 0;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;width:18px;height:18px;border:3px solid var(--accent)}
.hero::before{left:-3px;top:-3px;border-right:0;border-bottom:0}
.hero::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
.eyebrow{font-family:var(--f-disp);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-size:1rem}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:700;text-transform:uppercase;margin:4px 0 10px}
.mission{max-width:60ch;font-size:1.08rem}
.mission b{font-family:var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-size:1rem}
.tblock{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin:20px -22px 0;border-top:3px solid var(--ink)}
.tblock div{padding:8px 14px;border-right:1px solid var(--soft);min-width:0}
.tblock div:last-child{border-right:0}
.tblock span{display:block;font-family:var(--f-disp);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tblock b{font-family:var(--f-mono);font-size:1.05rem;font-weight:600}
.stars{color:var(--gold);letter-spacing:2px;text-shadow:0 0 1px #0008}
.stars .off{color:var(--soft);text-shadow:none}

/* ---------- Sections ---------- */
.sec{margin-top:34px}
.sec>h2{display:flex;align-items:baseline;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:4px;margin-bottom:12px}
.sec>h2 .no{font-family:var(--f-mono);font-size:.95rem;font-weight:600;background:var(--ink);color:var(--paper);padding:1px 7px;letter-spacing:0;text-transform:none}
.prose{max-width:72ch}
.formula{font-family:var(--f-mono);font-size:1.02rem;background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--line);padding:10px 14px;margin:10px 0;overflow-x:auto;line-height:1.5}
.formula i{font-style:normal;color:var(--accent)}
.card{background:var(--paper);border:2px solid var(--line);padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
ul.tight{margin:.4rem 0;padding-left:1.2rem}ul.tight li{margin:.2rem 0}
ol.steps{margin:.5rem 0;padding-left:1.3rem}ol.steps li{margin:.25rem 0}
.tw{overflow-x:auto;margin:10px 0;border:2px solid var(--line);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--soft);white-space:nowrap}
th{background:var(--ink);color:var(--paper);font-family:var(--f-disp);font-weight:600;letter-spacing:.03em;font-size:1.05rem}
.mini-t th,.mini-t td{padding:5px 7px;font-size:.84rem}
.nav .st .off{color:var(--soft)}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:center}
tr.last td{background:var(--paper2);font-weight:600}
code,pre{font-family:var(--f-mono)}
pre{background:var(--hud);color:#d8e8ff;padding:12px 14px;overflow-x:auto;margin:10px 0;border-left:8px solid var(--gold);font-size:.9rem;line-height:1.5}
.cm{color:#8fb0d8}

/* callouts */
.callout{position:relative;margin:26px 0 14px;padding:16px 16px 12px;background:var(--paper);border:2px solid var(--line)}
.callout .tag{position:absolute;top:-13px;left:12px;font-family:var(--f-disp);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.95rem;padding:1px 10px;background:var(--line);color:var(--paper)}
.callout.trap{border-color:var(--bad)}.callout.trap .tag{background:var(--bad);color:#fff}
.callout.ce{border-color:var(--good)}.callout.ce .tag{background:var(--good);color:#fff}
.callout.mat{border-color:var(--warn)}.callout.mat .tag{background:var(--warn);color:#fff}
.callout p:first-of-type{margin-top:0}.callout p:last-child{margin-bottom:0}

/* ---------- Labs ---------- */
.lab{margin:22px 0;border:3px solid var(--ink);background:var(--paper)}
.lab-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--paper);padding:8px 14px}
.lab-tag{background:var(--gold);color:var(--on-gold);font-family:var(--f-disp);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;padding:0 8px}
.lab-title{font-family:var(--f-disp);font-weight:600;font-size:1.3rem;letter-spacing:.04em;text-transform:uppercase}

.badge.got{opacity:1}
.medal{width:62px;height:66px;margin:0 auto 8px;background:none!important;clip-path:none!important;display:grid;place-items:center}
.medal-svg{width:62px;height:66px;display:block;color:var(--ink)}
.medal-svg .m-outer{fill:var(--paper2);stroke:var(--soft);stroke-width:2.4}
.medal-svg .m-inner{fill:var(--paper);stroke:var(--soft);stroke-width:1.3;stroke-dasharray:4 3}
.badge:not(.got) .medal-svg{filter:grayscale(.65);opacity:.78}
.badge.got .medal-svg{filter:drop-shadow(0 3px 6px var(--shadow))}
.badge.got .medal-svg .m-outer{fill:color-mix(in srgb,var(--gold) 26%,var(--paper2));stroke:var(--gold);stroke-width:2.8}
.badge.got .medal-svg .m-inner{fill:var(--paper);stroke:var(--accent);stroke-width:1.4;stroke-dasharray:none}

/* First-visit World Welcome dialog */
#nqWelcome{position:fixed;inset:0;z-index:260;background:color-mix(in srgb,var(--hud) 78%,transparent);display:none;align-items:center;justify-content:center;padding:16px}
#nqWelcome.open{display:flex}
.wl-card{max-width:540px;width:100%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 16px 40px var(--shadow);padding:20px 22px}
.wl-ey{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-size:.95rem}
.wl-card h2{margin:4px 0 12px;font-size:2rem}
.wl-card .wl-act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}

/* NumQuest art layer: hero scrims, expedition mission deck, boss modal & defeated stamp */
.heroin{position:relative;z-index:1;max-width:68ch}
.scrim{position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,color-mix(in srgb,var(--paper) 94%,transparent) 0%,color-mix(in srgb,var(--paper) 84%,transparent) 48%,color-mix(in srgb,var(--paper) 36%,transparent) 82%,color-mix(in srgb,var(--paper) 18%,transparent) 100%)}
@media (max-width:680px){
  .scrim{background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 92%,transparent) 0%,color-mix(in srgb,var(--paper) 84%,transparent) 70%,color-mix(in srgb,var(--paper) 72%,transparent) 100%)}
}

/* World map subtle background art */
.map{position:relative}
.map.has-art::before{content:"";position:absolute;inset:0;background-image:var(--map-bg);background-size:cover;background-position:center;opacity:.14;pointer-events:none}
.map.has-art svg{position:relative;z-index:1;background:transparent}

/* Expedition stage cards (#exped) */
.exped{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.xcard{background:var(--paper);border:2px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .12s,border-color .12s}
.xcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.xcard.done{border-color:var(--good)}
.xcard-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.xcard-no{font-family:var(--f-disp);font-weight:700;font-size:.92rem;letter-spacing:.08em;padding:1px 7px;background:var(--ink);color:var(--paper);text-transform:uppercase}
.xcard.done .xcard-no{background:var(--gold);color:var(--on-gold)}
.xcard h3{font-size:1.2rem;margin:0}
.xcard-sub{font-size:.88rem;color:var(--muted);line-height:1.4;margin:0;flex:1}
.xcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;border-top:1px dashed var(--soft);font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.xboss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 4%,var(--paper))}
.xboss.locked{opacity:.75;border-style:dashed}
.xboss.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 5%,var(--paper))}

/* Bossbar + defeated stamp */
.bossbar{position:relative;overflow:hidden}
.bossbar.dead{border-color:var(--good)}
.bossbar.dead::after{content:"DEFEATED";position:absolute;right:18px;top:50%;transform:translateY(-50%) rotate(-12deg);border:3px solid var(--good);color:var(--good);font-family:var(--f-disp);font-weight:700;font-size:1.4rem;letter-spacing:.16em;padding:2px 10px;background:color-mix(in srgb,var(--hud) 86%,transparent);pointer-events:none}

/* Boss intro / victory story card */
.bosscard{background:var(--paper);border:3px solid var(--bad);padding:16px 18px;margin:16px 0}
.bosscard.win{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,var(--paper))}
.bc-grid{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
.bc-art{width:120px;height:120px;object-fit:cover;border:2px solid var(--ink);background:var(--plot)}
.bc-tag{font-family:var(--f-disp);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--bad);font-size:.95rem}
.bosscard.win .bc-tag{color:var(--good)}
.bc-body h3{font-size:1.5rem;margin:2px 0 6px}
.bc-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
@media (max-width:560px){
  .bc-grid{grid-template-columns:1fr}
  .bc-art{width:96px;height:96px}
}

<script>
(function(){
'use strict';
'use strict';
/* =====================================================================
   NumQuest Shared Engine — core1a.js (DOM, plot helpers, state, sound, HUD)
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const G=9.81;
const minus=s=>String(s).replace(/-/g,'−');
const fmt=(v,d=4)=>(v==null||!isFinite(v))?'—':minus(v.toFixed(d));
const numParse=s=>{
  const str=String(s).trim().replace(/−/g,'-');
  if(!str)return null;
  const clean=/^[+-]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(str)?str.replace(/,/g,''):str.replace(',','.');
  const v=Number(clean);
  return(clean===''||!isFinite(v))?null:v;
};

/* ---------- shared SVG plot builder ---------- */
function niceTicks(a,b,n=6){
  const span=b-a,raw=span/n;
  if(!isFinite(span)||span<=0)return [a];
  const p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;
  const step=(m<1.5?1:m<3?2:m<7?5:10)*p,out=[];
  for(let v=Math.ceil(a/step-1e-9)*step;v<=b+1e-9;v+=step)out.push(+v.toPrecision(12));
  return out;
}
function plot(id,xr,yr,o={}){
  const W=640,H=o.h||300,ml=o.ml||50,mr=o.mr||14,mt=o.mt||12,mb=o.mb||30,pw=W-ml-mr,ph=H-mt-mb;
  const cl=v=>Math.max(-1e5,Math.min(1e5,v));
  const sx=x=>cl(ml+(x-xr[0])/(xr[1]-xr[0])*pw), sy=y=>cl(mt+ph-(y-yr[0])/(yr[1]-yr[0])*ph);
  const P={sx,sy,W,H,ml,mr,mt,mb,pw,ph};
  let g='';
  niceTicks(xr[0],xr[1],7).forEach(t=>{g+=`<line class="gl" x1="${sx(t)}" x2="${sx(t)}" y1="${mt}" y2="${mt+ph}"/><text class="tk" x="${sx(t)}" y="${H-10}" text-anchor="middle">${minus(t)}</text>`;});
  niceTicks(yr[0],yr[1],6).forEach(t=>{g+=`<line class="gl" y1="${sy(t)}" y2="${sy(t)}" x1="${ml}" x2="${ml+pw}"/><text class="tk" x="${ml-6}" y="${sy(t)+4}" text-anchor="end">${minus(t)}</text>`;});
  if(yr[0]<0&&yr[1]>0)g+=`<line class="ax" x1="${ml}" x2="${ml+pw}" y1="${sy(0)}" y2="${sy(0)}"/>`;
  if(xr[0]<0&&xr[1]>0)g+=`<line class="ax" y1="${mt}" y2="${mt+ph}" x1="${sx(0)}" x2="${sx(0)}"/>`;
  P.curve=(f,cls,n=320)=>{let d='',pen=false;
    for(let i=0;i<=n;i++){const x=xr[0]+(xr[1]-xr[0])*i/n,y=f(x);
      if(!isFinite(y)||Math.abs(y)>1e4){pen=false;continue}
      d+=(pen?'L':'M')+sx(x).toFixed(1)+' '+sy(y).toFixed(1);pen=true;}
    return `<path d="${d}" class="${cls}" fill="none"/>`;};
  P.line=(x1,y1,x2,y2,cls)=>`<line class="${cls}" x1="${sx(x1)}" y1="${sy(y1)}" x2="${sx(x2)}" y2="${sy(y2)}"/>`;
  P.dot=(x,y,cls,r=4.5)=>`<circle class="${cls}" cx="${sx(x)}" cy="${sy(y)}" r="${r}"/>`;
  P.vline=(x,cls)=>`<line class="${cls}" x1="${sx(x)}" x2="${sx(x)}" y1="${mt}" y2="${mt+ph}"/>`;
  P.hline=(y,cls)=>`<line class="${cls}" x1="${ml}" x2="${ml+pw}" y1="${sy(y)}" y2="${sy(y)}"/>`;
  P.band=(x1,x2,cls)=>`<rect class="${cls}" x="${sx(x1)}" y="${mt}" width="${Math.max(2,sx(x2)-sx(x1))}" height="${ph}"/>`;
  P.text=(x,y,t,anchor='middle')=>`<text class="ptxt" x="${sx(x)}" y="${y}" text-anchor="${anchor}">${t}</text>`;
  P.path=(pts,cls)=>`<polyline class="${cls}" fill="none" points="${pts.map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' ')}"/>`;
  P.poly=(pts,cls)=>`<polygon class="${cls}" points="${pts.map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' ')}"/>`;
  P.wrap=inner=>`<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||'plot'}"><defs><clipPath id="${id}"><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}"/></clipPath></defs>${g}<g clip-path="url(#${id})">${inner}</g></svg>`;
  return P;
}

/* ---------- state ---------- */
const fresh=()=>({xp:0,streak:0,best:0,ex:{},labs:{},badges:{},clear:{},bossBonus:false,bossForce:false,bossSeen:false,teacher:false,sfx:true,theme:''});
let S=fresh();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(fresh(),o)}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- sound ---------- */
let AC=null;
function tone(f,d,type='square',v=.04,when=0){
  if(!S.sfx)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+when;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);}catch(e){}
}
const sfx={
  ok(){tone(660,.1);tone(990,.16,'square',.04,.09)},
  no(){tone(180,.28,'sawtooth',.05)},
  up(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.04,i*.1))},
  clear(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.06,i*.09))}
};

/* ---------- FX ---------- */
function floatText(txt,anchor,cls=''){
  const r=anchor?anchor.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const d=document.createElement('div');d.className='float '+cls;d.textContent=txt;
  d.style.left=Math.max(8,Math.min(innerWidth-90,r.left+r.width/2-30))+'px';d.style.top=Math.max(70,r.top)+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1150);
}
let bnT=null;
function banner(big,small){
  $('#bnBig').textContent=big;$('#bnSmall').textContent=small||'';const b=$('#banner');b.classList.add('show');
  clearTimeout(bnT);bnT=setTimeout(()=>b.classList.remove('show'),1700);
}
function toast(t,s){const d=document.createElement('div');d.className='toast';d.innerHTML=`<b>${t}</b><span>${s||''}</span>`;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3600)}

/* ---------- levels / XP / HUD ---------- */
function level(xp){let i=0;LEVELS.forEach((l,k)=>{if(xp>=l[0])i=k});return i}
function award(n,anchor){
  if(n<=0)return;
  const before=level(S.xp);S.xp+=n;floatText('+'+n+' XP',anchor);
  const after=level(S.xp);
  if(after>before){sfx.up();banner('Level up!',LEVELS[after][1])}
  save();hud();
}
function grant(id){
  if(S.badges[id])return;const b=BADGES.find(x=>x[0]===id);if(!b)return;
  S.badges[id]=1;toast('Badge: '+b[1],b[2]);save();hud();renderBadges();
}
function hud(){
  const L=level(S.xp),cur=LEVELS[L][0],nxt=LEVELS[L+1]?LEVELS[L+1][0]:null;
  $('#lvNum').textContent=L+1;$('#lvName').textContent=LEVELS[L][1];
  $('#xpFill').style.width=(nxt?Math.min(100,(S.xp-cur)/(nxt-cur)*100):100)+'%';
  $('#xpNum').textContent=nxt?`${S.xp} / ${nxt} XP to ${LEVELS[L+1][1]}`:`${S.xp} XP · top rank`;
  $('#xpTot').textContent=S.xp;
  $('#combo').textContent='x'+S.streak;$('#comboChip').classList.toggle('hot',S.streak>=3);
  $('#bdg').textContent=Object.keys(S.badges).length+'/'+BADGES.length;
  $('#sfxBtn').setAttribute('aria-pressed',S.sfx);$('#teachBtn').setAttribute('aria-pressed',S.teacher);
  document.body.classList.toggle('teacher',S.teacher);
  const h=$('#hud');if(h)document.documentElement.style.setProperty('--hudh',h.offsetHeight+'px');
}

'use strict';
/* =====================================================================
   NumQuest Shared Engine — core1b.js (VIZ mounts, view builder, map, boss card)
   ===================================================================== */
window.NQ_VIZ=window.NQ_VIZ||{};
function vizFor(id,ex){
  const fn=window.NQ_VIZ&&window.NQ_VIZ[id];
  if(!fn)return '';
  try{
    const out=fn(ex);
    if(!out)return '';
    return out.includes('class="viz')?out:`<div class="viz">${out}</div>`;
  }catch(err){return '';}
}
function mountViz(root=document){
  $$('[data-viz]',root).forEach(el=>{
    if(el.dataset.mounted)return;
    const key=el.dataset.viz,fn=window.NQ_VIZ&&window.NQ_VIZ[key];
    if(!fn)return;
    try{const html=fn(el);if(html){el.innerHTML=html;el.dataset.mounted='1'}}catch(err){}
  });
}
function enhanceProfCallouts(root=document){
  if(typeof ART==='undefined'||!ART.guide)return;
  $$('.callout.chief, .callout.prof',root).forEach(box=>{
    if($('.chiefline',box))return;
    const tag=$('.tag',box);
    const wrap=document.createElement('div');wrap.className='chiefline';
    const img=document.createElement('img');img.className='chiefface';
    img.src=ART.guide;img.alt=ART.guideName||'Course guide portrait';
    const body=document.createElement('div');
    Array.from(box.childNodes).forEach(ch=>{if(ch!==tag)body.appendChild(ch)});
    wrap.appendChild(img);wrap.appendChild(body);
    box.appendChild(wrap);
  });
}

const STAGE_BONUS=(typeof STAGE_XP!=='undefined')?STAGE_XP:40;
const BOSS_BONUS=(typeof BOSS_XP!=='undefined')?BOSS_XP:60;
const exSum=id=>EX[id].reduce((a,e)=>a+e.xp,0);
const totalXP=()=>STAGES.reduce((a,s)=>a+exSum(s.id)+STAGE_BONUS+s.labs.reduce((b,l)=>b+(LABXP[l]||0),0),0)+exSum('boss')+BOSS_BONUS;
const VIEWS=()=>['home',...STAGES.map(s=>s.id),'boss'];

function exHTML(e){
  const kind={mcq:'Multiple choice',tf:'True or false',num:'Numeric answer',fill:'Fill the table',classify:'Sort it',order:'Put in order'}[e.type];
  let b='';
  if(e.type==='mcq'||e.type==='tf')b=`<div class="opts">${e.opts.map((o,j)=>`<button type="button" class="opt" data-j="${j}"><span class="key">${'ABCD'[j]}</span><span>${o}</span></button>`).join('')}</div>`;
  if(e.type==='num')b=`<div class="numrow"><input class="numin" id="${e.id}-in" type="text" inputmode="decimal" autocomplete="off" placeholder="your answer" aria-label="Answer"><span class="unit">${e.unit||''}</span></div>`;
  if(e.type==='fill')b=`<div class="fillgrid">${e.fields.map((f,j)=>`<label class="fld">${f.k}<input id="${e.id}-f${j}" data-j="${j}" type="text" inputmode="decimal" autocomplete="off"></label>`).join('')}</div>`;
  if(e.type==='classify')b=`<div class="rows">${e.items.map((it,j)=>`<div class="row" data-j="${j}"><span>${it[0]}</span><span class="seg">${e.cats.map((c,k)=>`<button type="button" data-k="${k}">${c}</button>`).join('')}</span></div>`).join('')}</div>`;
  if(e.type==='order')b=`<div class="rows" data-order>${e.perm.map((p,i)=>`<div class="row orow" data-idx="${p}"><span class="pos">${i+1}</span><span>${e.items[p]}</span><span class="mv"><button type="button" data-mv="-1" aria-label="Move up">▲</button><button type="button" data-mv="1" aria-label="Move down">▼</button></span></div>`).join('')}</div>`;
  const viz=vizFor(e.id,e);
  return `<div class="ex" id="ex-${e.id}" data-id="${e.id}"><div class="ex-top"><span class="ex-kind">${kind}</span><span class="ex-xp"><span class="nut"></span>${e.xp} XP</span><span class="ex-state">Open</span></div>
  <div class="ex-q">${e.q}</div>${e.pre||''}${b}
  <div class="ex-act"><button type="button" class="btn primary" data-act="check">Check</button><button type="button" class="btn ghost" data-act="show">Show solution</button></div>
  <div class="fb" aria-live="polite"></div><div class="sol"><b class="h">Worked solution</b><span class="solt">${e.sol}</span>${viz}</div></div>`;
}
const findEx=id=>{for(const k in EX){const e=EX[k].find(x=>x.id===id);if(e)return e}};

function heroArtHTML(){
  if(typeof ART!=='undefined'&&ART.hero)return `<div class="heroart"><img src="${ART.hero}" alt="${ART.heroAlt||WORLD.title}"></div><div class="scrim"></div>`;
  if(typeof WORLD!=='undefined'&&WORLD.heroSVG)return `<div class="heroart">${WORLD.heroSVG()}</div><div class="scrim"></div>`;
  return '';
}

function stageHero(st){
  const stageXP=exSum(st.id)+st.labs.reduce((a,l)=>a+(LABXP[l]||0),0)+STAGE_BONUS;
  return `<div class="hero">${heroArtHTML()}<div class="heroin"><div class="eyebrow">Stage ${st.no} · ${WORLD.subtitle}</div><h1>${st.title}</h1>
  <p class="mission"><b>Mission</b> &nbsp;${st.mission}</p></div>
  <div class="tblock"><div><span>Sheet</span><b>${st.no}</b></div><div><span>Time</span><b>${st.time}</b></div><div><span>Labs</span><b>${st.labs.length}</b></div><div><span>Checkpoints</span><b>${EX[st.id].length}</b></div><div><span>XP on sheet</span><b>${stageXP}</b></div><div><span>Stars</span><b class="stars" id="hs-${st.id}"></b></div></div></div>
  <div class="track" id="tr-${st.id}"></div>`;
}

function expedHTML(){
  const starStr=n=>'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span>';
  const cards=STAGES.map(st=>{
    const s=stageStats(st.id);
    return `<div class="xcard ${S.clear[st.id]?'done':''}" role="button" tabindex="0" data-go="#${st.id}">
      <div class="xcard-top"><span class="xcard-no">${st.no}</span><span class="stars">${starStr(s.stars)}</span></div>
      <h3>${st.title}</h3>
      <p class="xcard-sub">${st.mission}</p>
      <div class="xcard-foot"><span>${s.done}/${s.total} checks · ${s.labs}/${st.labs.length} labs</span><span>Open →</span></div>
    </div>`;
  }).join('');
  const hit=EX.boss.filter(x=>S.ex[x.id]&&S.ex[x.id].st==='ok').length;
  const okN=k=>EX[k].filter(e=>S.ex[e.id]&&S.ex[e.id].st==='ok').length;
  const have=STAGES.reduce((a,s)=>a+okN(s.id),0),total=STAGES.reduce((a,s)=>a+EX[s.id].length,0);
  const need=Math.ceil((WORLD.boss.needPct||.67)*total),unlocked=S.teacher||have>=need,dead=hit===EX.boss.length;
  const bState=dead?'Defeated ★':(unlocked?'Gate open · '+hit+'/'+EX.boss.length:'Locked · '+have+'/'+need);
  const bossTile=`<div class="xcard xboss ${dead?'done':(!unlocked?'locked':'')}" role="button" tabindex="0" data-go="#boss">

function stageNav(id){
  const order=[...STAGES.map(s=>s.id),'boss'];
  const idx=order.indexOf(id);
  const labelFor=k=>{
    if(k==='boss')return WORLD.boss.title;
    const s=STAGES.find(x=>x.id===k);return s?`${s.no} ${s.title}`:k;
  };
  const prevBtn=idx>0?`<a class="btn" href="#${order[idx-1]}">← ${labelFor(order[idx-1])}</a>`:`<a class="btn" href="#home">← World Map</a>`;
  let nextBtn='';
  if(idx>=0&&idx<order.length-1){
    const nk=order[idx+1];
    nextBtn=`<a class="btn primary" href="#${nk}">${nk==='boss'?'Boss: ':''}${labelFor(nk)} →</a>`;
  }else if(id==='boss'&&WORLD.nextWorld){
    nextBtn=`<a class="btn primary" href="${WORLD.nextWorld.href}">Next: ${WORLD.nextWorld.title} →</a>`;
  }else{
    nextBtn=`<a class="btn primary" href="#home">Course Overview →</a>`;
  }
  return `<nav class="stagenav" aria-label="Stage navigation">${prevBtn}<a class="btn ghost" href="#home">Overview</a>${nextBtn}</nav>`;
}

const RULE={
  trap(f,a,b,N){const h=(b-a)/N;let s=0;for(let i=1;i<N;i++)s+=f(a+i*h);return h/2*(f(a)+f(b)+2*s)},
  s13(f,a,b,N){const h=(b-a)/N;let o=0,e=0;for(let i=1;i<N;i++){if(i%2)o+=f(a+i*h);else e+=f(a+i*h)}return h/3*(f(a)+4*o+2*e+f(b))},
  s38(f,a,b,N){const h=(b-a)/N;let s=0;for(let i=0;i<N;i+=3){const x=a+i*h;s+=f(x)+3*f(x+h)+3*f(x+2*h)+f(x+3*h)}return 3*h/8*s},
  left(f,a,b,N){const h=(b-a)/N;let s=0;for(let i=0;i<N;i++)s+=f(a+i*h);return h*s},
  right(f,a,b,N){const h=(b-a)/N;let s=0;for(let i=1;i<=N;i++)s+=f(a+i*h);return h*s},
  mid(f,a,b,N){const h=(b-a)/N;let s=0;for(let i=0;i<N;i++)s+=f(a+(i+.5)*h);return h*s}
};

function gauss(f,a,b,n){const G=GAUSS[n],c=(b-a)/2,m=(a+b)/2;let s=0;for(let i=0;i<n;i++)s+=G.w[i]*f(c*G.t[i]+m);return c*s}
function lagr(xs,ys,x){let r=0;for(let i=0;i<xs.length;i++){let t=ys[i];for(let j=0;j<xs.length;j++)if(j!==i)t*=(x-xs[j])/(xs[i]-xs[j]);r+=t}return r}

 {id:'t1',type:'mcq',xp:10,q:'Which of these jobs genuinely needs numerical integration?',
  opts:['Finding the volume of flood water from hourly discharge readings that exist only as a table','Evaluating $\\int_{0}^{2} x^{2}\\,dx$','Evaluating $\\int \\cos x\\,dx$','Finding the area of a rectangle'],a:0,
  hint:'Which one gives you numbers but no formula to integrate?',sol:'When the integrand is a set of discrete points (measurements, simulation output) or has no easy antiderivative, you cannot integrate by hand. You add up weighted function values instead. The other three have simple exact answers.'},
 {id:'t2',type:'classify',xp:20,q:'Closed methods use the end points of the interval in the formula. Open methods do not. Sort the six rules from the lecture.',cats:['Closed','Open'],
  items:[['Trapezoidal',0],['Simpson’s 1/3',0],['Simpson’s 3/8',0],['Rectangle and midpoint',1],['Gauss quadrature',1]],
  hint:'Ask whether $f(a)$ and $f(b)$ appear in the formula.',sol:'Trapezoidal and both Simpson rules always include $f(a)$ and $f(b)$, so they are closed. The rectangle, midpoint and Gauss rules use points inside the interval, so they are open. Stage 4-1 and 4-2 cover closed methods, 4-3 and 4-4 cover open ones.'},
 {id:'t3',type:'num',xp:10,q:'The airplane stopping problem needs $x = \\int_{93}^{40} f(v)\\,dv$ with $f(v) = -97000v/(5v^{2} + 570000)$. Use one trapezoid with $f(93) = -14.71027$ and $f(40) = -6.71280$.',a:567.7114,t:.01,unit:'m',
  hint:'$I \\approx \\dfrac{f(a)+f(b)}{2}(b-a)$ with $b - a = 40 - 93 = -53$.',sol:'$I \\approx \\dfrac{-14.71027 - 6.71280}{2}(-53) = (-10.71154)(-53) = 567.7114$ m. The exact answer is 574.1494 m, so one trapezoid is already within 1.1%.'},
 {id:'t4',type:'fill',xp:20,q:'A flood hydrograph records discharge $Q$ (m³/s) once an hour for six hours. Use the composite trapezoidal rule to find the volume of water that passed. One hour is 3600 s.',

  sol:'Interior values: $12 + 30 + 41 + 33 + 18 = 134$. $V \\approx 1800\\,[0 + 2(134) + 6] = 1800 \\times 274 = 493\\,200$ m³, about 0.49 million cubic metres.'},
 {id:'t5',type:'num',xp:10,q:'Composite trapezoidal rule on the airplane problem: limits $a = 93$ and $b = 40$ m/s, with $N = 10$ subintervals. What is the step $h = (b - a)/N$?',a:-5.3,t:.0005,unit:'m/s',
  hint:'$(40 - 93)/10$. Keep the sign.',sol:'$h = (40 - 93)/10 = -5.3$ m/s. It is negative because you step from the high speed down to the low speed. The eleven nodes are 93, 87.7, 82.4, … 40.'},
 {id:'t6',type:'fill',xp:25,q:'Finish the composite trapezoidal calculation for the airplane with $N = 10$ and $h = -5.3$. The end values are $f(93) = -14.71027$ and $f(40) = -6.71280$. The nine interior values $f(87.7)$ to $f(45.3)$ are −13.98112, −13.23423, −12.47028, −11.68996, −10.89407, −10.08345, −9.25901, −8.42173 and −7.57263.',
  fields:[{k:'$\\sum$ interior $f$',a:-97.6065,t:.002},{k:'$x$ (m)',a:574.0855,t:.005}],
  hint:'Add the nine interior values first. Then $I \\approx (h/2)[f(a) + f(b) + 2\\sum]$.',
  sol:'$\\sum = -97.60648$. $I \\approx (-5.3/2)[-14.71027 - 6.71280 + 2(-97.60648)] = (-2.65)(-216.64603) = 574.0855$ m. Negative $h$ times negative sums gives a positive distance.'},
 {id:'t7',type:'tf',xp:10,q:'For the composite trapezoidal rule, doubling the number of subintervals cuts the error by about a factor of 4.',opts:['True','False'],a:0,
  hint:'The error is proportional to $h^{2}$. What happens to $h$ when $N$ doubles?',sol:'Halving $h$ divides an $O(h^{2})$ error by $2^{2} = 4$. For the airplane problem the errors at $N = 10, 20, 40$ are 0.0639, 0.0160 and 0.0040 m. Each is one quarter of the one before.'},
 {id:'t8',type:'num',xp:15,q:'The exact stopping distance is 574.1494 m. What is the true percent relative error of the one-trapezoid answer 567.7114 m?',a:1.12,t:.01,unit:'%',
  hint:'$|(\\text{true} - \\text{estimate})/\\text{true}| \\times 100$.',sol:'$|574.1494 - 567.7114|/574.1494 \\times 100 = 6.438/574.1494 \\times 100 = 1.12\\%$. With $N = 10$ the error drops to 0.011%, and with $N = 1000$ it is invisible at four decimals.'},
 {id:'t9',type:'mcq',xp:10,q:'A curve bends upward like $y = x^{2}$ (concave up). Each trapezoid’s sloping top is a chord. What does the trapezoidal rule do to the area?',
  opts:['It overestimates, because each chord lies above the curve','It underestimates, because each chord lies below the curve','It is exact for any curve','It depends only on $N$'],a:0,
  hint:'Draw a chord across the bowl of a parabola. Which side of the curve is it on?',sol:'For a concave-up curve the chord sits above the curve, so the trapezoid has extra area. For $\\int_{0}^{2} x^{2}\\,dx$ one trapezoid gives 4 against the exact $8/3 = 2.667$. A concave-down curve gives an underestimate.'},
 {id:'t10',type:'order',xp:15,q:'Put the steps of the composite trapezoidal rule in order.',
  items:['Choose $N$ and compute $h = (b - a)/N$','List the nodes $x_{i} = a + (i - 1)h$','Evaluate $f$ at every node','Add the two end values to twice the sum of the interior values','Multiply by $h/2$ and check the sign and units'],perm:[2,4,0,3,1],
  hint:'You need $h$ before you can place nodes, and nodes before you can evaluate $f$.',sol:'Choose $N$ and $h$, place the nodes, evaluate, form the weighted sum (ends once, interior twice), then multiply by $h/2$.'},
 {id:'t11',type:'mcq',xp:10,q:'In the airplane problem both $f(v)$ and $h = -5.3$ are negative. What is the sign of the computed distance, and why?',
  opts:['Positive. A negative $h$ times a negative sum is positive','Negative. The airplane moves backwards','Zero. The two signs cancel','It depends on $N$'],a:0,
  hint:'Multiply the two negatives.',sol:'$f$ is negative because speed is falling, and $h$ is negative because the limits run from high to low. The product is positive, as a distance should be. Reversing the limits of an integral flips its sign, so keep track of the order.'}
],
simp:[
 {id:'s1',type:'mcq',xp:10,q:'Simpson’s 1/3 rule replaces the integrand on each pair of subintervals with what?',
  opts:['A quadratic through three points: both ends and the midpoint','A straight line through two points','A cubic through four points','A constant equal to the middle value'],a:0,
  hint:'The 1/3 rule needs $x_{1} = a$, $x_{3} = b$ and the midpoint $x_{2}$.',sol:'Three points fix a parabola. Integrating it gives $I \\approx (h/3)[f(a) + 4f(m) + f(b)]$ with $h = (b - a)/2$. The cubic version is the 3/8 rule.'},
 {id:'s2',type:'num',xp:15,q:'Simpson’s 1/3 rule, single application, on the airplane problem. $f(93) = -14.71027$, $f(66.5) = -10.89407$ and $f(40) = -6.71280$. Find $x$.',a:574.1609,t:.01,unit:'m',
  hint:'$h = (b - a)/2 = -26.5$. $I \\approx (h/3)[f(a) + 4f(m) + f(b)]$.',sol:'$I \\approx (-26.5/3)[-14.71027 + 4(-10.89407) - 6.71280] = (-8.8333)(-64.99935) = 574.1609$ m. One parabola is off by 0.011 m, compared with 6.4 m for one trapezoid.'},
 {id:'s3',type:'num',xp:15,q:'Simpson’s 3/8 rule, single application. The four equally spaced points are $v = 93, 75.3333, 57.6667, 40$ with $f = -14.71027, -12.21195, -9.53530, -6.71280$. Find $x$.',a:574.1545,t:.01,unit:'m',
  hint:'$h = (b - a)/3 = -17.6667$. $I \\approx (3h/8)[f_{1} + 3f_{2} + 3f_{3} + f_{4}]$.',sol:'$I \\approx (3(-17.6667)/8)[-14.71027 + 3(-12.21195) + 3(-9.53530) - 6.71280] = (-6.625)(-86.6648) = 574.1545$ m.'},
 {id:'s4',type:'classify',xp:20,q:'Which composite Simpson rule can you apply to each number of equal subintervals $N$? The 1/3 rule needs an even $N$. The 3/8 rule needs $N$ divisible by 3.',cats:['1/3 only','3/8 only','Both','Neither'],

  hint:'Test each $N$ for evenness and for divisibility by 3.',sol:'10 is even but not divisible by 3, so only 1/3. 9 is odd but divisible by 3, so only 3/8. 12 and 6 are both. 7 is neither. For an awkward $N$ you can mix the two rules on different parts of the range.'},
 {id:'s5',type:'fill',xp:25,q:'Composite Simpson’s 1/3 on the airplane problem with $N = 12$, so $h = -4.41667$. The 13 nodes are $x_{1}$ to $x_{13}$. The six points $x_{2}, x_{4}, \\ldots, x_{12}$ get weight 4 and the five points $x_{3}, x_{5}, \\ldots, x_{11}$ get weight 2. Their sums of $f$ are given by the table. Find the sums and the distance.',
  pre:'<div class="tw"><table><thead><tr><th>Weight</th><th>Nodes</th><th>$f$ values</th></tr></thead><tbody><tr><td>4</td><td>$x_{2}, x_{4}, \\ldots, x_{12}$</td><td>−14.10389, −12.85435, −11.55837, −10.21954, −8.84191, −7.43004</td></tr><tr><td>2</td><td>$x_{3}, x_{5}, \\ldots, x_{11}$</td><td>−13.48513, −12.21195, −10.89407, −9.53530, −8.13996</td></tr></tbody></table></div>',
  fields:[{k:'$\\sum$ (weight 4)',a:-65.0081,t:.002},{k:'$\\sum$ (weight 2)',a:-54.2664,t:.002},{k:'$x$ (m)',a:574.1494,t:.003}],
  hint:'Add each group. Then $I \\approx (h/3)[f(a) + 4\\sum_{4} + 2\\sum_{2} + f(b)]$.',
  sol:'$\\sum_{4} = -65.00810$ and $\\sum_{2} = -54.26640$. $I \\approx (-4.41667/3)[-14.71027 + 4(-65.0081) + 2(-54.2664) - 6.71280] = (-1.47222)(-390.0054) = 574.1494$ m. That matches the exact value to four decimals.'},
 {id:'s6',type:'num',xp:15,q:'Use one application of Simpson’s 1/3 rule to estimate $\\int_{1}^{3} x^{3}\\,dx$. The exact value is 20.',a:20,t:.001,
  hint:'$h = 1$, the midpoint is $x = 2$. $I \\approx (1/3)[f(1) + 4f(2) + f(3)]$.',sol:'$I \\approx (1/3)[1 + 4(8) + 27] = 60/3 = 20$. Exactly right. Simpson’s rule integrates every cubic exactly, even though it only fits a parabola.'},
 {id:'s7',type:'mcq',xp:10,q:'What is the highest-degree polynomial that Simpson’s 1/3 rule integrates exactly?',
  opts:['Degree 3 (cubic)','Degree 2 (quadratic)','Degree 1 (line)','Degree 4'],a:0,
  hint:'You just saw it with $x^{3}$.',sol:'The $x^{3}$ error terms cancel by symmetry about the midpoint, so cubics are exact. The first function that breaks the rule is $x^{4}$. That is why the error behaves like $h^{4}$.'},
 {id:'s8',type:'fill',xp:25,q:'A river cross-section is surveyed every 3 m across a 24 m width. Depths (m) are listed. Find the flow area with the composite trapezoidal rule and with the composite Simpson’s 1/3 rule ($N = 8$).',
  pre:hzt([0,3,6,9,12,15,18,21,24],[0,0.8,1.6,2.2,2.5,2.3,1.7,0.9,0],'$x$ (m)','depth (m)'),
  fields:[{k:'Trapezoid (m²)',a:36,t:.01},{k:'Simpson 1/3 (m²)',a:36.4,t:.01}],
  hint:'Trapezoid: $(h/2)[f_{0} + 2\\sum_{\\text{interior}} + f_{8}]$. Simpson: $(h/3)[f_{0} + 4(f_{1} + f_{3} + f_{5} + f_{7}) + 2(f_{2} + f_{4} + f_{6}) + f_{8}]$.',
  sol:'Interior sum $= 12.0$, so trapezoid $= 1.5(0 + 24 + 0) = 36.0$ m². Odd-position depths sum to 6.2 and even-position to 5.8, so Simpson $= 1(0 + 24.8 + 11.6 + 0) = 36.4$ m². Simpson follows the curved bed better, and the area is 1% larger.'},
 {id:'s9',type:'num',xp:15,q:'Simpson’s rules have error proportional to $h^{4}$. If you double the number of subintervals, by what factor does the error fall?',a:16,t:.5,unit:'times',
  hint:'Halving $h$ divides $h^{4}$ by $2^{4}$.',sol:'$2^{4} = 16$. For the airplane with $N = 4, 8, 16$ the errors are $7.0\\times 10^{-4}$, $4.4\\times 10^{-5}$ and $2.7\\times 10^{-6}$ m, each about 16 times smaller than the last. The trapezoid rule only gains a factor of 4.'},
 {id:'s10',type:'order',xp:15,q:'Put the steps of the composite Simpson’s 1/3 rule in order.',
  items:['Check that $N$ is even and the spacing is equal','Compute $h = (b - a)/N$ and the node values','Add the odd-numbered interior nodes and multiply by 4','Add the even-numbered interior nodes and multiply by 2','Add $f(a)$ and $f(b)$ and multiply the total by $h/3$'],perm:[3,0,4,1,2],
  hint:'Validate the data first. The $h/3$ comes last.',sol:'Check $N$, build $h$ and values, weight the interior points 4 and 2 alternately, add the end points, then multiply by $h/3$.'},
 {id:'s11',type:'tf',xp:10,q:'Simpson’s 3/8 rule uses a cubic instead of a parabola, so it is far more accurate than the 1/3 rule for the same $h$.',opts:['True','False'],a:1,
  hint:'Compare the airplane results at $N = 12$: the 1/3 rule gave an error of $8.6\\times 10^{-6}$ m.',sol:'Both rules are $O(h^{4})$ and both are exact for cubics. The 3/8 rule actually has a slightly larger error constant (about $1.9\\times 10^{-5}$ m against $8.6\\times 10^{-6}$ m here). Its real use is when $N$ is divisible by 3 but not by 2, or to finish an odd run of intervals.'}

mid:[
 {id:'m1',type:'fill',xp:20,q:'The simplest closed-form idea: replace $f(x)$ over the whole interval by one constant, the value at an end point. Apply it to the airplane with $f(93) = -14.71027$, $f(40) = -6.71280$ and $b - a = -53$.',
  fields:[{k:'Left end (m)',a:779.6444,t:.01},{k:'Right end (m)',a:355.7785,t:.01}],

 {id:'m2',type:'num',xp:10,q:'Midpoint rule, single application: use $f$ at the middle of the interval, $f((93 + 40)/2) = f(66.5) = -10.89407$.',a:577.3856,t:.01,unit:'m',

 {id:'m3',type:'fill',xp:25,q:'Composite midpoint rule on the airplane problem with $N = 10$ and $h = -5.3$. The midpoints are $v = 90.35, 85.05, \\ldots, 42.65$. Their function values add up to the number you must find first. Then multiply by $h$.',

  hint:'$I \\approx h\\sum_{i=1}^{N} f(\\text{midpoint}_{i})$. Use the sum of $f$ you found.',sol:'The ten midpoint values add to −108.33611. $I \\approx (-5.3)(-108.33611) = 574.1814$ m. The error is +0.032 m.'},
 {id:'m4',type:'num',xp:15,q:'Composite rectangle rule using the left end of each subinterval, $N = 10$, $h = -5.3$. The ten left-end values $f(93), f(87.7), \\ldots, f(45.3)$ add up to −112.3167. Find $x$.',a:595.2788,t:.01,unit:'m',
  hint:'$I \\approx h\\sum f(x_{i})$.',sol:'$I \\approx (-5.3)(-112.3167) = 595.2788$ m, an error of +21 m (3.7%). With the same ten panels, midpoint is off by 0.03 m. Moving the sample point from the edge to the middle is worth far more than adding panels.'},
 {id:'m5',type:'num',xp:15,q:'For $N = 10$ the composite midpoint error is +0.0320 m and the composite trapezoid error is −0.0639 m. How many times smaller is the midpoint error, in size?',a:2,t:.1,unit:'times',
  hint:'Divide 0.0639 by 0.0320.',sol:'$0.0639/0.0320 \\approx 2.0$. This is a general result: the midpoint rule is about twice as accurate as the trapezoidal rule and its error has the opposite sign.'},
 {id:'m6',type:'mcq',xp:10,q:'Midpoint gives 574.1814 m and trapezoid gives 574.0855 m for the airplane ($N = 10$). What does the opposite sign of their errors tell you?',
  opts:['The exact value lies between the two estimates, closer to the midpoint estimate','The exact value is outside both estimates','Both estimates are wrong by the same amount','One of the calculations must contain a mistake'],a:0,
  hint:'One estimate is too big and the other too small.',sol:'When the errors have opposite signs the true value is bracketed. Because the midpoint error is about half the trapezoid error, the exact 574.1494 lies about two thirds of the way from the trapezoid answer to the midpoint answer.'},
 {id:'m7',type:'classify',xp:20,q:'Each rule approximates $f$ on a panel by a different shape. Match each rule to that shape.',cats:['Constant','Straight line','Quadratic','Cubic'],
  items:[['Left rectangle',0],['Midpoint',0],['Trapezoidal',1],['Simpson’s 1/3',2],['Simpson’s 3/8',3]],
  hint:'Constants use one point, lines two, parabolas three and cubics four.',sol:'The rectangle and midpoint rules use one function value per panel (a constant). The trapezoid joins two points with a line. Simpson 1/3 fits a parabola through three points and Simpson 3/8 a cubic through four.'},
 {id:'m8',type:'num',xp:15,q:'Estimate $\\int_{0}^{2} x^{2}\\,dx$ with the composite midpoint rule using $N = 4$ panels ($h = 0.5$). The exact value is 2.6667.',a:2.625,t:.001,
  hint:'Midpoints are 0.25, 0.75, 1.25, 1.75. Square each, add, multiply by $h$.',sol:'$f$ values: 0.0625, 0.5625, 1.5625, 3.0625, sum 5.25. $I \\approx 0.5(5.25) = 2.625$. The error is −0.0417. The trapezoid rule with the same $N$ gives 2.75, an error of +0.0833, twice as large and of opposite sign.'},
 {id:'m9',type:'tf',xp:10,q:'For a function that is increasing over the whole interval, the left-end rectangle rule underestimates the integral.',opts:['True','False'],a:0,
  hint:'On each panel, is the left-end height lower or higher than the rest of the curve?',sol:'On an increasing curve the left end is the lowest point of each panel, so each rectangle is too short. The right-end rule overestimates. For the airplane the integrand is negative and the limits run downward, so the signs look reversed. Draw the picture to see which way it goes.'},
 {id:'m10',type:'mcq',xp:10,q:'Why is the midpoint rule called an open method?',
  opts:['Its formula never uses the function values at the end points $a$ and $b$','It can integrate open curves','It works on open intervals only for polynomials','It needs the derivative of $f$'],a:0,
  hint:'Compare with the formulas in stages 4-1 and 4-2.',sol:'Open methods sample only inside the interval. That is handy when $f$ is undefined or singular at an end point, for example $\\int_{0}^{1} dx/\\sqrt{x}$, where closed rules would try to evaluate $f(0)$.'}
],
gss:[
 {id:'g1',type:'mcq',xp:10,q:'What makes Gauss quadrature different from the trapezoidal and Simpson rules?',
  opts:['The sample points are not equally spaced and not at the ends. Points and weights are chosen together to minimise the error','It uses equally spaced points but more of them','It needs the derivative at the end points','It only works for polynomials'],a:0,
  hint:'In the earlier rules the positions were fixed first and only the weights were found.',sol:'Gauss quadrature treats the positions $x_{i}$ and the weights $C_{i}$ as unknowns. With $n$ points that gives $2n$ free numbers, enough to integrate every polynomial up to degree $2n - 1$ exactly.'},
 {id:'g2',type:'fill',xp:20,q:'Two-point Gauss quadrature on $[-1, 1]$ uses points $\\pm t$ with weights $C_{1} = C_{2} = 1$ and $t = 1/\\sqrt{3}$. Apply it to $f(x) = x^{2}$, whose exact integral is $2/3$.',
  fields:[{k:'$t = 1/\\sqrt{3}$',a:.5774,t:.0002},{k:'Gauss estimate',a:.6667,t:.0005}],
  hint:'$I \\approx f(-t) + f(t) = 2t^{2}$.',sol:'$t = 0.57735$ and $I \\approx (-0.57735)^{2} + (0.57735)^{2} = 1/3 + 1/3 = 0.6667$. Exact, because $x^{2}$ is a polynomial of degree 2 and two-point Gauss is exact up to degree 3.'},
 {id:'g3',type:'num',xp:15,q:'Two-point Gauss quadrature on $\\int_{-1}^{1}\\cos x\\,dx$. The exact value is $2\\sin 1 = 1.6829$.',a:1.6758,t:.0005,
  hint:'$I \\approx \\cos(-0.57735) + \\cos(0.57735) = 2\\cos(0.57735)$. Use radians.',sol:'$\\cos(0.57735) = 0.83791$, so $I \\approx 1.67582$. Two function values got within 0.007 of the exact result.'},
 {id:'g4',type:'num',xp:10,q:'What is the percent relative error of the two-point answer 1.6758 for $\\int_{-1}^{1}\\cos x\\,dx$ (exact 1.6829)?',a:.42,t:.01,unit:'%',
  hint:'$|1.6829 - 1.6758|/1.6829 \\times 100$.',sol:'$0.00712/1.68294 = 0.00423$, so the error is 0.42%. (The lecture slide quotes “4.2%”. Dividing carefully gives 0.42%, so that looks like a decimal-point slip.)'},

SEC.trap=`
<section class="sec"><h2><span class="no">A</span>Why add up slices?</h2>
<div class="prose"><p>An integral is an area under a curve:</p>
<div class="formula">$$I(f)=\\int_{a}^{b} f(x)\\,dx$$</div>
<p>Engineers meet integrals constantly: the volume of water under a hydrograph, the work done by a variable force, the length of a curved cable, the area of a river cross-section. If the antiderivative is easy, integrate by hand. But often the integrand is only a <b>table of measurements</b>, or it has no neat antiderivative. Then you approximate the area from function values:</p>
<ul class="tight"><li><b>Closed methods</b> use the end points $f(a)$ and $f(b)$: trapezoidal and Simpson (this stage and 4-2).</li><li><b>Open methods</b> sample only inside the interval: rectangle, midpoint and Gauss (stages 4-3 and 4-4).</li></ul></div>
<div class="callout prof"><span class="tag">Prof says</span><p>Our running example is a Boeing 737-200 landing at 93 m/s and fighting its thrust reversers. Newton’s law gives $m\\,v\\,dv/dx = -5v^{2} - 570000$. Rearranged, $dx = -97000\\,v/(5v^{2}+570000)\\,dv$. The distance to slow to 40 m/s is the area under that curve. This one <i>does</i> have an exact answer, 574.1494 m, so we can grade every method against it.</p></div>
</section>

<section class="sec"><h2><span class="no">B</span>One trapezoid</h2>
<div class="prose"><p>Join $(a, f(a))$ and $(b, f(b))$ with a straight line (Newton’s first-order polynomial from World 3) and integrate it. The area is a rectangle plus a triangle, which collapses to the average height times the width:</p>
<div class="formula">$$I\\approx\\dfrac{f(a)+f(b)}{2}\\,(b-a)$$</div>
<p>For the airplane: $f(93) = ${fmt(AIR_FA,5)}$ and $f(40) = ${fmt(AIR_FB,5)}$, so $I \\approx (${fmt((AIR_FA+AIR_FB)/2,5)})(-53) = ${fmt(airN[0],4)}$ m. The exact answer is ${fmt(AX,4)} m, so one trapezoid is already within ${fmt(Math.abs(airN[0]-AX)/AX*100,2)}%.</p></div>
</section>

<section class="sec"><h2><span class="no">C</span>Composite trapezoidal rule</h2>
<div class="prose"><p>Cut $[a, b]$ into $N$ equal slices of width $h = (b - a)/N$, apply the rule to each slice and add. Interior heights are counted twice, because each belongs to two neighbouring trapezoids:</p>
<div class="formula">$$I\\approx\\dfrac{h}{2}\\left[f(a)+2\\sum_{i=2}^{N} f(x_{i})+f(b)\\right],\\qquad h=\\dfrac{b-a}{N}$$</div></div>
<div class="wx">
<div class="wx-head"><div><b>Worked example: Boeing 737 braking distance ($N = 10$ trapezoids)</b></div></div>
<div class="wx-grid">
<figure class="wx-fig"><svg class="plot" viewBox="0 0 440 240" role="img" aria-label="Composite trapezoidal rule with N=10 slices summing to 574.0855 m"><line x1="42" y1="212.0" x2="424" y2="212.0" stroke="var(--ink)" stroke-width="1.5"/><polygon class="ar" points="55.4,212.0 55.4,129.8 90.9,119.2 90.9,212.0"/><polygon class="ar" points="90.9,212.0 90.9,119.2 126.4,108.8 126.4,212.0"/><polygon class="ar" points="126.4,212.0 126.4,108.8 162.0,98.6 162.0,212.0"/><polygon class="ar" points="162.0,212.0 162.0,98.6 197.5,88.5 197.5,212.0"/><polygon class="ar" points="197.5,212.0 197.5,88.5 233.0,78.5 233.0,212.0"/><polygon class="ar" points="233.0,212.0 233.0,78.5 268.5,68.8 268.5,212.0"/><polygon class="ar" points="268.5,212.0 268.5,68.8 304.0,59.2 304.0,212.0"/><polygon class="ar" points="304.0,212.0 304.0,59.2 339.6,49.9 339.6,212.0"/><polygon class="ar" points="339.6,212.0 339.6,49.9 375.1,40.7 375.1,212.0"/><polygon class="ar" points="375.1,212.0 375.1,40.7 410.6,31.8 410.6,212.0"/><polyline points="55.4,129.8 62.1,127.8 68.8,125.8 75.5,123.8 82.2,121.8 88.9,119.8 95.6,117.9 102.3,115.9 109.0,113.9 115.7,112.0 122.4,110.0 129.1,108.1 135.8,106.1 142.5,104.2 149.2,102.2 155.9,100.3 162.6,98.4 169.3,96.5 176.0,94.6 182.7,92.7 189.4,90.8 196.1,88.9 202.8,87.0 209.5,85.1 216.2,83.2 222.9,81.3 229.6,79.5 236.4,77.6 243.1,75.8 249.8,73.9 256.5,72.1 263.2,70.3 269.9,68.4 276.6,66.6 283.3,64.8 290.0,63.0 296.7,61.2 303.4,59.4 310.1,57.6 316.8,55.9 323.5,54.1 330.2,52.3 336.9,50.6 343.6,48.8 350.3,47.1 357.0,45.4 363.7,43.6 370.4,41.9 377.1,40.2 383.8,38.5 390.5,36.8 397.2,35.1 403.9,33.5 410.6,31.8" fill="none" stroke="var(--qx)" stroke-width="2.5"/><text x="55.4" y="232" text-anchor="middle">40</text><text x="233.0" y="232" text-anchor="middle">66.5</text><text x="410.6" y="232" text-anchor="middle">93 m/s</text><text x="209.5" y="34" text-anchor="middle" style="fill:var(--good);font-weight:700">N=10 Trap = 574.0855 m</text></svg><figcaption>Ten uniform velocity slices ($| <section class="sec"><h2><span class="no">D</span>Trapezoid Slicer lab</h2>
<div class="prose"><p>Pick a curve and slide $N$. The gold trapezoids show what the rule adds up. The log-log plot shows the error against $N$ with a slope of −2, which is the $O(h^{2})$ signature. Can you push the airplane error below 0.005%?</p></div>

<div class="lab" id="lab-trz"></div>
<div class="callout ce"><span class="tag">CE link</span><p>Stream gauging, rainfall totals under a hyetograph, and the area under a stress-strain curve (toughness) are all trapezoid sums on logged data. When readings come at equal time steps, <code>trapz</code> does the whole job in one line.</p></div>
<div class="callout mat"><span class="tag">MATLAB link</span>
<pre>Q = [0 12 30 41 33 18 6];          <span class="cm">% m^3/s, hourly</span>
V = trapz(0:3600:21600, Q)         <span class="cm">% 493200 m^3</span>

f = @(v) -97000*v ./ (5*v.^2 + 570000);
v = linspace(93, 40, 11);          <span class="cm">% N = 10</span>
x = trapz(v, f(v))                 <span class="cm">% 574.0855 m</span></pre></div>
</section>`;

SEC.simp=`
<section class="sec"><h2><span class="no">A</span>Curves instead of chords</h2>
<div class="prose"><p>A straight line cannot follow a bending curve. Fit a <b>parabola</b> through three points, or a <b>cubic</b> through four, and the area under that polynomial is a much better estimate. The two rules are named after Thomas Simpson.</p></div>
</section>

<section class="sec"><h2><span class="no">B</span>Simpson’s 1/3 rule</h2>
<div class="prose"><p>Take the two end points and the midpoint $x_{2} = (a + b)/2$. The parabola through them integrates to:</p>
<div class="formula">$$I\\approx\\dfrac{h}{3}\\left[f(a)+4f\\!\\left(\\dfrac{a+b}{2}\\right)+f(b)\\right],\\qquad h=\\dfrac{b-a}{2}$$</div></div>
<div class="wx">
<div class="wx-head"><div><b>Worked example: single Simpson 1/3 parabola vs trapezoid chord</b></div></div>
<div class="wx-grid">

<div>
<ol class="wx-steps">
<li><b>Nodes ($h = -26.5$):</b> $f(93)=-14.71027$, $f(66.5)=-10.89407$, $f(40)=-6.71280$.</li>
<li><b>Apply 1/3 weights:</b> $(-26.5/3)[-14.71027 + 4(-10.89407) - 6.71280]$.</li>
<li><b>Composite ($N$ even):</b> weights $1, 4, 2, 4, 2, \\ldots, 4, 1$ hit $574.1494\\text{ m}$ at $N=12$.</li>
</ol>
<div class="wx-ans">$I_{1/3} = ${fmt(RULE.s13(AF,93,40,2),4)}$ m (within $0.0115\\text{ m}$ in one step!)</div>
</div>
</div>
</div>
<div class="prose"><p><b>Composite form.</b> Cut the range into $N$ equal slices and apply the rule to each <i>pair</i>:</p>
<div class="formula">$$I\\approx\\dfrac{h}{3}\\left[f(a)+4\\sum_{i=2,4,6,\\ldots}^{N}f(x_{i})+2\\sum_{j=3,5,7,\\ldots}^{N-1}f(x_{j})+f(b)\\right],\\quad h=\\dfrac{b-a}{N}$$</div></div>
<div class="stage-viz" data-viz="w4-simpson-parity"></div>
<div class="callout trap"><span class="tag">Trap!</span><p>Two conditions must hold: the slices must be <b>equally spaced</b>, and $N$ must be <b>even</b>. Count intervals, not points. Nine data points means eight intervals, which is fine.</p></div>
</section>

<section class="sec"><h2><span class="no">C</span>Simpson’s 3/8 rule</h2>
<div class="prose"><p>Use four points and a cubic. With $h = (b - a)/3$:</p>
<div class="formula">$$I\\approx\\dfrac{3h}{8}\\left[f(a)+3f(x_{2})+3f(x_{3})+f(b)\\right]$$</div>
<p>The composite form applies it to groups of <b>three</b> slices, so $N$ must be divisible by 3 (and at least 6 for more than one group):</p>
<div class="formula">$$I\\approx\\dfrac{3h}{8}\\left[f(a)+3\\sum_{i=2,5,8,\\ldots}^{N-1}\\left(f(x_{i})+f(x_{i+1})\\right)+2\\sum_{j=4,7,10,\\ldots}^{N-2}f(x_{j})+f(b)\\right]$$</div>
<p>On the airplane, one application gives ${fmt(RULE.s38(AF,93,40,3),4)} m. With $N = 12$ the composite 1/3 rule gives ${fmt(RULE.s13(AF,93,40,12),4)} m and the composite 3/8 rule ${fmt(RULE.s38(AF,93,40,12),4)} m. Both are exact to four decimals.</p></div>
${rowT(['Rule','Single application (m)','Composite $N=12$ (m)','Error at $N=12$ (m)'],[['Trapezoidal',fmt(RULE.trap(AF,93,40,1),4),fmt(RULE.trap(AF,93,40,12),4),ef(RULE.trap(AF,93,40,12)-AX)],['Simpson 1/3',fmt(RULE.s13(AF,93,40,2),4),fmt(RULE.s13(AF,93,40,12),4),ef(RULE.s13(AF,93,40,12)-AX)],['Simpson 3/8',fmt(RULE.s38(AF,93,40,3),4),fmt(RULE.s38(AF,93,40,12),4),ef(RULE.s38(AF,93,40,12)-AX)]])}
<div class="callout prof"><span class="tag">Prof says</span><p>Both Simpson rules have error $O(h^{4})$, so doubling $N$ shrinks the error 16-fold. The 3/8 rule does <i>not</i> beat the 1/3 rule at the same $h$. Use 3/8 when $N$ is a multiple of 3 and not of 2, or to finish an odd run: 1/3 on the first $N - 3$ intervals and 3/8 on the last three.</p></div>
</section>

<section class="sec"><h2><span class="no">D</span>Parabola Press lab</h2>
<div class="prose"><p>Choose a method and a number of panels. The orange curve is the polynomial pieces the rule integrates. Try the cubic $x^{3}$ and watch Simpson’s error vanish. Then try $x^{4}$, where it does not.</p></div>
<div class="stage-viz" data-viz="w4-cubic-exact"></div>
<div class="lab" id="lab-smp"></div>
<div class="callout ce"><span class="tag">CE link</span><p>Cross-section areas of channels, cut-and-fill earthwork volumes along a road, and the area under a load–deflection curve are classic Simpson jobs because survey stations are evenly spaced. Check that you have an even number of intervals before you start.</p></div>
<div class="callout mat"><span class="tag">MATLAB link</span>
<pre>f = @(v) -97000*v ./ (5*v.^2 + 570000);
N = 12;  v = linspace(93, 40, N+1);  h = (40-93)/N;
y = f(v);
I13 = h/3 * (y(1) + 4*sum(y(2:2:N)) + 2*sum(y(3:2:N-1)) + y(N+1))   <span class="cm">% 574.1494 m</span></pre></div>
</section>`;

SEC.mid=`
<section class="sec"><h2><span class="no">A</span>The simplest idea: one rectangle</h2>
<div class="prose"><p>Treat $f$ as a constant over the whole interval, equal to its value at one end:</p>
<div class="formula">$$I\\approx f(a)\\,(b-a)\\quad\\text{or}\\quad I\\approx f(b)\\,(b-a)$$</div>
<p>For the airplane that gives ${fmt(RULE.left(AF,93,40,1),4)} m or ${fmt(RULE.right(AF,93,40,1),4)} m. The exact answer lies between them, but both are far off. Slicing helps. The <b>composite rectangle rule</b> with $h = (b - a)/N$ is $I \\approx h\\sum f(x_{i})$, and with $N = 10$ using left ends it gives ${fmt(RULE.left(AF,93,40,10),4)} m, still 21 m too high.</p></div>
</section>

<section class="sec"><h2><span class="no">B</span>Midpoint rule</h2>
<div class="prose"><p>Move the sample point to the <b>middle</b> of the interval. The part of the curve above the rectangle roughly balances the part below it:</p>
<div class="formula">$$I\\approx f\\!\\left(\\dfrac{a+b}{2}\\right)(b-a)$$</div>
<p>For the airplane: $f(66.5)(-53) = ${fmt(RULE.mid(AF,93,40,1),4)}$ m. One function value, 0.6% error. Compare the end-point rectangles at 36% and 38%.</p>
<p><b>Composite midpoint rule.</b> With $N$ equal slices and midpoints $m_{i} = (x_{i} + x_{i+1})/2$:</p>
<div class="formula">$$I\\approx h\\sum_{i=1}^{N} f\\!\\left(\\dfrac{x_{i}+x_{i+1}}{2}\\right),\\qquad h=\\dfrac{b-a}{N}$$</div></div>
</section>

<section class="sec"><h2><span class="no">C</span>Midpoint against trapezoid</h2>
