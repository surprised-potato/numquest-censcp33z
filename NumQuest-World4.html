SEC.gss=`
<section class="sec"><h2><span class="no">A</span>Let the points move</h2>
<div class="prose"><p>In every rule so far the sample positions were fixed first, equally spaced, and only the weights were derived. <b>Gauss quadrature</b> treats both as unknowns. With $n$ points there are $2n$ numbers to choose ($n$ positions and $n$ weights), enough to integrate every polynomial up to degree $2n - 1$ exactly. The points are unevenly spaced and never touch the end points.</p>
<div class="formula">$$\\int_{-1}^{1} f(x)\\,dx\\approx\\sum_{i=1}^{n} C_{i}\\,f(x_{i})$$</div></div>
</section>

<section class="sec"><h2><span class="no">B</span>Building the two-point rule</h2>
<div class="prose"><p>For $n = 2$ there are four unknowns $C_{1}, C_{2}, x_{1}, x_{2}$. Demand an exact answer for $f = 1, x, x^{2}, x^{3}$ and ask for symmetric points ($x_{1} = -x_{2}$, $C_{1} = C_{2}$). The result is surprisingly simple:</p>
<div class="formula">$$\\int_{-1}^{1} f(x)\\,dx\\approx f\\!\\left(-\\dfrac{1}{\\sqrt{3}}\\right)+f\\!\\left(\\dfrac{1}{\\sqrt{3}}\\right)$$</div>
<p>Two evaluations at $\\pm 0.57735$ with weights 1. For $f = \\cos x$ it gives 1.6758 against the exact $2\\sin 1 = 1.6829$, an error of 0.42%.</p></div>
<div class="callout prof"><span class="tag">Prof says</span><p>Why do the light and dark shaded pieces in the lecture’s Figure 9-19 match? For $f = x^{2}$ the function is below its Gauss-point value for $|x| < 1/\\sqrt{3}$ and above it outside. The two pieces have exactly the same area. The points are placed where that cancellation works.</p></div>
</section>

<section class="sec"><h2><span class="no">C</span>Points and weights</h2>
<div class="prose"><p>Look them up once for $[-1, 1]$:</p></div>
${rowT(['$n$','Points $t_{i}$','Weights $C_{i}$'],[1,2,3,4,5,6].map(n=>[n,GAUSS[n].t.filter((v,i)=>v>=0||n===1).map(v=>'±'+fmt(v,5)).join(', ').replace('±0.00000','0')+(n%2?'':''),GAUSS[n].w.slice(Math.floor(n/2)).map(v=>fmt(v,5)).join(', ')]))}
<div class="prose"><p>The points come in plus-and-minus pairs, and each pair shares one weight. Odd $n$ also includes $t = 0$. The weights always add to 2, the length of $[-1, 1]$.</p></div>
</section>

<section class="sec"><h2><span class="no">D</span>Any interval $[a, b]$</h2>
<div class="prose"><p>Change variables so that $[a, b]$ maps onto $[-1, 1]$:</p>
<div class="formula">$$x=\\dfrac{b-a}{2}\\,t+\\dfrac{b+a}{2},\\qquad dx=\\dfrac{b-a}{2}\\,dt$$ $$\\int_{a}^{b} f(x)\\,dx=\\dfrac{b-a}{2}\\int_{-1}^{1} f\\!\\left(\\dfrac{b-a}{2}\\,t+\\dfrac{b+a}{2}\\right)dt\\approx\\dfrac{b-a}{2}\\sum_{i=1}^{n}C_{i}\\,f(x_{i})$$</div></div>
<div class="wx">
<div class="wx-head"><div><b>Worked example: 4-point Gauss quadrature on $\\int_{0}^{3} e^{-x^2}\\,dx$</b></div></div>
<div class="wx-grid">
<figure class="wx-fig"><svg class="plot" viewBox="0 0 440 240" role="img" aria-label="4-point Gauss quadrature bars on exp(-x^2) over [0, 3]"><line x1="42" y1="212.0" x2="424" y2="212.0" stroke="var(--ink)" stroke-width="1.5"/><rect class="ar" x="35.3" y="48.8" width="66.4" height="163.2"/><rect class="ar" x="105.8" y="148.0" width="124.6" height="64.0"/><rect class="ar" x="235.7" y="209.0" width="124.6" height="3.0"/><rect class="ar" x="364.3" y="211.9" width="66.4" height="0.1"/><polyline points="42.0,41.6 48.4,42.0 54.7,43.3 61.1,45.4 67.5,48.2 73.8,51.9 80.2,56.2 86.6,61.2 92.9,66.8 99.3,72.8 105.7,79.3 112.0,86.1 118.4,93.1 124.8,100.3 131.1,107.6 137.5,114.9 143.9,122.1 150.2,129.2 156.6,136.2 163.0,142.9 169.3,149.3 175.7,155.4 182.1,161.2 188.4,166.6 194.8,171.6 201.2,176.3 207.5,180.6 213.9,184.5 220.3,188.0 226.6,191.2 233.0,194.0 239.4,196.6 245.7,198.8 252.1,200.8 258.5,202.5 264.8,204.0 271.2,205.3 277.6,206.4 283.9,207.4 290.3,208.2 296.7,208.9 303.0,209.5 309.4,209.9 315.8,210.3 322.1,210.7 328.5,210.9 334.9,211.1 341.2,211.3 347.6,211.5 354.0,211.6 360.3,211.7 366.7,211.7 373.1,211.8 379.4,211.8 385.8,211.9 392.2,211.9 398.5,211.9 404.9,211.9 411.3,212.0 417.6,212.0 424.0,212.0" fill="none" stroke="var(--qx)" stroke-width="2.5"/><circle cx="68.5" cy="48.8" r="4.5" fill="var(--qe)"/><circle cx="168.1" cy="148.0" r="4.5" fill="var(--qe)"/><circle cx="297.9" cy="209.0" r="4.5" fill="var(--qe)"/><circle cx="397.5" cy="211.9" r="4.5" fill="var(--qe)"/><text x="283.9" y="34" text-anchor="middle" style="fill:var(--good);font-weight:700">4-pt Gauss = 0.88414 (exact 0.88621)</text><text x="42.0" y="232" text-anchor="middle">0</text><text x="233.0" y="232" text-anchor="middle">1.5</text><text x="424.0" y="232" text-anchor="middle">3</text></svg><figcaption>Bar widths equal scaled weights $1.5\\,C_i$; heights equal $e^{-x_i^2}$ at mapped interior Gauss nodes.</figcaption></figure>
<div>
<ol class="wx-steps">
<li><b>Map $[0,3] \\leftrightarrow [-1,1]$:</b> $x = 1.5t + 1.5$, Jacobian $dx = 1.5\\,dt$.</li>
<li><b>Nodes:</b> $x = 0.2083, 0.9900, 2.0100, 2.7917$.</li>
<li><b>Weighted sum:</b> $1.5\\sum C_i e^{-x_i^2} = 0.884136$.</li>
</ol>
<div class="wx-ans">$I_4 = ${fmt(gauss(x=>Math.exp(-x*x),0,3,4),6)}$ (exact $0.886207$)</div>
</div>
</div>
</div>
<div class="stage-viz" data-viz="w4-gauss-map"></div>
<div class="callout prof"><span class="tag">Prof says</span><p>The lecture example is a little unusual. $e^{-x^{2}}$ is almost flat at both ends of $[0, 3]$, so midpoint/trapezoid do surprisingly well there. On smooth curved integrands like the airplane or $\\sin x$, Gauss wins by orders of magnitude.</p></div>
<div class="callout trap"><span class="tag">Trap!</span><p>Do not forget the scale factor $(b - a)/2$. And evaluate $f$ at mapped $x_{i}$, not raw $t_{i}$.</p></div>
</section>

<section class="sec"><h2><span class="no">E</span>Which rule when?</h2>
${rowT(['Rule','Formula','Points on each piece','Error','Notes'],compRows)}
<div class="prose"><p>Tabulated data at fixed spacing call for trapezoid or Simpson. A formula you can evaluate anywhere, especially an expensive one, calls for Gauss. The lecture’s second assignment (the main cable of a suspension bridge) is exactly that: the length $L = \\int\\sqrt{1 + (f^{\\prime})^{2}}\\,dx$ of a smooth curve.</p></div>
</section>

<section class="sec"><h2><span class="no">F</span>Gauss Gate lab</h2>
<div class="prose"><p>Add Gauss points one at a time. Each bar is centred on a Gauss point; its width is the weight (scaled to $[a, b]$) and its height is $f(x_{i})$. The total bar area is the estimate. Your goal is to find the fewest points that bring the airplane stopping distance within 0.001%, a target the trapezoid rule needs dozens of slices to reach.</p></div>
<div class="stage-viz" data-viz="w4-gauss-cancel"></div>
<div class="lab" id="lab-gss"></div>
<div class="callout mat"><span class="tag">MATLAB link</span>
<pre>f = @(x) exp(-x.^2);
integral(f, 0, 3)                  <span class="cm">% 0.8862 (adaptive Gauss-Kronrod)</span>

t = [-0.861136 -0.339981 0.339981 0.861136];   <span class="cm">% 4-point Gauss</span>
C = [ 0.347855  0.652145 0.652145 0.347855];
x = 1.5*t + 1.5;
I = 1.5 * sum(C .* f(x))           <span class="cm">% 0.88414</span></pre></div>
</section>`;

SEC.boss=`
<section class="sec"><h2><span class="no">!</span>Rules of the peaks</h2>
<div class="prose"><p>Seven problems in the style of the exam, covering all four stages. Every correct answer damages the Area Colossus. A first-try answer is worth full XP, a retry is worth half. Use your calculator, MATLAB or the labs.</p></div></section>`;

// NumQuest World 4 Config & Labs
const KEY='numquest-censcp33z-w4';
const LEVELS=[[0,'Site Intern'],[170,'Field Engineer'],[390,'Design Engineer'],[650,'Project Engineer'],[950,'Chief Engineer']];
const BADGES=[
 ['coin','First Slice','Answer a checkpoint correctly','1'],
 ['c3','Combo x3','Three first-try answers in a row','3'],
 ['c5','Combo x5','Five in a row','5'],
 ['c10','Combo x10','Ten in a row','10'],
 ['trz','Thin Slicer','Push the trapezoid error under 0.005% on the airplane problem','T'],
 ['smp','Parabola Pro','Try trapezoid, Simpson 1/3 and Simpson 3/8 with 6 or more intervals','S'],
 ['mid','Midpoint Maker','Try all four rectangle and trapezoid rules with 8 or more panels','M'],
 ['gss','Summit Reached','Get the airplane distance within 0.001% using Gauss points','G'],
 ['star3','Clean Sheet','Earn three stars on a stage','★'],
 ['boss','Colossus Slayer','Defeat the Area Colossus','⚔']
];
const LABXP={trz:20,smp:25,mid:25,gss:25};

const STAGES=[
 {id:'trap',no:'4-1',title:'Trapezoid Trail',mission:'Slice an area into trapezoids, add them up, and see how the error shrinks as the slices get thinner.',labs:['trz'],time:'25 min',cp:'E'},
 {id:'simp',no:'4-2',title:'Parabola Pass',mission:'Run parabolas and cubics through groups of points to get far better accuracy from the same data.',labs:['smp'],time:'30 min',cp:'E'},
 {id:'mid',no:'4-3',title:'Midpoint Meadow',mission:'Use rectangles and midpoints, the simplest open methods, and see why the middle beats the edge.',labs:['mid'],time:'25 min',cp:'E'},
 {id:'gss',no:'4-4',title:'Gauss Summit',mission:'Choose the sample points as well as the weights, and get high accuracy from just a few function values.',labs:['gss'],time:'30 min',cp:'G'}
];
const LABNAMES={trz:'Trapezoid Slicer',smp:'Parabola Press',mid:'Rectangle and Midpoint',gss:'Gauss Gate'};

/* integrands for the labs (all positive on their interval, so the picture reads as an area) */
const LF={
 air:{n:'Airplane braking, 97000v/(5v²+570000), v from 40 to 93',f:v=>97000*v/(5*v*v+570000),a:40,b:93,ex:AX,u:'m'},
 sin:{n:'sin x on [0, π]',f:Math.sin,a:0,b:Math.PI,ex:2},
 exp:{n:'e^(−x²) on [0, 3]',f:x=>Math.exp(-x*x),a:0,b:3,ex:0.8862073482595211},
 sq:{n:'x² on [0, 2]',f:x=>x*x,a:0,b:2,ex:8/3},
 cube:{n:'x³ on [0, 2]',f:x=>x**3,a:0,b:2,ex:4},
 quart:{n:'x⁴ on [0, 2]',f:x=>x**4,a:0,b:2,ex:6.4},
 cos:{n:'cos x on [−1, 1]',f:Math.cos,a:-1,b:1,ex:2*Math.sin(1)}
};
function yrange(F){let lo=0,hi=0;for(let i=0;i<=200;i++){const y=F.f(F.a+(F.b-F.a)*i/200);lo=Math.min(lo,y);hi=Math.max(hi,y)}const p=(hi-lo)*.12;return [lo<0?lo-p:0,hi+p]}
const optSel=keys=>keys.map(k=>`<option value="${k}">${LF[k].n}</option>`).join('');

/* ---------- Lab: Trapezoid slicer ---------- */
function labTrap(root){
  const st={fn:'air',N:2};
  root.innerHTML=labHead('trz','Trapezoid slicer','get the airplane error under 0.005%')+`<div class="lab-body"><div class="lab-plot"><div id="trz-plot"></div>
   <div class="legend"><span><i style="background:var(--c1)"></i>$f(x)$</span><span><i style="background:var(--gold)"></i>trapezoids</span></div>
   <div id="trz-eplot" style="margin-top:10px"></div>
   <div class="legend"><span><i style="background:var(--c2)"></i>your error</span><span><i style="background:var(--muted)"></i>slope −2 guide</span><span>axes: $\\log_{10} N$ and $\\log_{10}|\\text{error}|$</span></div></div>
   <div class="controls"><div class="ctl"><label for="trz-fn">Function</label><select id="trz-fn">${optSel(['air','sin','exp','sq'])}</select></div>
   <div class="ctl"><label for="trz-n">Slices $N$ <span class="v" id="trz-nv"></span></label><input id="trz-n" type="range" min="1" max="60" step="1" value="2"></div>
   <div class="tiles">${tile('Step $h$','','trz-h')}${tile('Estimate','','trz-e')}${tile('Exact','','trz-x')}${tile('Error','','trz-er')}${tile('Relative error','','trz-rel')}${tile('$f$ evaluations','','trz-ev')}</div>
   <div class="status" id="trz-s"></div></div></div>`;
  const q=s=>$(s,root);
  function draw(){
    const F=LF[st.fn],N=st.N,h=(F.b-F.a)/N,P=plot('clip-trz',[F.a,F.b],yrange(F),{label:'Function with trapezoids under it'});
    let inner='';
    for(let i=0;i<N;i++){const x0=F.a+i*h,x1=x0+h;inner+=P.poly([[x0,0],[x0,F.f(x0)],[x1,F.f(x1)],[x1,0]],'ar')}
    inner+=P.curve(F.f,'cv1',300);
    if(N<=30)for(let i=0;i<=N;i++)inner+=P.dot(F.a+i*h,F.f(F.a+i*h),'dk',3.5);
    q('#trz-plot').innerHTML=P.wrap(inner);
    const I=RULE.trap(F.f,F.a,F.b,N),err=I-F.ex,rel=Math.abs(err)/Math.abs(F.ex)*100;
    // error plot
    const E=plot('clip-trze',[0,Math.log10(60)],[-8,2],{label:'Trapezoid error against N on log scales',h:230});
    const pts=[];for(let n=1;n<=60;n++)pts.push([Math.log10(n),Math.max(-8,Math.log10(Math.abs(RULE.trap(F.f,F.a,F.b,n)-F.ex)+1e-14))]);
    const e1=pts[0][1];
    let ei=E.line(0,e1,Math.log10(60),e1-2*Math.log10(60),'dsh')+E.path(pts,'cv2')+E.dot(Math.log10(N),Math.max(-8,Math.log10(Math.abs(err)+1e-14)),'dg',5.5);
    q('#trz-eplot').innerHTML=E.wrap(ei);
    q('#trz-nv').textContent=N;q('#trz-h').textContent=fmt(h,4);q('#trz-e').textContent=fmt(I,5);q('#trz-x').textContent=fmt(F.ex,5);
    q('#trz-er').textContent=ef(err);q('#trz-rel').textContent=(rel<1e-4?rel.toExponential(2):fmt(rel,4))+' %';q('#trz-ev').textContent=N+1;
    const s=q('#trz-s'),dir=err>0?'overestimates':'underestimates';
    if(st.fn==='air'&&rel<.005){s.className='status good';s.innerHTML=`<b>Under 0.005%.</b> With ${N} slices the error is ${ef(err)} m. The log plot falls with slope −2, so every doubling of $N$ divides the error by 4.`;labDone('trz')}
    else if(st.fn==='air'){s.className='status warn';s.innerHTML=`Relative error is ${fmt(rel,4)}%. Keep adding slices. The rule ${dir} the area here. Doubling $N$ should cut the error by about 4.`}
    else{s.className='status';s.innerHTML=`The trapezoid rule ${dir} this area. For a curve bending ${err>0?'upward':'downward'} the chords lie ${err>0?'above':'below'} the curve. Switch to the airplane function to earn the goal.`}
  }
  root.addEventListener('input',ev=>{if(ev.target.id==='trz-n'){st.N=+ev.target.value;draw()}});
  root.addEventListener('change',ev=>{if(ev.target.id==='trz-fn'){st.fn=ev.target.value;draw()}});
  draw();
}

/* ---------- Lab: Parabola press ---------- */
const SMM={trap:{n:'Trapezoidal',k:1},s13:{n:'Simpson 1/3',k:2},s38:{n:'Simpson 3/8',k:3}};
function labSimp(root){
  const st={fn:'air',m:'trap',k:3,seen:{}};
  root.innerHTML=labHead('smp','Parabola press','try all three rules with $N \\ge 6$')+`<div class="lab-body"><div class="lab-plot"><div id="smp-plot"></div>
   <div class="legend"><span><i style="background:var(--muted)"></i>true curve</span><span><i style="background:var(--c2)"></i>polynomial pieces being integrated</span><span><i style="background:var(--ink);border-radius:50%;height:8px;width:8px"></i>nodes</span></div>
   <div class="tw mini-t" id="smp-t"></div></div>
   <div class="controls"><div class="ctl"><label for="smp-fn">Function</label><select id="smp-fn">${optSel(['air','sin','exp','cube','quart'])}</select></div>
   <div class="btns" role="group" aria-label="Rule">${Object.keys(SMM).map(k=>`<button type="button" class="btn ${k==='trap'?'on':''}" data-m="${k}">${SMM[k].n}</button>`).join('')}</div>
   <div class="ctl"><label for="smp-k">Panels <span class="v" id="smp-kv"></span></label><input id="smp-k" type="range" min="1" max="12" step="1" value="3"></div>
   <div class="tiles">${tile('Subintervals $N$','','smp-n')}${tile('Estimate','','smp-e')}${tile('Exact','','smp-x')}${tile('Error','','smp-er')}</div>
   <div class="status" id="smp-s"></div></div></div>`;
  const q=s=>$(s,root);
  const N=()=>st.k*SMM[st.m].k;
  function pieces(F,m,n,P){
    const h=(F.b-F.a)/n,xs=Array.from({length:n+1},(_,i)=>F.a+i*h),ys=xs.map(F.f);
    if(m==='trap')return P.path(xs.map((x,i)=>[x,ys[i]]),'cv2');
    const w=m==='s13'?2:3,pts=[];
    for(let i=0;i<n;i+=w){const sx=xs.slice(i,i+w+1),sy=ys.slice(i,i+w+1);
      for(let j=0;j<=24;j++){const x=sx[0]+(sx[w]-sx[0])*j/24;pts.push([x,lagr(sx,sy,x)])}}
    return P.path(pts,'cv2');
  }
  function draw(){
    const F=LF[st.fn],n=N(),m=st.m,h=(F.b-F.a)/n,yr=yrange(F);
    const P=plot('clip-smp',[F.a,F.b],[yr[0],yr[1]*1.05],{label:'Function and the polynomial pieces used by the rule'});
    let inner=P.curve(F.f,'dsh',300)+pieces(F,m,n,P);
    if(n<=36)for(let i=0;i<=n;i++)inner+=P.dot(F.a+i*h,F.f(F.a+i*h),'dk',3.5);
    q('#smp-plot').innerHTML=P.wrap(inner);
    const I=RULE[m](F.f,F.a,F.b,n),err=I-F.ex,eT=RULE.trap(F.f,F.a,F.b,n)-F.ex;
    q('#smp-kv').textContent=st.k;q('#smp-n').textContent=n;q('#smp-e').textContent=fmt(I,6);q('#smp-x').textContent=fmt(F.ex,6);q('#smp-er').textContent=ef(err);
    q('#smp-t').innerHTML=`<table><thead><tr><th>Rule</th><th>Error at $N$ = ${n}</th></tr></thead><tbody>${Object.keys(SMM).map(k=>{const nn=n;const ok=(k==='trap')||(k==='s13'&&nn%2===0)||(k==='s38'&&nn%3===0);return `<tr class="${k===m?'last':''}"><td>${SMM[k].n}</td><td>${ok?ef(RULE[k](F.f,F.a,F.b,nn)-F.ex):'$N$ not allowed'}</td></tr>`}).join('')}</tbody></table>`;
    const s=q('#smp-s'),exact=Math.abs(err)<1e-9*Math.max(1,Math.abs(F.ex));
    if(m==='trap'){s.className='status';s.innerHTML=`<b>Trapezoidal.</b> Straight chords between nodes. Error ${ef(err)}. The Simpson rules in the table use the same $N$ when it suits them.`}
    else if(exact&&st.fn==='cube'){s.className='status good';s.innerHTML=`<b>Exact to round-off.</b> The cubic $x^{3}$ is integrated exactly by both Simpson rules, even with only ${n} subintervals. Now try $x^{4}$.`}
    else if(Math.abs(err)<Math.abs(eT)){s.className='status good';s.innerHTML=`<b>${SMM[m].n}.</b> The error is ${ef(err)}, about ${Math.abs(err)>0?fmt(Math.abs(eT/err),0):'∞'} times smaller than the trapezoid rule with the same $N$ (${ef(eT)}).`}
    else{s.className='status warn';s.innerHTML=`<b>${SMM[m].n}.</b> Error ${ef(err)} against ${ef(eT)} for the trapezoid rule. Not every function favours Simpson at tiny $N$. Add panels.`}
    if(n>=6){st.seen[m]=1;if(st.seen.trap&&st.seen.s13&&st.seen.s38)labDone('smp')}
  }
  root.addEventListener('input',ev=>{if(ev.target.id==='smp-k'){st.k=+ev.target.value;draw()}});
  root.addEventListener('change',ev=>{if(ev.target.id==='smp-fn'){st.fn=ev.target.value;draw()}});
  root.addEventListener('click',ev=>{const b=ev.target.closest('[data-m]');if(b){st.m=b.dataset.m;$$('[data-m]',root).forEach(x=>x.classList.toggle('on',x===b));draw()}});
  draw();
}

/* ---------- Lab: Rectangle and midpoint ---------- */
const MDM={left:'Left rectangle',right:'Right rectangle',mid:'Midpoint',trap:'Trapezoidal'};
function labMid(root){
  const st={fn:'air',m:'left',N:4,seen:{}};
  root.innerHTML=labHead('mid','Rectangle and midpoint','try all four rules with $N \\ge 8$')+`<div class="lab-body"><div class="lab-plot"><div id="mid-plot"></div>
   <div class="legend"><span><i style="background:var(--c1)"></i>$f(x)$</span><span><i style="background:var(--gold)"></i>what the rule adds up</span><span><i style="background:var(--ink);border-radius:50%;height:8px;width:8px"></i>sample points</span></div>
   <div class="tw mini-t" id="mid-t"></div></div>
   <div class="controls"><div class="ctl"><label for="mid-fn">Function</label><select id="mid-fn">${optSel(['air','sin','exp','sq'])}</select></div>
   <div class="btns" role="group" aria-label="Rule">${Object.keys(MDM).map(k=>`<button type="button" class="btn ${k==='left'?'on':''}" data-m="${k}">${MDM[k]}</button>`).join('')}</div>
   <div class="ctl"><label for="mid-n">Panels $N$ <span class="v" id="mid-nv"></span></label><input id="mid-n" type="range" min="1" max="40" step="1" value="4"></div>
   <div class="tiles">${tile('Estimate','','mid-e')}${tile('Exact','','mid-x')}${tile('Error','','mid-er')}${tile('Relative error','','mid-rel')}</div>
   <div class="status" id="mid-s"></div></div></div>`;
  const q=s=>$(s,root);
  function draw(){
    const F=LF[st.fn],N=st.N,h=(F.b-F.a)/N,m=st.m,P=plot('clip-mid',[F.a,F.b],yrange(F),{label:'Function with the rule’s rectangles or trapezoids'});
    let inner='';
    for(let i=0;i<N;i++){
      const x0=F.a+i*h,x1=x0+h;
      if(m==='trap')inner+=P.poly([[x0,0],[x0,F.f(x0)],[x1,F.f(x1)],[x1,0]],'ar');
      else{const xs=m==='left'?x0:m==='right'?x1:x0+h/2,y=F.f(xs);inner+=P.poly([[x0,0],[x0,y],[x1,y],[x1,0]],'ar');if(N<=30)inner+=P.dot(xs,y,'dk',3.5)}
    }
    inner+=P.curve(F.f,'cv1',300);
    q('#mid-plot').innerHTML=P.wrap(inner);
    const I=RULE[m](F.f,F.a,F.b,N),err=I-F.ex,rel=Math.abs(err)/Math.abs(F.ex)*100;
    q('#mid-nv').textContent=N;q('#mid-e').textContent=fmt(I,5);q('#mid-x').textContent=fmt(F.ex,5);q('#mid-er').textContent=ef(err);q('#mid-rel').textContent=(rel<1e-4?rel.toExponential(2):fmt(rel,4))+' %';
    q('#mid-t').innerHTML=`<table><thead><tr><th>Rule</th><th>Error at $N$ = ${N}</th></tr></thead><tbody>${Object.keys(MDM).map(k=>`<tr class="${k===m?'last':''}"><td>${MDM[k]}</td><td>${ef(RULE[k](F.f,F.a,F.b,N)-F.ex)}</td></tr>`).join('')}</tbody></table>`;
    const s=q('#mid-s'),eT=RULE.trap(F.f,F.a,F.b,N)-F.ex,eM=RULE.mid(F.f,F.a,F.b,N)-F.ex;
    if(m==='left'||m==='right'){s.className='status warn';s.innerHTML=`<b>${MDM[m]}: error $\\propto h$.</b> Halve $h$ and the error only halves. The ${err>0?'rectangles stick out above':'rectangles fall short of'} the curve on average. Switch to the midpoint rule with the same $N$.`}
    else if(m==='mid'){s.className='status good';s.innerHTML=`<b>Midpoint: error $\\propto h^{2}$.</b> Its error is ${ef(err)}, and the trapezoid error is ${ef(eT)}. Look at the signs: they are ${eM*eT<0?'<b>opposite</b>, so the exact value lies between the two estimates':'the same here'}. The ratio of sizes is about ${Math.abs(eM)>0?fmt(Math.abs(eT/eM),1):'—'}.`}
    else{s.className='status good';s.innerHTML=`<b>Trapezoidal: error $\\propto h^{2}$.</b> Error ${ef(err)}. Compare with the midpoint rule at ${ef(eM)}: about half the size and the opposite sign.`}
    if(N>=8){st.seen[m]=1;if(st.seen.left&&st.seen.right&&st.seen.mid&&st.seen.trap)labDone('mid')}
  }
  root.addEventListener('input',ev=>{if(ev.target.id==='mid-n'){st.N=+ev.target.value;draw()}});
  root.addEventListener('change',ev=>{if(ev.target.id==='mid-fn'){st.fn=ev.target.value;draw()}});
  root.addEventListener('click',ev=>{const b=ev.target.closest('[data-m]');if(b){st.m=b.dataset.m;$$('[data-m]',root).forEach(x=>x.classList.toggle('on',x===b));draw()}});
  draw();
}

/* ---------- Lab: Gauss gate ---------- */
function labGauss(root){
  const st={fn:'air',n:1};
  root.innerHTML=labHead('gss','Gauss gate','airplane distance within 0.001% using the fewest points')+`<div class="lab-body"><div class="lab-plot"><div id="gss-plot"></div>
   <div class="legend"><span><i style="background:var(--c1)"></i>$f(x)$</span><span><i style="background:var(--gold)"></i>bar width = weight, height = $f(x_{i})$</span><span><i style="background:var(--ink);border-radius:50%;height:8px;width:8px"></i>Gauss points</span></div>
   <div class="tw mini-t" id="gss-t"></div></div>
   <div class="controls"><div class="ctl"><label for="gss-fn">Function</label><select id="gss-fn">${optSel(['air','sin','cos','exp'])}</select></div>
   <div class="ctl"><label for="gss-n">Gauss points $n$ <span class="v" id="gss-nv"></span></label><input id="gss-n" type="range" min="1" max="6" step="1" value="1"></div>
   <div class="tiles">${tile('Estimate','','gss-e')}${tile('Exact','','gss-x')}${tile('Error','','gss-er')}${tile('Relative error','','gss-rel')}${tile('Midpoint, same $n$','','gss-m')}${tile('Trapezoid, $n$ panels','','gss-tr')}</div>
   <div class="status" id="gss-s"></div></div></div>`;
  const q=s=>$(s,root);
  function draw(){
    const F=LF[st.fn],n=st.n,G=GAUSS[n],c=(F.b-F.a)/2,mid=(F.a+F.b)/2,P=plot('clip-gss',[F.a,F.b],yrange(F),{label:'Function with Gauss-point bars'});
    let inner='';const xs=G.t.map(t=>c*t+mid);
    xs.forEach((x,i)=>{const w=G.w[i]*c,y=F.f(x);inner+=P.poly([[x-w/2,0],[x-w/2,y],[x+w/2,y],[x+w/2,0]],'ar')+P.dot(x,y,'dk',4)});
    inner+=P.curve(F.f,'cv1',300);
    q('#gss-plot').innerHTML=P.wrap(inner);
    const I=gauss(F.f,F.a,F.b,n),err=I-F.ex,rel=Math.abs(err)/Math.abs(F.ex)*100;
    q('#gss-nv').textContent=n;q('#gss-e').textContent=fmt(I,7);q('#gss-x').textContent=fmt(F.ex,7);q('#gss-er').textContent=ef(err);q('#gss-rel').textContent=(rel<1e-4?rel.toExponential(2):fmt(rel,4))+' %';
    q('#gss-m').textContent=ef(RULE.mid(F.f,F.a,F.b,n)-F.ex);q('#gss-tr').textContent=ef(RULE.trap(F.f,F.a,F.b,n)-F.ex);
    q('#gss-t').innerHTML=`<table><thead><tr><th>$t_{i}$</th><th>$x_{i}$</th><th>$C_{i}$</th><th>$f(x_{i})$</th></tr></thead><tbody>${xs.map((x,i)=>`<tr><td>${fmt(G.t[i],5)}</td><td>${fmt(x,4)}</td><td>${fmt(G.w[i],5)}</td><td>${fmt(F.f(x),5)}</td></tr>`).join('')}</tbody></table>`;
    const s=q('#gss-s'),eM=RULE.mid(F.f,F.a,F.b,n)-F.ex;
    if(st.fn==='air'&&rel<.001){s.className='status good';s.innerHTML=`<b>Within 0.001% with ${n} Gauss point${n>1?'s':''}.</b> Relative error ${rel<1e-4?rel.toExponential(2):fmt(rel,5)}%. The midpoint rule with the same ${n} evaluations is off by ${ef(eM)} m, and the trapezoid rule needed about 15 slices just to reach 0.005%.`;labDone('gss')}
    else if(st.fn==='air'){s.className='status warn';s.innerHTML=`Relative error ${fmt(rel,5)}%. The airplane integrand is smooth, so Gauss points converge quickly. Add a point. Compare the midpoint tile: same number of evaluations, far larger error.`}
    else if(st.fn==='exp'){s.className='status';s.innerHTML=`<b>A special case.</b> $e^{-x^{2}}$ is almost flat at both ends of [0, 3], and that makes the midpoint and trapezoid rules unusually accurate. Gauss still converges, though not smoothly: the error here changes sign and does not fall at every step. Try $\\sin x$ or the airplane to see Gauss’s real advantage.`}
    else{s.className='status good';s.innerHTML=`Error ${ef(err)} with ${n} point${n>1?'s':''}, against ${ef(eM)} for the midpoint rule with the same number of evaluations. A polynomial would be exact up to degree ${2*n-1}. Switch to the airplane to earn the lab goal.`}
  }
  root.addEventListener('input',ev=>{if(ev.target.id==='gss-n'){st.n=+ev.target.value;draw()}});
  root.addEventListener('change',ev=>{if(ev.target.id==='gss-fn'){st.fn=ev.target.value;draw()}});
  draw();
}
function mountLabs(){labTrap($('#lab-trz'));labSimp($('#lab-smp'));labMid($('#lab-mid'));labGauss($('#lab-gss'))}

'use strict';
/* =====================================================================
   NumQuest Shared Engine — core2.js (grading, labs, navigation, embed, audio)
   ===================================================================== */
function gradeEx(e,root){
  if(e.type==='mcq'||e.type==='tf'){const s=$('.opt.sel',root);if(!s)return null;return {ok:+s.dataset.j===e.a,sel:s}}
  if(e.type==='num'){const v=numParse($('input',root).value);if(v==null)return null;const tol=e.t!=null?e.t:(e.tol!=null?e.tol:0.01);return {ok:Math.abs(v-e.a)<=tol+1e-12}}
  if(e.type==='fill'){const ins=$$('.fld input',root),marks=[];let ok=true;
    for(const i of ins){const v=numParse(i.value);if(v==null)return null;const f=e.fields[+i.dataset.j];const tol=f.t!=null?f.t:(f.tol!=null?f.tol:0.01);const g=Math.abs(v-f.a)<=tol+1e-12;marks.push([i,g]);ok=ok&&g}
    return {ok,marks}}
  if(e.type==='classify'){const rows=$$('.row',root),marks=[];let ok=true;
    for(const r of rows){const s=$('.seg .sel',r);if(!s)return null;const g=+s.dataset.k===e.items[+r.dataset.j][1];marks.push([r,g]);ok=ok&&g}
    return {ok,marks}}
  if(e.type==='order'){const idx=$$('[data-idx]',root).map(r=>+r.dataset.idx);return {ok:idx.every((v,i)=>v===i)}}
}
function lockEx(e,root,state){
  $$('input,.opt,.seg button,.mv button,[data-act=check],[data-act=show]',root).forEach(n=>{n.disabled=true});
  root.classList.add('done');$('.ex-state',root).textContent=state;$('.sol',root).classList.add('show');$('.fb',root).classList.remove('show');
  mountViz($('.sol',root));
}
function fillAnswer(e,root){
  if(e.type==='mcq'||e.type==='tf'){$$('.opt',root).forEach(o=>{o.classList.remove('sel','wrong');o.classList.toggle('right',+o.dataset.j===e.a)})}
  if(e.type==='num'){$('input',root).value=minus(e.a)}
  if(e.type==='fill'){$$('.fld input',root).forEach(i=>{i.value=minus(e.fields[+i.dataset.j].a);i.classList.remove('wrong');i.classList.add('right')})}
  if(e.type==='classify'){$$('.row',root).forEach(r=>{r.classList.remove('wrong');r.classList.add('right');$$('.seg button',r).forEach(b=>{b.classList.remove('sel');b.classList.toggle('ans',+b.dataset.k===e.items[+r.dataset.j][1])})})}
  if(e.type==='order'){const box=$('[data-order]',root);const rows=$$('[data-idx]',box).sort((a,b)=>a.dataset.idx-b.dataset.idx);rows.forEach(r=>box.appendChild(r));renumber(box)}
}
const renumber=box=>$$('.pos',box).forEach((p,i)=>p.textContent=i+1);
function restoreEx(e){
  const root=$('#ex-'+e.id);if(!root)return;const r=S.ex[e.id];
  fillAnswer(e,root);lockEx(e,root,r.st==='ok'?'Cleared':'Revealed');
}
function checkEx(e,root,anchor){
  if(root.classList.contains('done'))return;
  const g=gradeEx(e,root),fb=$('.fb',root);
  if(!g){fb.innerHTML='Answer every part first.';fb.classList.add('show');return}
  const r=S.ex[e.id]=S.ex[e.id]||{att:0,st:'open'};r.att++;
  if(g.ok){
    const first=r.att===1,xp=first?e.xp:Math.ceil(e.xp/2);
    r.st='ok';r.xp=xp;
    if(g.marks)g.marks.forEach(([n])=>n.classList.add('right'));
    if(g.sel)g.sel.classList.add('right');
    lockEx(e,root,'Cleared · +'+xp+' XP');
    root.classList.add('win');setTimeout(()=>root.classList.remove('win'),800);
    sfx.ok();
    if(first){S.streak++;S.best=Math.max(S.best,S.streak);
      const bonus={3:5,5:10,10:20}[S.streak];
      if(bonus){banner('Combo x'+S.streak,'+'+bonus+' bonus XP');award(bonus,$('#comboChip'))}}
    award(xp,anchor||root);
    if(S.ex[e.id].xp)grant('coin');
    if(S.best>=3)grant('c3');if(S.best>=5)grant('c5');if(S.best>=10)grant('c10');
    afterProgress(e,root);
  }else{
    S.streak=0;sfx.no();floatText('Combo lost',$('#comboChip'),'red');
    if(g.sel){g.sel.classList.remove('sel');g.sel.classList.add('wrong')}
    if(g.marks)g.marks.forEach(([n,ok])=>{n.classList.toggle('wrong',!ok);n.classList.toggle('right',ok)});
    fb.innerHTML=`<b>Not quite.</b> ${e.hint}`;fb.classList.add('show');
    if(r.att>=2)root.classList.add('canshow');
    save();hud();
  }
}
function showSolution(e,root){
  if(root.classList.contains('done'))return;
  const r=S.ex[e.id]=S.ex[e.id]||{att:0,st:'open'};r.st='rev';r.xp=0;
  fillAnswer(e,root);lockEx(e,root,'Revealed · no XP');save();afterProgress(e,root);
}
function stageOf(id){for(const k in EX)if(EX[k].some(e=>e.id===id))return k}
function stageStats(k){
  const list=EX[k],done=list.filter(e=>S.ex[e.id]&&S.ex[e.id].st!=='open').length;
  const first=list.filter(e=>S.ex[e.id]&&S.ex[e.id].st==='ok'&&S.ex[e.id].att===1).length;
  const st=STAGES.find(s=>s.id===k);const labs=st?st.labs.filter(l=>S.labs[l]).length:0;
  let stars=0;
  if(done===list.length){stars=1;if(first/list.length>=.8)stars=2;if(first===list.length&&labs===st.labs.length)stars=3}
  return {done,total:list.length,first,labs,stars};
}
function afterProgress(e,root){
  const k=stageOf(e.id);
  if(k!=='boss'){
    const s=stageStats(k);
    if(s.done===s.total&&!S.clear[k]){S.clear[k]=true;sfx.clear();banner('Stage clear!',STAGES.find(x=>x.id===k).title);award(STAGE_BONUS,root)}
    if(s.stars===3)grant('star3');
  }else{
    const hit=EX.boss.filter(x=>S.ex[x.id]&&S.ex[x.id].st==='ok').length;
    const bb=$('#bossbar');if(bb){bb.classList.add('hit');setTimeout(()=>bb.classList.remove('hit'),350)}
    if(hit===EX.boss.length&&!S.bossBonus){S.bossBonus=true;grant('boss');sfx.clear();banner(WORLD.boss.winTitle,WORLD.boss.winSub);award(BOSS_BONUS,root)}
  }
  save();refreshAll();
}
function refreshAll(){
  hud();
  const starStr=n=>'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span>';
  STAGES.forEach(st=>{
    const s=stageStats(st.id),el=$('#tr-'+st.id);
    if(el)el.innerHTML=`<div class="tile"><span>Checkpoints</span><b>${s.done} / ${s.total}</b></div><div class="tile"><span>First try</span><b>${s.first} / ${s.total}</b></div><div class="tile"><span>Labs played</span><b>${s.labs} / ${st.labs.length}</b></div><div class="tile"><span>Stars</span><b class="stars">${starStr(s.stars)}</b></div>`;
    const hs=$('#hs-'+st.id);if(hs)hs.innerHTML=starStr(s.stars);
    const ns=$('#ns-'+st.id);if(ns)ns.innerHTML=starStr(s.stars);
    const a=$(`.nav a[data-v="${st.id}"]`);if(a)a.classList.toggle('done',!!S.clear[st.id]);
  });
  const exped=$('#exped');if(exped)exped.innerHTML=expedHTML();
  const hit=EX.boss.filter(x=>S.ex[x.id]&&S.ex[x.id].st==='ok').length;
  const dead=hit===EX.boss.length;
  const hp=Math.round(100*(1-hit/EX.boss.length));
  $('#hpFill').style.width=hp+'%';$('#hpTxt').textContent=`HP ${hp}% · ${hit} of ${EX.boss.length} hits landed`;
  $('#bossbar').classList.toggle('dead',dead);
  $('#ns-boss').innerHTML=dead?'<span class="st">★ defeated</span>':'';
  const ba=$(`.nav a[data-v="boss"]`);if(ba)ba.classList.toggle('done',dead);
  const okN=k=>EX[k].filter(e=>S.ex[e.id]&&S.ex[e.id].st==='ok').length;
  const have=STAGES.reduce((a,s)=>a+okN(s.id),0),total=STAGES.reduce((a,s)=>a+EX[s.id].length,0),need=Math.ceil((WORLD.boss.needPct||.67)*total);
  const open=S.teacher||have>=need;
  $('#bossLock').hidden=open;$('#bossBody').hidden=!open;
  $('#lockTxt').textContent=WORLD.boss.lockMsg?WORLD.boss.lockMsg(need,have):`Clear at least ${need} checkpoints across Stages ${STAGES[0].no} to ${STAGES[STAGES.length-1].no} correctly (${Math.round((WORLD.boss.needPct||.67)*100)}%) to open the gate. You have ${have}.`;
  const bi=$('#bossIntro'),bw=$('#bossWin');
  if(bi){bi.hidden=!open||dead;if(open&&!dead)bi.innerHTML=bossCard('intro')}
  if(bw){bw.hidden=!dead;if(dead)bw.innerHTML=bossCard('win')}
  $('#homeXp').textContent=S.xp;renderMap();renderBadges();
}

/* ---------- UI event listeners ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target;

  const opt=t.closest('.opt');

  const seg=t.closest('.seg button');

  const mv=t.closest('.mv button');
  if(mv&&!mv.disabled){const row=mv.closest('.orow'),box=row.parentNode,d=+mv.dataset.mv;
    if(d<0&&row.previousElementSibling)box.insertBefore(row,row.previousElementSibling);
    if(d>0&&row.nextElementSibling)box.insertBefore(row.nextElementSibling,row);
    renumber(box);return}
  const act=t.closest('[data-act]');
  if(act&&act.closest('.ex')){const root=act.closest('.ex'),e=findEx(root.dataset.id);
    if(act.dataset.act==='check')checkEx(e,root,act);
    if(act.dataset.act==='show')showSolution(e,root);return}
  const tg=$('#navToggle'),nv=$('#nav');
  if(tg&&nv){
    if(t.closest('#navToggle')){const op=!nv.classList.contains('open');nv.classList.toggle('open',op);tg.setAttribute('aria-expanded',op);return}
    if(nv.classList.contains('open')&&(!t.closest('.rail')||t.closest('.nav a'))){nv.classList.remove('open');tg.setAttribute('aria-expanded','false')}
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'&&ev.target.matches('.ex input')){const root=ev.target.closest('.ex');checkEx(findEx(root.dataset.id),root,ev.target)}

$('#sfxBtn').addEventListener('click',()=>{S.sfx=!S.sfx;save();hud();if(S.sfx)sfx.ok()});
$('#teachBtn').addEventListener('click',()=>{S.teacher=!S.teacher;save();refreshAll()});
function applyTheme(){if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme}
$('#themeBtn').addEventListener('click',()=>{

let armT=null;
$('#resetBtn').addEventListener('click',e=>{

  const keep={sfx:S.sfx,theme:S.theme};S=Object.assign(fresh(),keep);save();build();route();toast('Progress reset','Starting from level 1');

function route(){
  let h=(location.hash||'#home').slice(1);if(!VIEWS().includes(h))h='home';
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+h));
  $$('.nav a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===h));
  const cur=$('#navCur');
  if(cur){
    if(h==='home')cur.textContent='Overview';
    else if(h==='boss')cur.textContent='Boss · '+WORLD.boss.title;

window.addEventListener('resize',()=>{const h=$('#hud');if(h)document.documentElement.style.setProperty('--hudh',h.offsetHeight+'px')});

/* ---------- LaTeX rendering ---------- */
const KT={delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false,strict:false,
  ignoredClasses:['katex'],trust:c=>c.command==='\\htmlClass'};
function renderMath(el){if(window.renderMathInElement){try{window.renderMathInElement(el,KT)}catch(e){}}}
let mathQ=null;const mathPend=new Set();
function initMath(){
  if(!window.MutationObserver)return;
  const mo=new MutationObserver(muts=>{
    for(const m of muts)m.addedNodes.forEach(n=>{
      const host=n.nodeType===1?n:(n.nodeType===3?n.parentElement:null);
      if(host&&!host.closest('.katex')&&(n.nodeType===1||(n.data&&n.data.indexOf('$')>=0)))mathPend.add(host);
    });
    if(mathPend.size&&!mathQ){mathQ=Promise.resolve().then(()=>{mathQ=null;mo.disconnect();mathPend.forEach(h=>{if(h.isConnected)renderMath(h)});mathPend.clear();mo.observe(document.body,{childList:true,subtree:true})})}
  });
  mo.observe(document.body,{childList:true,subtree:true});
}

/* ---------- NQ-INTRO: embed sync OR welcome screen + per-world chiptune synthesizer ---------- */
(function initIntroAndEmbed(){
  const WN=WORLD.no||1;
  if(window.name==='nq-embed'){
    document.documentElement.classList.add('nq-embed');
    const post=()=>{try{parent.postMessage({nq:'progress',w:WN,S:S},'*')}catch(e){}};
    const _s=save;save=function(){_s();post()};
    post();
    ['click','touchend'].forEach(ev=>document.addEventListener(ev,()=>{try{parent.__nqShell&&parent.__nqShell.unlock()}catch(e){}},true));
    document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
      const m=(a.getAttribute('href')||'').match(/NumQuest-World(\d)\.html/);if(m){e.preventDefault();parent.postMessage({nq:'goto',w:+m[1]},'*')}},true);
    window.addEventListener('message',e=>{const d=e.data||{};
      if(d.nq==='hash'){if(d.h)location.hash='#'+d.h;else location.hash='#home'}
      if(d.nq==='musicState'){const b=document.getElementById('musicBtn');if(b)b.setAttribute('aria-pressed',d.on)}
      if(d.nq==='theme'){S.theme=d.t||'';applyTheme();_s()}
      if(d.nq==='active'){const b=document.getElementById('hud');if(b)document.documentElement.style.setProperty('--hudh',b.offsetHeight+'px')}
    });
    const addMap=()=>{const nav=document.getElementById('nav');if(!nav||document.getElementById('navMapLink'))return;
      const a=document.createElement('a');a.id='navMapLink';a.href='#';a.innerHTML='<span class="sn">MAP</span><span class="nt">Course map<br><span class="hint">all '+(WORLD.worlds?WORLD.worlds.length:5)+' worlds</span></span>';
      a.addEventListener('click',ev=>{ev.preventDefault();parent.postMessage({nq:'goto',w:0},'*')});nav.insertBefore(a,nav.firstChild)};
    const sb=document.getElementById('sfxBtn');
    if(sb&&sb.parentNode&&!document.getElementById('musicBtn')){const b=document.createElement('button');b.className='ctl-btn';b.id='musicBtn';b.type='button';b.textContent='Music';b.title='Background music on or off';b.setAttribute('aria-pressed','true');
      b.addEventListener('click',()=>parent.postMessage({nq:'music'},'*'));sb.parentNode.insertBefore(b,sb.nextSibling)}
    addMap();const nv=document.getElementById('nav');if(nv)new MutationObserver(addMap).observe(nv,{childList:true});
    try{parent.postMessage({nq:'ready',w:WN},'*')}catch(e){}
    return;
  }

  /* Standalone music engine reading WORLD.music */
  const MK='numquest-music';
  let musicOn=true;try{musicOn=localStorage.getItem(MK)!=='off'}catch(e){}
  const saveM=()=>{try{localStorage.setItem(MK,musicOn?'on':'off')}catch(e){}};
  const cfg=WORLD.music||{bpm:104,root:57,chords:[[0,3,7],[-4,-1,3],[3,7,10],[-2,2,5]],arp:[0,1,2,1,0,1,2,1],mel:[[7,0,5,0,3,0,2,0],[0,0,3,5,7,0,5,0],[10,0,7,0,5,0,3,0],[2,5,0,7,5,0,2,0]],lead:'triangle',bass:'triangle',pad:'sine',accent:'square'};
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  let MC=null,master=null,timer=null,nextT=0,step=0,playing=false;
  function note(f,t,d,type,v){
    const o=MC.createOscillator(),g=MC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
  }
  function sched(){
    const e=60/cfg.bpm/2;
    while(nextT<MC.currentTime+.25){
      const bar=Math.floor(step/8)%cfg.chords.length,i=step%8,ch=cfg.chords[bar];
      const bv=i%4===0?.20:i%2===0?.09:0;
      if(bv)note(mtof(cfg.root-12+ch[0]),nextT,e*1.85,cfg.bass||'triangle',bv);
      if(i===0&&cfg.pad)note(mtof(cfg.root+ch[1]),nextT,e*7.2,cfg.pad,.035);
      note(mtof(cfg.root+12+ch[cfg.arp[i%cfg.arp.length]]),nextT,e*.88,cfg.accent||'square',.042);
      const m=cfg.mel[bar][i];if(m&&step>=16)note(mtof(cfg.root+24+m),nextT,e*1.35,cfg.lead||'triangle',.095);
      nextT+=e;step++;
    }
  }
  function start(){
    try{if(!MC){MC=new (window.AudioContext||window.webkitAudioContext)();master=MC.createGain();master.gain.value=.5;master.connect(MC.destination)}
      MC.resume();if(playing)return;playing=true;nextT=MC.currentTime+.08;step=0;timer=setInterval(sched,80);}catch(e){}
  }
  let silent=null;
  function unlock(){
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    try{if(!MC){MC=new (window.AudioContext||window.webkitAudioContext)();master=MC.createGain();master.gain.value=.5;master.connect(MC.destination)}
      if(MC.state!=='running')MC.resume();
      const b=MC.createBuffer(1,1,22050),s=MC.createBufferSource();s.buffer=b;s.connect(MC.destination);s.start(0)}catch(e){}
    if(!navigator.audioSession&&!silent){try{silent=new Audio('data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==');silent.loop=true;silent.play().catch(()=>{})}catch(e){}}
  }
  ['click','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(window.__nqIntro&&window.__nqIntro.music().on&&!document.getElementById('nqWelcome')){unlock();start()}else unlock()},true));
  function stop(){playing=false;clearInterval(timer);if(master)master.gain.cancelScheduledValues(0);if(MC)MC.suspend()}
  function sync(){musicOn?start():stop();const b=document.getElementById('musicBtn');if(b)b.setAttribute('aria-pressed',musicOn)}
  document.addEventListener('visibilitychange',()=>{if(!MC)return;if(document.hidden)MC.suspend();else if(musicOn&&playing)MC.resume()});
  const sb=document.getElementById('sfxBtn');
  if(sb&&sb.parentNode&&!document.getElementById('musicBtn')){const b=document.createElement('button');b.className='ctl-btn';b.id='musicBtn';b.type='button';b.textContent='Music';b.title='Background music on or off';b.setAttribute('aria-pressed',musicOn);
    sb.parentNode.insertBefore(b,sb.nextSibling);
    b.addEventListener('click',()=>{musicOn=!musicOn;saveM();playing=playing&&musicOn;sync()})}

  let seen=false;try{seen=sessionStorage.getItem('nq-welcome-w'+WN)==='1'}catch(e){}
  if(location.hash&&location.hash!=='#home')seen=true;
  function showWelcome(){
    const lv=level(S.xp),cont=S.xp>0;
    const guideHtml=(typeof ART!=='undefined'&&ART.guide)?`<div class="chiefline" style="margin:12px 0"><img class="chiefface" src="${ART.guide}" alt="${ART.guideName}"><div><b>${ART.guideName}</b> <span class="hint">(${ART.guideTitle||'Faculty advisor'})</span><br>${WORLD.mission}</div></div>`:`<p>${WORLD.mission}</p>`;
    const w=document.createElement('div');w.id='nqWelcome';w.className='open';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-label','Welcome to NumQuest');
    w.innerHTML=`<div class="wl-card"><div class="wl-ey">CENSCP33Z · Numerical Solutions to CE Problems</div><h2>${WORLD.subtitle}</h2>${guideHtml}
      <div class="wl-act"><button type="button" class="btn" id="nqMus">${musicOn?'Music: ON':'Music: OFF'}</button><button type="button" class="btn" id="nqSfx">${S.sfx?'SFX: ON':'SFX: OFF'}</button><button type="button" class="btn primary" id="nqGo">${cont?'Continue ('+S.xp+' XP)':'Start World '+WN}</button></div>
      ${cont?`<div class="hint mono" style="margin-top:10px">Saved rank: Level ${lv+1} · ${LEVELS[lv][1]}</div>`:''}</div>`;
    document.body.appendChild(w);
    const go=w.querySelector('#nqGo');if(go)go.focus();
    const musBtn=w.querySelector('#nqMus'),sfxBtn=w.querySelector('#nqSfx');
    if(musBtn)musBtn.addEventListener('click',e=>{musicOn=!musicOn;saveM();e.currentTarget.textContent=musicOn?'Music: ON':'Music: OFF';playing=playing&&musicOn;sync()});
    if(sfxBtn)sfxBtn.addEventListener('click',e=>{S.sfx=!S.sfx;save();hud();e.currentTarget.textContent=S.sfx?'SFX: ON':'SFX: OFF'});
    const done=()=>{try{sessionStorage.setItem('nq-welcome-w'+WN,'1')}catch(e){}
      if(musicOn)sync();if(S.sfx)sfx.ok();w.remove();document.removeEventListener('keydown',kd)};
    const kd=e=>{if(e.target.closest&&e.target.closest('button'))return;if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();done()}};
    if(go)go.addEventListener('click',done);document.addEventListener('keydown',kd);
  }
  window.__nqIntro={show:showWelcome,music:()=>({on:musicOn,playing})};
  if(!seen)showWelcome();
})();

load();applyTheme();initMath();build();route();renderMath(document.body);
window.__nq=Object.assign({S:()=>S,total:totalXP,EX,STAGES},WORLD.expose?WORLD.expose():{});

})();
