<style>
/* Layout concept: a drafting sheet. Left rail = sheet index, top bar = title block with the player's level,
   each stage opens with a title-block hero, labs are plotted on gridded vellum.
   Palette: blueprint blue + vellum white, safety orange for action, hard-hat gold for XP. */
:root{
  --bg:#edf3fa; --grid:rgba(28,95,168,.10); --grid2:rgba(28,95,168,.05);
  --paper:#fbfdff; --paper2:#e2ecf7; --ink:#0f2a47; --muted:#4b6580;
  --line:#1c5fa8; --soft:#b7cde4; --accent:#d9480f; --on-accent:#ffffff;
  --gold:#f2b705; --on-gold:#2e2300; --good:#17803f; --bad:#c92a2a; --warn:#a85d00;
  --plot:#ffffff; --c1:#1c5fa8; --c2:#d9480f; --c3:#17803f;
  --hud:#0f2a47; --on-hud:#eaf3ff; --hud-soft:#1d4577; --shadow:rgba(15,42,71,.20);
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a2140; --grid:rgba(150,195,255,.11); --grid2:rgba(150,195,255,.05);
    --paper:#0f2f58; --paper2:#133b6b; --ink:#e8f1ff; --muted:#9fb8d6;
    --line:#7fb3ff; --soft:#2a5088; --accent:#ff8a3d; --on-accent:#1a0c00;
    --gold:#ffd23f; --on-gold:#2e2300; --good:#4ade80; --bad:#ff7b7b; --warn:#ffb84d;
    --plot:#0a2447; --c1:#7fb3ff; --c2:#ff9a5c; --c3:#6ee7a0;
    --hud:#06152b; --on-hud:#e8f1ff; --hud-soft:#143a69; --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a2140; --grid:rgba(150,195,255,.11); --grid2:rgba(150,195,255,.05);
  --paper:#0f2f58; --paper2:#133b6b; --ink:#e8f1ff; --muted:#9fb8d6;
  --line:#7fb3ff; --soft:#2a5088; --accent:#ff8a3d; --on-accent:#1a0c00;
  --gold:#ffd23f; --on-gold:#2e2300; --good:#4ade80; --bad:#ff7b7b; --warn:#ffb84d;
  --plot:#0a2447; --c1:#7fb3ff; --c2:#ff9a5c; --c3:#6ee7a0;
  --hud:#06152b; --on-hud:#e8f1ff; --hud-soft:#143a69; --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  margin:0; background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 64px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hud);z-index:60}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;line-height:1.1;margin:0;letter-spacing:.01em}
h2{font-size:1.7rem;font-weight:600;text-transform:uppercase}
h3{font-size:1.25rem;font-weight:600}
p{margin:.5rem 0}
a{color:var(--line)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono)}
sub,sup{line-height:0}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hud);color:var(--on-hud);margin:0 -16px;padding:8px 16px;border-bottom:3px solid var(--gold)}
@supports (padding:max(1px)){.hud{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.hud-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.lvl{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0}
.hex{flex:0 0 auto;width:46px;height:50px;background:var(--gold);color:var(--on-gold);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-disp);font-weight:700;line-height:1}
.hex small{font-size:.6rem;letter-spacing:.08em}
.hex b{font-size:1.35rem}
.lvl-t{min-width:0;flex:1}
.lvl-n{font-family:var(--f-disp);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:1.05rem;line-height:1.1}
.xpbar{height:12px;background:rgba(255,255,255,.14);margin-top:4px;position:relative;border:1px solid var(--hud-soft)}
.xpfill{height:100%;width:0;background:repeating-linear-gradient(135deg,var(--gold) 0 8px,#c99700 8px 16px);transition:width .5s}
.xpnum{font-family:var(--f-mono);font-size:.78rem;color:#b9d0ee;margin-top:2px}
.chip{display:flex;align-items:center;gap:7px;padding:5px 10px;background:var(--hud-soft);font-family:var(--f-disp);font-weight:600;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip b{font-family:var(--f-mono);font-size:1.05rem;font-weight:600;letter-spacing:0}
.nut{width:15px;height:17px;background:var(--gold);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);position:relative;display:inline-block}
.nut::after{content:"";position:absolute;inset:4px 3px;background:var(--hud-soft);border-radius:50%}
.chip.hot{background:var(--accent);color:var(--on-accent)}
.ctl-btn{border:1px solid var(--hud-soft);background:transparent;color:var(--on-hud);padding:5px 10px;cursor:pointer;font-family:var(--f-disp);font-weight:600;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase}
.ctl-btn:hover{background:var(--hud-soft)}
.ctl-btn[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.ctl-btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}

/* ---------- Shell ---------- */
.shell{max-width:1240px;margin:22px auto 0;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:calc(var(--hudh,76px) + env(safe-area-inset-top,0px) + 14px);background:var(--paper);border:2px solid var(--line);padding:12px;min-width:0}
.rail h4{margin:0 0 8px;font-family:var(--f-disp);font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;text-decoration:none;color:var(--ink);border:2px solid transparent;font-weight:500;line-height:1.25}
.nav a:hover{background:var(--paper2)}
.nav a.on{border-color:var(--accent);background:var(--paper2)}
.nav .sn{flex:0 0 auto;min-width:38px;text-align:center;font-family:var(--f-disp);font-weight:700;font-size:1rem;padding:1px 4px;background:var(--ink);color:var(--paper)}
.nav a.done .sn{background:var(--gold);color:var(--on-gold)}
.nav .nt{flex:1;min-width:0}
.nav .st{font-size:.8rem;color:var(--gold);letter-spacing:1px;text-shadow:0 0 1px #0007}
.nav .soon{opacity:.55;cursor:default}
.nav .soon .sn{background:var(--muted)}
.nav .div{height:0;border-top:1px dashed var(--soft);margin:6px 0}
.main{min-width:0}
.view{display:none}.view.on{display:block}

/* ---------- Hero (title block) ---------- */
.hero{background:var(--paper);border:3px solid var(--ink);position:relative;padding:22px 22px 0;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;width:18px;height:18px;border:3px solid var(--accent)}
.hero::before{left:-3px;top:-3px;border-right:0;border-bottom:0}
.hero::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
.eyebrow{font-family:var(--f-disp);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-size:1rem}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:700;text-transform:uppercase;margin:4px 0 10px}
.mission{max-width:60ch;font-size:1.08rem}
.mission b{font-family:var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-size:1rem}
.tblock{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin:20px -22px 0;border-top:3px solid var(--ink)}
.tblock div{padding:8px 14px;border-right:1px solid var(--soft);min-width:0}
.tblock div:last-child{border-right:0}
.tblock span{display:block;font-family:var(--f-disp);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tblock b{font-family:var(--f-mono);font-size:1.05rem;font-weight:600}
.stars{color:var(--gold);letter-spacing:2px;text-shadow:0 0 1px #0008}
.stars .off{color:var(--soft);text-shadow:none}

/* ---------- Sections ---------- */
.sec{margin-top:34px}
.sec>h2{display:flex;align-items:baseline;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:4px;margin-bottom:12px}
.sec>h2 .no{font-family:var(--f-mono);font-size:.95rem;font-weight:600;background:var(--ink);color:var(--paper);padding:1px 7px;letter-spacing:0;text-transform:none}
.prose{max-width:72ch}
.formula{font-family:var(--f-mono);font-size:1.02rem;background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--line);padding:10px 14px;margin:10px 0;overflow-x:auto;line-height:1.5}
.formula i{font-style:normal;color:var(--accent)}
.card{background:var(--paper);border:2px solid var(--line);padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
ul.tight{margin:.4rem 0;padding-left:1.2rem}ul.tight li{margin:.2rem 0}
ol.steps{margin:.5rem 0;padding-left:1.3rem}ol.steps li{margin:.25rem 0}
.tw{overflow-x:auto;margin:10px 0;border:2px solid var(--line);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--soft);white-space:nowrap}
th{background:var(--ink);color:var(--paper);font-family:var(--f-disp);font-weight:600;letter-spacing:.03em;font-size:1.05rem}
.mini-t th,.mini-t td{padding:5px 7px;font-size:.84rem}
.nav .st .off{color:var(--soft)}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:center}
tr.last td{background:var(--paper2);font-weight:600}
code,pre{font-family:var(--f-mono)}
pre{background:var(--hud);color:#d8e8ff;padding:12px 14px;overflow-x:auto;margin:10px 0;border-left:8px solid var(--gold);font-size:.9rem;line-height:1.5}
.cm{color:#8fb0d8}

/* callouts */
.callout{position:relative;margin:26px 0 14px;padding:16px 16px 12px;background:var(--paper);border:2px solid var(--line)}
.callout .tag{position:absolute;top:-13px;left:12px;font-family:var(--f-disp);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.95rem;padding:1px 10px;background:var(--line);color:var(--paper)}
.callout.trap{border-color:var(--bad)}.callout.trap .tag{background:var(--bad);color:#fff}
.callout.ce{border-color:var(--good)}.callout.ce .tag{background:var(--good);color:#fff}
.callout.mat{border-color:var(--warn)}.callout.mat .tag{background:var(--warn);color:#fff}
.callout p:first-of-type{margin-top:0}.callout p:last-child{margin-bottom:0}

/* ---------- Labs ---------- */
.lab{margin:22px 0;border:3px solid var(--ink);background:var(--paper)}
.lab-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--paper);padding:8px 14px}
.lab-tag{background:var(--gold);color:var(--on-gold);font-family:var(--f-disp);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;padding:0 8px}
.lab-title{font-family:var(--f-disp);font-weight:600;font-size:1.3rem;letter-spacing:.04em;text-transform:uppercase}

.badge.got{opacity:1}
.medal{width:62px;height:66px;margin:0 auto 8px;background:none!important;clip-path:none!important;display:grid;place-items:center}
.medal-svg{width:62px;height:66px;display:block;color:var(--ink)}
.medal-svg .m-outer{fill:var(--paper2);stroke:var(--soft);stroke-width:2.4}
.medal-svg .m-inner{fill:var(--paper);stroke:var(--soft);stroke-width:1.3;stroke-dasharray:4 3}
.badge:not(.got) .medal-svg{filter:grayscale(.65);opacity:.78}
.badge.got .medal-svg{filter:drop-shadow(0 3px 6px var(--shadow))}
.badge.got .medal-svg .m-outer{fill:color-mix(in srgb,var(--gold) 26%,var(--paper2));stroke:var(--gold);stroke-width:2.8}
.badge.got .medal-svg .m-inner{fill:var(--paper);stroke:var(--accent);stroke-width:1.4;stroke-dasharray:none}

/* First-visit World Welcome dialog */
#nqWelcome{position:fixed;inset:0;z-index:260;background:color-mix(in srgb,var(--hud) 78%,transparent);display:none;align-items:center;justify-content:center;padding:16px}
#nqWelcome.open{display:flex}
.wl-card{max-width:540px;width:100%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 16px 40px var(--shadow);padding:20px 22px}
.wl-ey{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-size:.95rem}
.wl-card h2{margin:4px 0 12px;font-size:2rem}
.wl-card .wl-act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}

/* NumQuest art layer: hero scrims, expedition mission deck, boss modal & defeated stamp */
.heroin{position:relative;z-index:1;max-width:68ch}
.scrim{position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,color-mix(in srgb,var(--paper) 94%,transparent) 0%,color-mix(in srgb,var(--paper) 84%,transparent) 48%,color-mix(in srgb,var(--paper) 36%,transparent) 82%,color-mix(in srgb,var(--paper) 18%,transparent) 100%)}
@media (max-width:680px){
  .scrim{background:linear-gradient(180deg,color-mix(in srgb,var(--paper) 92%,transparent) 0%,color-mix(in srgb,var(--paper) 84%,transparent) 70%,color-mix(in srgb,var(--paper) 72%,transparent) 100%)}
}

/* World map subtle background art */
.map{position:relative}
.map.has-art::before{content:"";position:absolute;inset:0;background-image:var(--map-bg);background-size:cover;background-position:center;opacity:.14;pointer-events:none}
.map.has-art svg{position:relative;z-index:1;background:transparent}

/* Expedition stage cards (#exped) */
.exped{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.xcard{background:var(--paper);border:2px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .12s,border-color .12s}
.xcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.xcard.done{border-color:var(--good)}
.xcard-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.xcard-no{font-family:var(--f-disp);font-weight:700;font-size:.92rem;letter-spacing:.08em;padding:1px 7px;background:var(--ink);color:var(--paper);text-transform:uppercase}
.xcard.done .xcard-no{background:var(--gold);color:var(--on-gold)}
.xcard h3{font-size:1.2rem;margin:0}
.xcard-sub{font-size:.88rem;color:var(--muted);line-height:1.4;margin:0;flex:1}
.xcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;border-top:1px dashed var(--soft);font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.xboss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 4%,var(--paper))}
.xboss.locked{opacity:.75;border-style:dashed}
.xboss.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 5%,var(--paper))}

/* Bossbar + defeated stamp */
.bossbar{position:relative;overflow:hidden}
.bossbar.dead{border-color:var(--good)}
.bossbar.dead::after{content:"DEFEATED";position:absolute;right:18px;top:50%;transform:translateY(-50%) rotate(-12deg);border:3px solid var(--good);color:var(--good);font-family:var(--f-disp);font-weight:700;font-size:1.4rem;letter-spacing:.16em;padding:2px 10px;background:color-mix(in srgb,var(--hud) 86%,transparent);pointer-events:none}

/* Boss intro / victory story card */
.bosscard{background:var(--paper);border:3px solid var(--bad);padding:16px 18px;margin:16px 0}
.bosscard.win{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,var(--paper))}
.bc-grid{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
.bc-art{width:120px;height:120px;object-fit:cover;border:2px solid var(--ink);background:var(--plot)}
.bc-tag{font-family:var(--f-disp);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--bad);font-size:.95rem}
.bosscard.win .bc-tag{color:var(--good)}
.bc-body h3{font-size:1.5rem;margin:2px 0 6px}
.bc-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
@media (max-width:560px){
  .bc-grid{grid-template-columns:1fr}
  .bc-art{width:96px;height:96px}
}

<script>
(function(){
'use strict';
'use strict';
/* =====================================================================
   NumQuest Shared Engine — core1a.js (DOM, plot helpers, state, sound, HUD)
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const G=9.81;
const minus=s=>String(s).replace(/-/g,'−');
const fmt=(v,d=4)=>(v==null||!isFinite(v))?'—':minus(v.toFixed(d));
const numParse=s=>{
  const str=String(s).trim().replace(/−/g,'-');
  if(!str)return null;
  const clean=/^[+-]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(str)?str.replace(/,/g,''):str.replace(',','.');
  const v=Number(clean);
  return(clean===''||!isFinite(v))?null:v;
};

/* ---------- shared SVG plot builder ---------- */
function niceTicks(a,b,n=6){
  const span=b-a,raw=span/n;
  if(!isFinite(span)||span<=0)return [a];
  const p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;
  const step=(m<1.5?1:m<3?2:m<7?5:10)*p,out=[];
  for(let v=Math.ceil(a/step-1e-9)*step;v<=b+1e-9;v+=step)out.push(+v.toPrecision(12));
  return out;
}
function plot(id,xr,yr,o={}){
  const W=640,H=o.h||300,ml=o.ml||50,mr=o.mr||14,mt=o.mt||12,mb=o.mb||30,pw=W-ml-mr,ph=H-mt-mb;
  const cl=v=>Math.max(-1e5,Math.min(1e5,v));
  const sx=x=>cl(ml+(x-xr[0])/(xr[1]-xr[0])*pw), sy=y=>cl(mt+ph-(y-yr[0])/(yr[1]-yr[0])*ph);
  const P={sx,sy,W,H,ml,mr,mt,mb,pw,ph};
  let g='';
  niceTicks(xr[0],xr[1],7).forEach(t=>{g+=`<line class="gl" x1="${sx(t)}" x2="${sx(t)}" y1="${mt}" y2="${mt+ph}"/><text class="tk" x="${sx(t)}" y="${H-10}" text-anchor="middle">${minus(t)}</text>`;});
  niceTicks(yr[0],yr[1],6).forEach(t=>{g+=`<line class="gl" y1="${sy(t)}" y2="${sy(t)}" x1="${ml}" x2="${ml+pw}"/><text class="tk" x="${ml-6}" y="${sy(t)+4}" text-anchor="end">${minus(t)}</text>`;});
  if(yr[0]<0&&yr[1]>0)g+=`<line class="ax" x1="${ml}" x2="${ml+pw}" y1="${sy(0)}" y2="${sy(0)}"/>`;
  if(xr[0]<0&&xr[1]>0)g+=`<line class="ax" y1="${mt}" y2="${mt+ph}" x1="${sx(0)}" x2="${sx(0)}"/>`;
  P.curve=(f,cls,n=320)=>{let d='',pen=false;
    for(let i=0;i<=n;i++){const x=xr[0]+(xr[1]-xr[0])*i/n,y=f(x);
      if(!isFinite(y)||Math.abs(y)>1e4){pen=false;continue}
      d+=(pen?'L':'M')+sx(x).toFixed(1)+' '+sy(y).toFixed(1);pen=true;}
    return `<path d="${d}" class="${cls}" fill="none"/>`;};
  P.line=(x1,y1,x2,y2,cls)=>`<line class="${cls}" x1="${sx(x1)}" y1="${sy(y1)}" x2="${sx(x2)}" y2="${sy(y2)}"/>`;
  P.dot=(x,y,cls,r=4.5)=>`<circle class="${cls}" cx="${sx(x)}" cy="${sy(y)}" r="${r}"/>`;
  P.vline=(x,cls)=>`<line class="${cls}" x1="${sx(x)}" x2="${sx(x)}" y1="${mt}" y2="${mt+ph}"/>`;
  P.hline=(y,cls)=>`<line class="${cls}" x1="${ml}" x2="${ml+pw}" y1="${sy(y)}" y2="${sy(y)}"/>`;
  P.band=(x1,x2,cls)=>`<rect class="${cls}" x="${sx(x1)}" y="${mt}" width="${Math.max(2,sx(x2)-sx(x1))}" height="${ph}"/>`;
  P.text=(x,y,t,anchor='middle')=>`<text class="ptxt" x="${sx(x)}" y="${y}" text-anchor="${anchor}">${t}</text>`;
  P.path=(pts,cls)=>`<polyline class="${cls}" fill="none" points="${pts.map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' ')}"/>`;
  P.poly=(pts,cls)=>`<polygon class="${cls}" points="${pts.map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' ')}"/>`;
  P.wrap=inner=>`<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||'plot'}"><defs><clipPath id="${id}"><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}"/></clipPath></defs>${g}<g clip-path="url(#${id})">${inner}</g></svg>`;
  return P;
}

/* ---------- state ---------- */
const fresh=()=>({xp:0,streak:0,best:0,ex:{},labs:{},badges:{},clear:{},bossBonus:false,bossForce:false,bossSeen:false,teacher:false,sfx:true,theme:''});
let S=fresh();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(fresh(),o)}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- sound ---------- */
let AC=null;
function tone(f,d,type='square',v=.04,when=0){
  if(!S.sfx)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+when;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);}catch(e){}
}
const sfx={
  ok(){tone(660,.1);tone(990,.16,'square',.04,.09)},
  no(){tone(180,.28,'sawtooth',.05)},
  up(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'square',.04,i*.1))},
  clear(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.06,i*.09))}
};

/* ---------- FX ---------- */
function floatText(txt,anchor,cls=''){
  const r=anchor?anchor.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  const d=document.createElement('div');d.className='float '+cls;d.textContent=txt;
  d.style.left=Math.max(8,Math.min(innerWidth-90,r.left+r.width/2-30))+'px';d.style.top=Math.max(70,r.top)+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1150);
}
let bnT=null;
function banner(big,small){
  $('#bnBig').textContent=big;$('#bnSmall').textContent=small||'';const b=$('#banner');b.classList.add('show');
  clearTimeout(bnT);bnT=setTimeout(()=>b.classList.remove('show'),1700);
}
function toast(t,s){const d=document.createElement('div');d.className='toast';d.innerHTML=`<b>${t}</b><span>${s||''}</span>`;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3600)}

/* ---------- levels / XP / HUD ---------- */
function level(xp){let i=0;LEVELS.forEach((l,k)=>{if(xp>=l[0])i=k});return i}
function award(n,anchor){
  if(n<=0)return;
  const before=level(S.xp);S.xp+=n;floatText('+'+n+' XP',anchor);
  const after=level(S.xp);
  if(after>before){sfx.up();banner('Level up!',LEVELS[after][1])}
  save();hud();
}
function grant(id){
  if(S.badges[id])return;const b=BADGES.find(x=>x[0]===id);if(!b)return;
  S.badges[id]=1;toast('Badge: '+b[1],b[2]);save();hud();renderBadges();
}
function hud(){
  const L=level(S.xp),cur=LEVELS[L][0],nxt=LEVELS[L+1]?LEVELS[L+1][0]:null;
  $('#lvNum').textContent=L+1;$('#lvName').textContent=LEVELS[L][1];
  $('#xpFill').style.width=(nxt?Math.min(100,(S.xp-cur)/(nxt-cur)*100):100)+'%';
  $('#xpNum').textContent=nxt?`${S.xp} / ${nxt} XP to ${LEVELS[L+1][1]}`:`${S.xp} XP · top rank`;
  $('#xpTot').textContent=S.xp;
  $('#combo').textContent='x'+S.streak;$('#comboChip').classList.toggle('hot',S.streak>=3);
  $('#bdg').textContent=Object.keys(S.badges).length+'/'+BADGES.length;
  $('#sfxBtn').setAttribute('aria-pressed',S.sfx);$('#teachBtn').setAttribute('aria-pressed',S.teacher);
  document.body.classList.toggle('teacher',S.teacher);
  const h=$('#hud');if(h)document.documentElement.style.setProperty('--hudh',h.offsetHeight+'px');
}

'use strict';
/* =====================================================================
   NumQuest Shared Engine — core1b.js (VIZ mounts, view builder, map, boss card)
   ===================================================================== */
window.NQ_VIZ=window.NQ_VIZ||{};
function vizFor(id,ex){
  const fn=window.NQ_VIZ&&window.NQ_VIZ[id];
  if(!fn)return '';
  try{
    const out=fn(ex);
    if(!out)return '';
    return out.includes('class="viz')?out:`<div class="viz">${out}</div>`;
  }catch(err){return '';}
}
function mountViz(root=document){
  $$('[data-viz]',root).forEach(el=>{
    if(el.dataset.mounted)return;
    const key=el.dataset.viz,fn=window.NQ_VIZ&&window.NQ_VIZ[key];
    if(!fn)return;
    try{const html=fn(el);if(html){el.innerHTML=html;el.dataset.mounted='1'}}catch(err){}
  });
}
function enhanceProfCallouts(root=document){
  if(typeof ART==='undefined'||!ART.guide)return;
  $$('.callout.chief, .callout.prof',root).forEach(box=>{
    if($('.chiefline',box))return;
    const tag=$('.tag',box);
    const wrap=document.createElement('div');wrap.className='chiefline';
    const img=document.createElement('img');img.className='chiefface';
    img.src=ART.guide;img.alt=ART.guideName||'Course guide portrait';
    const body=document.createElement('div');
    Array.from(box.childNodes).forEach(ch=>{if(ch!==tag)body.appendChild(ch)});
    wrap.appendChild(img);wrap.appendChild(body);
    box.appendChild(wrap);
  });
}

const STAGE_BONUS=(typeof STAGE_XP!=='undefined')?STAGE_XP:40;
const BOSS_BONUS=(typeof BOSS_XP!=='undefined')?BOSS_XP:60;
const exSum=id=>EX[id].reduce((a,e)=>a+e.xp,0);
const totalXP=()=>STAGES.reduce((a,s)=>a+exSum(s.id)+STAGE_BONUS+s.labs.reduce((b,l)=>b+(LABXP[l]||0),0),0)+exSum('boss')+BOSS_BONUS;
const VIEWS=()=>['home',...STAGES.map(s=>s.id),'boss'];

function exHTML(e){
  const kind={mcq:'Multiple choice',tf:'True or false',num:'Numeric answer',fill:'Fill the table',classify:'Sort it',order:'Put in order'}[e.type];
  let b='';
  if(e.type==='mcq'||e.type==='tf')b=`<div class="opts">${e.opts.map((o,j)=>`<button type="button" class="opt" data-j="${j}"><span class="key">${'ABCD'[j]}</span><span>${o}</span></button>`).join('')}</div>`;
  if(e.type==='num')b=`<div class="numrow"><input class="numin" id="${e.id}-in" type="text" inputmode="decimal" autocomplete="off" placeholder="your answer" aria-label="Answer"><span class="unit">${e.unit||''}</span></div>`;
  if(e.type==='fill')b=`<div class="fillgrid">${e.fields.map((f,j)=>`<label class="fld">${f.k}<input id="${e.id}-f${j}" data-j="${j}" type="text" inputmode="decimal" autocomplete="off"></label>`).join('')}</div>`;
  if(e.type==='classify')b=`<div class="rows">${e.items.map((it,j)=>`<div class="row" data-j="${j}"><span>${it[0]}</span><span class="seg">${e.cats.map((c,k)=>`<button type="button" data-k="${k}">${c}</button>`).join('')}</span></div>`).join('')}</div>`;
  if(e.type==='order')b=`<div class="rows" data-order>${e.perm.map((p,i)=>`<div class="row orow" data-idx="${p}"><span class="pos">${i+1}</span><span>${e.items[p]}</span><span class="mv"><button type="button" data-mv="-1" aria-label="Move up">▲</button><button type="button" data-mv="1" aria-label="Move down">▼</button></span></div>`).join('')}</div>`;
  const viz=vizFor(e.id,e);
  return `<div class="ex" id="ex-${e.id}" data-id="${e.id}"><div class="ex-top"><span class="ex-kind">${kind}</span><span class="ex-xp"><span class="nut"></span>${e.xp} XP</span><span class="ex-state">Open</span></div>
  <div class="ex-q">${e.q}</div>${e.pre||''}${b}
  <div class="ex-act"><button type="button" class="btn primary" data-act="check">Check</button><button type="button" class="btn ghost" data-act="show">Show solution</button></div>
  <div class="fb" aria-live="polite"></div><div class="sol"><b class="h">Worked solution</b><span class="solt">${e.sol}</span>${viz}</div></div>`;
}
const findEx=id=>{for(const k in EX){const e=EX[k].find(x=>x.id===id);if(e)return e}};

function heroArtHTML(){
  if(typeof ART!=='undefined'&&ART.hero)return `<div class="heroart"><img src="${ART.hero}" alt="${ART.heroAlt||WORLD.title}"></div><div class="scrim"></div>`;
  if(typeof WORLD!=='undefined'&&WORLD.heroSVG)return `<div class="heroart">${WORLD.heroSVG()}</div><div class="scrim"></div>`;
  return '';
}

function stageHero(st){
  const stageXP=exSum(st.id)+st.labs.reduce((a,l)=>a+(LABXP[l]||0),0)+STAGE_BONUS;
  return `<div class="hero">${heroArtHTML()}<div class="heroin"><div class="eyebrow">Stage ${st.no} · ${WORLD.subtitle}</div><h1>${st.title}</h1>
  <p class="mission"><b>Mission</b> &nbsp;${st.mission}</p></div>
  <div class="tblock"><div><span>Sheet</span><b>${st.no}</b></div><div><span>Time</span><b>${st.time}</b></div><div><span>Labs</span><b>${st.labs.length}</b></div><div><span>Checkpoints</span><b>${EX[st.id].length}</b></div><div><span>XP on sheet</span><b>${stageXP}</b></div><div><span>Stars</span><b class="stars" id="hs-${st.id}"></b></div></div></div>
  <div class="track" id="tr-${st.id}"></div>`;
}

function expedHTML(){
  const starStr=n=>'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span>';
  const cards=STAGES.map(st=>{
    const s=stageStats(st.id);
    return `<div class="xcard ${S.clear[st.id]?'done':''}" role="button" tabindex="0" data-go="#${st.id}">
      <div class="xcard-top"><span class="xcard-no">${st.no}</span><span class="stars">${starStr(s.stars)}</span></div>
      <h3>${st.title}</h3>
      <p class="xcard-sub">${st.mission}</p>
      <div class="xcard-foot"><span>${s.done}/${s.total} checks · ${s.labs}/${st.labs.length} labs</span><span>Open →</span></div>
    </div>`;
  }).join('');
  const hit=EX.boss.filter(x=>S.ex[x.id]&&S.ex[x.id].st==='ok').length;
  const okN=k=>EX[k].filter(e=>S.ex[e.id]&&S.ex[e.id].st==='ok').length;
  const have=STAGES.reduce((a,s)=>a+okN(s.id),0),total=STAGES.reduce((a,s)=>a+EX[s.id].length,0);
  const need=Math.ceil((WORLD.boss.needPct||.67)*total),unlocked=S.teacher||have>=need,dead=hit===EX.boss.length;
  const bState=dead?'Defeated ★':(unlocked?'Gate open · '+hit+'/'+EX.boss.length:'Locked · '+have+'/'+need);

function stageNav(id){
  const order=[...STAGES.map(s=>s.id),'boss'];
  const idx=order.indexOf(id);
  const labelFor=k=>{
    if(k==='boss')return WORLD.boss.title;
    const s=STAGES.find(x=>x.id===k);return s?`${s.no} ${s.title}`:k;
  };
  const prevBtn=idx>0?`<a class="btn" href="#${order[idx-1]}">← ${labelFor(order[idx-1])}</a>`:`<a class="btn" href="#home">← World Map</a>`;
  let nextBtn='';
  if(idx>=0&&idx<order.length-1){
    const nk=order[idx+1];
    nextBtn=`<a class="btn primary" href="#${nk}">${nk==='boss'?'Boss: ':''}${labelFor(nk)} →</a>`;
  }else if(id==='boss'&&WORLD.nextWorld){
    nextBtn=`<a class="btn primary" href="${WORLD.nextWorld.href}">Next: ${WORLD.nextWorld.title} →</a>`;
  }else{
    nextBtn=`<a class="btn primary" href="#home">Course Overview →</a>`;
  }
  return `<nav class="stagenav" aria-label="Stage navigation">${prevBtn}<a class="btn ghost" href="#home">Overview</a>${nextBtn}</nav>`;
}

/* ---------- numerical library ---------- */
function linfit(x,y){
  const n=x.length,sx=x.reduce((a,b)=>a+b,0),sy=y.reduce((a,b)=>a+b,0);
  let sxy=0,sxx=0;for(let i=0;i<n;i++){sxy+=x[i]*y[i];sxx+=x[i]*x[i]}
  const a1=(n*sxy-sx*sy)/(n*sxx-sx*sx),a0=sy/n-a1*sx/n;
  const ybar=sy/n;let St=0,Sr=0;for(let i=0;i<n;i++){St+=(y[i]-ybar)**2;Sr+=(y[i]-a0-a1*x[i])**2}
  return {n,sx,sy,sxy,sxx,a0,a1,ybar,St,Sr,sy_:Math.sqrt(St/(n-1)),syx:Math.sqrt(Sr/(n-2)),r2:(St-Sr)/St};
}
function solve(A,b){                       // Gaussian elimination with partial pivoting
  const n=b.length,M=A.map((r,i)=>r.concat([b[i]]));
  for(let c=0;c<n;c++){
    let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
    [M[c],M[p]]=[M[p],M[c]];
    for(let r=c+1;r<n;r++){const f=M[r][c]/M[c][c];for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k]}
  }
  const x=new Array(n).fill(0);
  for(let r=n-1;r>=0;r--){let s=M[r][n];for(let k=r+1;k<n;k++)s-=M[r][k]*x[k];x[r]=s/M[r][r]}
  return x;
}
function polyfit(x,y,m){                   // least squares, x scaled to [-1,1] for conditioning
  const lo=Math.min(...x),hi=Math.max(...x),c=(lo+hi)/2,h=(hi-lo)/2||1,t=x.map(v=>(v-c)/h);
  const A=[],b=[];
  for(let i=0;i<=m;i++){A.push([]);let sb=0;for(let j=0;j<=m;j++){let s=0;for(const v of t)s+=Math.pow(v,i+j);A[i].push(s)}
    for(let k=0;k<t.length;k++)sb+=Math.pow(t[k],i)*y[k];b.push(sb)}
  const co=solve(A,b);
  const f=v=>{const u=(v-c)/h;let s=0;for(let i=m;i>=0;i--)s=s*u+co[i];return s};
  let St=0,Sr=0;const yb=y.reduce((a,v)=>a+v,0)/y.length;
  y.forEach((v,k)=>{St+=(v-yb)**2;Sr+=(v-f(x[k]))**2});
  const dof=y.length-m-1;
  return {f,Sr:Math.max(0,Sr),St,r2:1-Math.max(0,Sr)/St,syx:dof>0?Math.sqrt(Math.max(0,Sr)/dof):null,dof};
}
function divdiff(xs,ys){                   // returns table dd[k][i] = f[x_i ... x_{i+k}]
  const n=xs.length,dd=[ys.slice()];
  for(let k=1;k<n;k++){const p=dd[k-1];dd.push(Array.from({length:n-k},(_,i)=>(p[i+1]-p[i])/(xs[i+k]-xs[i])))}
  return dd;
}
function newtonEval(xs,dd,x){let r=dd[0][0],t=1;for(let k=1;k<xs.length;k++){t*=(x-xs[k-1]);r+=dd[k][0]*t}return r}
function lerpEval(xs,ys,x){
  let i=0;while(i<xs.length-2&&x>xs[i+1])i++;
  return ys[i]+(ys[i+1]-ys[i])/(xs[i+1]-xs[i])*(x-xs[i]);
}

const regTable=(x,y,a0,a1,xl,yl,d=3)=>{
  const ybar=y.reduce((a,b)=>a+b,0)/y.length;
  return `<div class="tw"><table><thead><tr><th>i</th><th>${xl}</th><th>${yl}</th><th>$\\hat{y}$</th><th>$y - \\hat{y}$</th><th>$(y - \\hat{y})^{2}$</th><th>$(y - \\bar{y})^{2}$</th></tr></thead><tbody>${x.map((v,i)=>{const yh=a0+a1*v;return `<tr><td>${i+1}</td><td>${fmt(v,2)}</td><td>${fmt(y[i],1)}</td><td>${fmt(yh,d)}</td><td>${fmt(y[i]-yh,d)}</td><td>${fmt((y[i]-yh)**2,d)}</td><td>${fmt((y[i]-ybar)**2,d)}</td></tr>`}).join('')}</tbody></table></div>`;
};

const SEC={};
SEC.line=`
<section class="sec"><h2><span class="no">A</span>Fit or interpolate?</h2>
<div class="prose"><p>You have a table of measurements and you need a value that is not in it. There are two honest ways to get one, and they answer different questions.</p></div>
<div class="grid2" style="margin-top:12px"><div class="card"><h3>Curve fitting (regression)</h3><ul class="tight"><li>Data are scattered, with measurement error</li><li>The curve follows the trend and misses most points</li><li>Chosen to make the total error as small as possible</li></ul></div><div class="card"><h3>Interpolation</h3><ul class="tight"><li>Data are exact, such as a property table</li><li>The curve passes through every point</li><li>Used to estimate values between rows</li></ul></div></div>
<p class="prose" style="margin-top:12px">This stage covers fitting a straight line. Stage 3-2 bends the curve, and stage 3-3 does interpolation. Here is a real-looking data set, the grain-size strength data from the lecture:</p>
${hz(GRAIN.x.map(v=>v.toFixed(3)),GRAIN.y,'Diameter (mm)','Strength (MPa)')}
<div class="callout prof"><span class="tag">Prof says</span><p>If you ever draw a “best” line by eye, the next student will draw a different one. Regression replaces opinion with a rule, and the rule is: make the vertical misses as small as possible, all together.</p></div>
</section>

<section class="sec"><h2><span class="no">B</span>Residuals and the least-squares rule</h2>
<div class="prose"><p>A <b>residual</b> is the vertical distance from a data point to the line, $e_{i} = y_{i} - (a_{0} + a_{1}x_{i})$. Two tempting rules fail:</p>
<ul class="tight"><li><b>Minimise $\\sum e_{i}$.</b> Positive and negative misses cancel, so many lines score a perfect zero.</li><li><b>Minimise the biggest miss (minimax).</b> One outlier decides the whole line.</li></ul>
<p>Least squares minimises the sum of the <b>squared</b> residuals:</p>
<div class="formula">$$S_r=\\sum e_i^{2}=\\sum\\left(y_i-a_0-a_1x_i\\right)^{2}$$</div>
<p>Set $\\partial S_{r}/\\partial a_{0} = 0$ and $\\partial S_{r}/\\partial a_{1} = 0$. The two equations that result are linear in $a_{0}$ and $a_{1}$, and their solution is:</p>
<div class="formula">$$a_1=\\dfrac{n\\sum x_iy_i-\\sum x_i\\sum y_i}{n\\sum x_i^{2}-\\left(\\sum x_i\\right)^{2}},\\qquad a_0=\\bar{y}-a_1\\bar{x}$$<div class="fnote">$\\bar{x}$ and $\\bar{y}$ are the means.</div></div></div>
<div class="callout trap"><span class="tag">Trap!</span><p>Calculate the slope first, then the intercept. The intercept formula uses $a_{1}$. Also watch the order in the denominator: $n\\sum x^{2} - (\\sum x)^{2}$ is not the same as $n\\sum (x^{2}) - \\sum (x^{2})$.</p></div>
</section>

<section class="sec"><h2><span class="no">C</span>Worked example: concrete strength</h2>
<div class="wx">
<div class="wx-head"><div><b>Worked example: 28-day concrete strength vs water-cement ratio</b></div></div>
<div class="wx-grid">

<section class="sec"><h2><span class="no">D</span>How good is the fit?</h2>
<div class="prose"><p>Two sums of squares tell the story. <b>$S_{t}$</b> is the spread of the data about the mean, which is what you would have with no model at all. <b>$S_{r}$</b> is the spread that remains after the line.</p>
<div class="formula">$$S_t=\\sum\\left(y_i-\\bar{y}\\right)^{2},\\qquad S_r=\\sum\\left(y_i-\\hat{y}_i\\right)^{2}$$ $$s_y=\\sqrt{\\dfrac{S_t}{n-1}},\\qquad s_{y/x}=\\sqrt{\\dfrac{S_r}{n-2}}$$<div class="fnote">$s_{y/x}$ is the standard error of the estimate.</div> $$r^{2}=\\dfrac{S_t-S_r}{S_t}$$<div class="fnote">$r^2=1$ is a perfect fit and $r^2$ near 0 is useless.</div></div>
<p>The regression has <b>merit</b> when $s_{y/x} < s_{y}$. For the concrete data $S_{t}$ = ${fmt(LC.St,3)},$S_{r}$ = ${fmt(LC.Sr,3)},$s_{y}$ = ${fmt(LC.sy_,3)},$s_{y/x}$ = ${fmt(LC.syx,4)} and <b>$r^{2}$ = ${fmt(LC.r2,4)}</b>. The line explains ${fmt(LC.r2*100,2)}% of the variation in strength.</p></div>
<div class="callout trap"><span class="tag">Trap!</span><p>A high $r^{2}$ does not prove a line is the right shape. A curved data set can still score 0.9 or more. Plot the residuals. If they form a smile, a frown or a wave, the model is wrong however good $r^{2}$ looks. The correlation coefficient r carries the sign of the slope, here negative.</p></div>
</section>

<section class="sec"><h2><span class="no">E</span>Drag the line yourself</h2>
<div class="prose"><p>Set $a_{0}$ and $a_{1}$ with the sliders and watch $S_{r}$, the sum of the squared red residuals, change. Can you get within 10% of the least-squares minimum by eye and by number? Then try the grain-size data and see what a poor model looks like.</p></div>
<div class="stage-viz" data-viz="w3-r2-trap"></div>
<div class="lab" id="lab-ln"></div>
<div class="callout ce"><span class="tag">CE link</span><p>Regression is behind most design charts: strength against w/c ratio, settlement against log time, rainfall intensity against duration. A line fitted to lab data becomes the equation in your design code. Check that the data really are straight, as in the Trap above.</p></div>
<div class="callout mat"><span class="tag">MATLAB link</span>
<pre><span class="cm">% straight-line fit to the concrete data</span>
x = [0.40 0.45 0.50 0.55 0.60 0.65 0.70];
y = [47 43 39 34 31 26 24];
p = polyfit(x, y, 1)          <span class="cm">% [-79.2857  78.4643]  = [a1 a0]</span>
yhat = polyval(p, 0.525)      <span class="cm">% 36.84 MPa</span></pre></div>
</section>`;

SEC.curve=`
<section class="sec"><h2><span class="no">A</span>When a line is not enough</h2>
<div class="prose"><p>Take the grain-size data again. A straight line through them has $r^{2} = 0.66$ and $s_{y/x} = 30.2$ MPa. The data drop steeply, then flatten, and no line can bend. The fix is a polynomial of higher degree:</p>
<div class="formula">$$y=a_0+a_1x+a_2x^{2}+\\cdots+a_mx^{m}$$</div>
<p>The rule is unchanged: choose the coefficients that minimise $S_{r} = \\sum ($ $y_{i} - a_{0} - a_{1}x_{i} -$ … $- a_{m}x_{i}^{m}$ $)^{2}$.</p></div>
</section>

<section class="sec"><h2><span class="no">B</span>The quadratic normal equations</h2>
<div class="prose"><p>Differentiate $S_{r}$ with respect to $a_{0}, a_{1}$ and $a_{2}$ and set each to zero:</p>
<div class="formula">$$\\begin{bmatrix}n&\\sum x&\\sum x^{2}\\\sum x&\\sum x^{2}&\\sum x^{3}\\\sum x^{2}&\\sum x^{3}&\\sum x^{4}\\end{bmatrix}\\begin{bmatrix}a_0\\a_1\\a_2\\end{bmatrix}=\\begin{bmatrix}\\sum y\\\sum xy\\\sum x^{2}y\\end{bmatrix}$$</div></div>
<div class="wx">
<div class="wx-head"><div><b>Worked example: grain-size strength quadratic fit</b></div></div>
<div class="wx-grid">
<figure class="wx-fig"><svg class="plot" viewBox="0 0 440 240" role="img" aria-label="Quadratic least-squares curve fitting decaying grain strength data"><line x1="42" y1="16" x2="42" y2="212" stroke="var(--ink)" stroke-width="1.4"/><line x1="42" y1="212" x2="424" y2="212" stroke="var(--ink)" stroke-width="1.4"/><polyline points="42.0,48.9 48.4,55.9 54.7,62.7 61.1,69.4 67.5,75.8 73.8,82.1 80.2,88.3 86.6,94.2 92.9,100.0 99.3,105.6 105.7,111.0 112.0,116.2 118.4,121.3 124.8,126.2 131.1,130.9 137.5,135.4 143.9,139.8 150.2,144.0 156.6,148.0 163.0,151.8 169.3,155.5 175.7,158.9 182.1,162.3 188.4,165.4 194.8,168.3 201.2,171.1 207.5,173.7 213.9,176.1 220.3,178.4 226.6,180.5 233.0,182.3 239.4,184.1 245.7,185.6 252.1,187.0 258.5,188.2 264.8,189.2 271.2,190.0 277.6,190.7 283.9,191.2 290.3,191.5 296.7,191.6 303.0,191.6 309.4,191.4 315.8,191.0 322.1,190.4 328.5,189.7 334.9,188.7 341.2,187.6 347.6,186.4 354.0,184.9 360.3,183.3 366.7,181.5 373.1,179.5 379.4,177.4 385.8,175.0 392.2,172.5 398.5,169.8 404.9,167.0" fill="none" stroke="var(--good)" stroke-width="2.6"/><circle cx="57.9" cy="32.3" r="4.5" fill="var(--qx)"/><circle cx="70.7" cy="92.2" r="4.5" fill="var(--qx)"/><circle cx="92.9" cy="108.6" r="4.5" fill="var(--qx)"/><circle cx="121.6" cy="149.9" r="4.5" fill="var(--qx)"/><circle cx="169.3" cy="158.6" r="4.5" fill="var(--qx)"/><circle cx="239.4" cy="168.4" r="4.5" fill="var(--qx)"/><circle cx="312.6" cy="179.3" r="4.5" fill="var(--qx)"/><circle cx="392.2" cy="182.6" r="4.5" fill="var(--qx)"/><text x="105.7" y="232" text-anchor="middle">0.02</text><text x="233.0" y="232" text-anchor="middle">0.06</text><text x="360.3" y="232" text-anchor="middle">0.10 mm</text><text x="36" y="183.3" text-anchor="end">70</text><text x="36" y="107.1" text-anchor="end">140</text><text x="36" y="30.9" text-anchor="end">210</text><text x="239.4" y="36" text-anchor="middle" style="fill:var(--good);font-weight:700">y = 189.8 - 3256x + 20213x^2</text></svg><figcaption>The parabola captures the steep decay at small grain diameters where a line fails ($r^2 = 0.958$ vs $0.66$).</figcaption></figure>
<div>
<ol class="wx-steps">
<li><b>Normal system:</b> $n=8, \\sum x=0.352, \\sum y=893, \\sum x^2=0.025756$.</li>
<li><b>Fitted model:</b> $\\hat{y} = 189.80 - 3255.6x + 20212.7x^2$.</li>
<li><b>Resample clean grid:</b> $0.017\\text{ to }0.033\\text{ mm}$ feeds stage 3-4 differentiation.</li>
</ol>
<div class="wx-ans">$\\hat{y} = 189.80 - 3255.6\\,x + 20212.7\\,x^2$</div>
</div>
</div>
</div>
${hz([0.017,0.021,0.025,0.029,0.033],[0.017,0.021,0.025,0.029,0.033].map(v=>fmt(grainP2.f(v),2)),'Diameter (mm)','Strength (MPa)')}
<div class="stage-viz" data-viz="w3-overfit-dof"></div>
<div class="callout prof"><span class="tag">Prof says</span><p>Look at those coefficients: 20212 on $x^{2}, 3255$ on $x$. They are huge only because $x$ is tiny, around 0.01. Matrix entries like $\\sum x^{4} = 0.0002$ are also tiny, so the system is touchy. Rescaling $x$ (for example to micrometres) keeps the numbers friendly.</p></div>
</section>

<section class="sec"><h2><span class="no">C</span>Measuring a polynomial fit</h2>
<div class="prose"><p>The same quantities carry over, with one change. A degree-m polynomial uses up $m + 1$ degrees of freedom, so:</p>
<div class="formula">$$s_{y/x}=\\sqrt{\\dfrac{S_r}{n-(m+1)}},\\qquad r^{2}=\\dfrac{S_t-S_r}{S_t}$$</div>
<p>Adding terms can only lower $S_{r}$, so $r^{2}$ creeps upward whatever you do. $s_{y/x}$ is the honest score, because it penalises wasted terms. It bottoms out at the sensible degree and then rises again. Find that degree yourself:</p></div>
<div class="stage-viz" data-viz="w3-syx-curve"></div>
<div class="lab" id="lab-deg"></div>
<div class="callout trap"><span class="tag">Trap!</span><p>With $n$ points, a polynomial of degree $n - 1$ passes through every one of them. $S_{r}$ is zero and $r^{2}$ is exactly 1, but that is interpolation, not regression. The fit has copied the noise, and $s_{y/x}$ cannot even be calculated because the divisor $n - (m + 1)$ is zero.</p></div>
</section>

<section class="sec"><h2><span class="no">D</span>More than one input</h2>
<div class="prose"><p>Often a quantity depends on several inputs. Concrete strength depends on cement content and on curing age. <b>Multiple linear regression</b> fits a plane:</p>
<div class="formula">$$y=a_0+a_1x_1+a_2x_2$$</div>
<p>The least-squares recipe is the same, with one normal equation per coefficient:</p>
<div class="formula">$$\\begin{bmatrix}n&\\sum x_1&\\sum x_2\\\\\\sum x_1&\\sum x_1^{2}&\\sum x_1x_2\\\\\\sum x_2&\\sum x_1x_2&\\sum x_2^{2}\\end{bmatrix}\\begin{bmatrix}a_0\\\\a_1\\\\a_2\\end{bmatrix}=\\begin{bmatrix}\\sum y\\\\\\sum x_1y\\\\\\sum x_2y\\end{bmatrix}$$</div>
<p>Same shape of problem, a $3 \\times 3$ linear system. A checkpoint below gives you one to solve.</p></div>
<div class="callout mat"><span class="tag">MATLAB link</span>
<pre><span class="cm">% parabola through the settlement readings</span>
x = 0:5;  y = [1.2 3.4 6.1 12.8 19.0 30.1];
p = polyfit(x, y, 2)          <span class="cm">% [1.0446  0.4339  1.4393]  = [a2 a1 a0]</span>

<span class="cm">% multiple linear regression: build the matrix and solve</span>
X = [ones(8,1) x1 x2];        <span class="cm">% x1, x2 are 8x1 column vectors</span>
a = X \\ y;                    <span class="cm">% least-squares coefficients [a0; a1; a2]</span></pre></div>
</section>`;

SEC.interp=`
<section class="sec"><h2><span class="no">A</span>Through every point</h2>
<div class="prose"><p>Interpolation builds a function that gives the <b>exact</b> value at each data point and a sensible estimate between them. Our running example is real: the kinematic viscosity of water, which every pipe-flow calculation needs.</p></div>
${hz(VISC.x,VISC.y,'T (°C)','$\\nu$ ($\\times 10^{-6}$ $\\mathrm{m}^{2}/\\mathrm{s}$)')}
<div class="prose"><p>You want $\\nu$ at 17 °C, which is not in the table. The simplest answer joins the two neighbours with a straight line:</p>
<div class="formula">$$f(x)=f(x_0)+\\dfrac{f(x_1)-f(x_0)}{x_1-x_0}\\,(x-x_0)$$</div>
<p>Between 15 °C and 20 °C: $\\nu (17) = 1.139 + (-0.027)(2)$ = <b>1.085</b>. A curved table gets better answers from a curved interpolant.</p></div>
</section>

<section class="sec"><h2><span class="no">B</span>Newton’s polynomial</h2>
<div class="prose"><p>Newton’s form adds one term for each new point, so earlier work is never wasted:</p>
<div class="formula">$$P(x)=b_0+b_1(x-x_0)+b_2(x-x_0)(x-x_1)+b_3(x-x_0)(x-x_1)(x-x_2)+\\cdots$$</div></div>
${ddTable}
<div class="wx">
<div class="wx-head"><div><b>Worked example: water kinematic viscosity at $T = 17\\,^\\circ\\text{C}$</b></div></div>
<div class="wx-grid">
<figure class="wx-fig"><svg class="plot" viewBox="0 0 440 240" role="img" aria-label="Newton quadratic vs linear interpolation for water viscosity at 17 C"><line x1="46" y1="16" x2="46" y2="212" stroke="var(--ink)" stroke-width="1.4"/><line x1="46" y1="212" x2="424" y2="212" stroke="var(--ink)" stroke-width="1.4"/><line x1="185.3" y1="98.7" x2="284.7" y2="151.6" stroke="var(--qh)" stroke-width="1.8" stroke-dasharray="5 3"/><polyline points="85.8,32.9 95.7,40.0 105.7,47.1 115.6,54.0 125.6,60.8 135.5,67.4 145.5,73.9 155.4,80.3 165.4,86.6 175.3,92.7 185.3,98.7 195.2,104.6 205.2,110.3 215.1,115.9 225.1,121.4 235.0,126.8 244.9,132.0 254.9,137.1 264.8,142.1 274.8,146.9 284.7,151.6 294.7,156.2 304.6,160.7 314.6,165.0 324.5,169.2 334.5,173.2 344.4,177.2 354.4,181.0 364.3,184.7 374.3,188.2 384.2,191.6" fill="none" stroke="var(--good)" stroke-width="2.5"/><circle cx="85.8" cy="32.9" r="4.5" fill="var(--qx)"/><circle cx="185.3" cy="98.7" r="4.5" fill="var(--qx)"/><circle cx="284.7" cy="151.6" r="4.5" fill="var(--qx)"/><circle cx="225.1" cy="121.4" r="5.5" fill="var(--qe)" stroke="var(--plot)" stroke-width="1.5"/><text x="233.1" y="113.4" style="fill:var(--qe);font-weight:700">T=17: 1.08104</text><text x="85.8" y="232" text-anchor="middle">10 C</text><text x="185.3" y="232" text-anchor="middle">15 C</text><text x="284.7" y="232" text-anchor="middle">20 C</text><text x="384.2" y="232" text-anchor="middle">25 C</text><text x="40" y="153.2" text-anchor="end">1.0</text><text x="40" y="35.6" text-anchor="end">1.3</text></svg><figcaption>Quadratic curve through $(10,1.307)$, $(15,1.139)$, $(20,1.004)$ drops smoothly under the dashed linear chord.</figcaption></figure>
<div>
<ol class="wx-steps">
<li><b>Read top diagonal:</b> $b_0=1.307$, $b_1=-0.0336$, $b_2=0.00066$.</li>
<li><b>Substitute $T=17$:</b> $1.307 - 0.0336(7) + 0.00066(7)(2) = 1.08104$.</li>
<li><b>4-point upgrade:</b> add $b_3(7)(2)(-3) = +0.000504 \\Rightarrow 1.08154$.</li>
</ol>
<div class="wx-ans">$\\nu(17\\,^\\circ\\text{C}) = 1.08104 \\times 10^{-6}\\text{ m}^2/\\text{s}$ (vs linear $1.0850$)</div>
</div>
</div>
</div>
<div class="stage-viz" data-viz="w3-lagrange-switch"></div>
</section>

<section class="sec"><h2><span class="no">C</span>Lagrange polynomial</h2>
<div class="prose"><p>Lagrange’s form writes the same polynomial as a weighted sum of values:</p>
<div class="formula">$$P(x)=\\sum_i f(x_i)\\,L_i(x),\\qquad L_i(x)=\\prod_{j\\ne i}\\dfrac{x-x_j}{x_i-x_j}$$</div>
<p>Each $L_{i}$ acts like a switch: it equals 1 at its own node and 0 at every other. For nodes 10, 15, 20 and $x = 17$ the weights are $L_{0} = -0.12, L_{1} = 0.84$ and $L_{2} = 0.28$, which add to 1, and:</p>
<div class="formula">$$P(17)=1.307(-0.12)+1.139(0.84)+1.004(0.28)=\\mathbf{1.08104}$$</div>
<p>The same number as Newton, because only one polynomial of degree 2 passes through three points.</p></div>
<div class="callout prof"><span class="tag">Prof says</span><p>Which one should you use? Lagrange is quick to write for a single point. Newton wins when you may add data later, or when you want a table to check your arithmetic. They will never disagree with each other.</p></div>
</section>

<section class="sec"><h2><span class="no">D</span>More points is not always better</h2>
<div class="prose"><p>It is tempting to use every point you have. The lab pits a single high-degree polynomial against piecewise linear segments on a famous test function, and shows a case where interpolation behaves well.</p></div>
<div class="stage-viz" data-viz="w3-runge-edge"></div>
<div class="lab" id="lab-wig"></div>
<div class="callout trap"><span class="tag">Trap!</span><p><b>Runge’s phenomenon.</b> For equally spaced nodes, the polynomial through many points oscillates wildly near the ends, even when the data are smooth. Use a low-degree polynomial through nearby points, or a <b>cubic spline</b> that joins separate cubic pieces. Never extrapolate far beyond the data.</p></div>
<div class="callout mat"><span class="tag">MATLAB link</span>
<pre>T  = [5 10 15 20 25 30];
nu = [1.519 1.307 1.139 1.004 0.893 0.801];

interp1(T, nu, 17)                <span class="cm">% linear, 1.0850</span>
interp1(T, nu, 17, 'spline')      <span class="cm">% cubic spline, close to 1.081</span>
polyfit(T, nu, 5)                 <span class="cm">% degree 5 passes through all six points</span></pre></div>
</section>`;

SEC.diff=`
<section class="sec"><h2><span class="no">A</span>The slope of a table</h2>
<div class="prose"><p>A derivative is a slope, and slopes matter everywhere in civil engineering. Velocity is the slope of position, a beam’s bending moment comes from the curvature of its deflection, and heat flow in soil follows the temperature gradient. When the function is a table of measurements or too awkward to differentiate by hand, you estimate the slope from neighbouring values. This is the <b>finite difference method</b>.</p></div>
</section>

<section class="sec"><h2><span class="no">B</span>Three 2-point formulas</h2>
<div class="prose"><p>For equally spaced data with step $h$:</p></div>
${rowT(['Name','Formula','Uses','Error'],[['Forward','$\\dfrac{f(x_{i+1})-f(x_i)}{h}$','right side','$O(h)$'],['Backward','$\\dfrac{f(x_i)-f(x_{i-1})}{h}$','left side','$O(h)$'],['Central','$\\dfrac{f(x_{i+1})-f(x_{i-1})}{2h}$','both sides','$O(h^{2})$']])}
<div class="prose"><p>Each one is the slope of a straight line joining two data points. The closer the points, the better the estimate. The central formula is more accurate for the same $h$ because the errors from the two sides cancel.</p>
<p>Example: $f(x) = x^{3}$ at $x = 3$, where the exact slope is $3x^{2} = 27$.</p></div>
${rowT(['$h$','Forward','Backward','Central','Central error'],diffRows)}
<div class="callout trap"><span class="tag">Trap!</span><p>Take care with $h$. Forward and backward errors fall in proportion to $h$. Central error falls with $h^{2}$, so halving $h$ cuts it by four. But as the lab shows, shrinking $h$ forever only works for perfect data.</p></div>
</section>

<section class="sec"><h2><span class="no">C</span>Slope Scope lab</h2>
<div class="prose"><p>Pick a function and a formula, then slide $h$. The error plot shows how each formula behaves on log scales, where a straight line of slope 1 means $O(h)$ and a straight line of slope 2 means $O(h^{2})$. Add noise to the data and watch what happens to a small $h$.</p></div>
<div class="stage-viz" data-viz="w3-stencil-cancel"></div>
<div class="lab" id="lab-slp"></div>
</section>

<section class="sec"><h2><span class="no">D</span>More points, higher derivatives</h2>
<div class="prose"><p>Using more neighbours gives higher accuracy. Subscripts are offsets from $x_{i}$:</p></div>
${rowT(['Formula','Expression','Error'],[
 ['3-point forward $f^{\\prime}$','$\\dfrac{-3f_0+4f_1-f_2}{2h}$','$O(h^{2})$'],
 ['3-point backward $f^{\\prime}$','$\\dfrac{3f_0-4f_{-1}+f_{-2}}{2h}$','$O(h^{2})$'],
 ['5-point central $f^{\\prime}$ <span class="cm">(4 neighbours)</span>','$\\dfrac{f_{-2}-8f_{-1}+8f_1-f_2}{12h}$','$O(h^{4})$'],
 ['3-point central $f^{\\prime\\prime}$','$\\dfrac{f_{-1}-2f_0+f_1}{h^{2}}$','$O(h^{2})$'],
 ['5-point central $f^{\\prime\\prime}$','$\\dfrac{-f_{-2}+16f_{-1}-30f_0+16f_1-f_2}{12h^{2}}$','$O(h^{4})$'],
 ['Central $f^{\\prime\\prime\\prime}$','$\\dfrac{f_2-2f_1+2f_{-1}-f_{-2}}{2h^{3}}$','$O(h^{2})$']])}
<div class="wx">
<div class="wx-head"><div><b>Worked example: particle velocity at boundary $t = 5.0\\text{ s}$ ($h = 0.2\\text{ s}$)</b></div></div>
<div class="wx-grid">
<figure class="wx-fig"><svg class="plot" viewBox="0 0 440 240" role="img" aria-label="3-point forward difference tangent slope 6.65 mm/s vs 2-point chord 6.10 mm/s"><polyline points="62.5,215.3 76.1,206.1 89.8,196.9 103.4,187.9 117.0,179.1 130.7,170.4 144.3,161.8 158.0,153.5 171.6,145.2 185.2,137.1 198.9,129.2 212.5,121.4 226.2,113.7 239.8,106.2 253.5,98.9 267.1,91.7 280.8,84.6 294.4,77.7 308.0,70.9 321.7,64.3 335.3,57.9 349.0,51.5 362.6,45.4 376.3,39.4 389.9,33.5" fill="none" stroke="var(--qx)" stroke-width="2.5"/><line x1="96.6" y1="192.4" x2="233.0" y2="109.9" stroke="var(--qh)" stroke-width="2" stroke-dasharray="5 3"/><line x1="96.6" y1="192.4" x2="267.1" y2="80.0" stroke="var(--qe)" stroke-width="2.4"/><circle cx="96.6" cy="192.4" r="5" fill="var(--ink)"/><circle cx="233.0" cy="109.9" r="4.5" fill="var(--qx)"/><circle cx="369.4" cy="42.4" r="4.5" fill="var(--qx)"/><text x="219.4" y="74.0" style="fill:var(--qe);font-weight:700">3-pt tangent = 6.65 mm/s</text><text x="178.4" y="161.3" style="fill:var(--qh);font-weight:600">2-pt chord = 6.10</text><text x="96.6" y="232" text-anchor="middle">5.0 s</text><text x="233.0" y="232" text-anchor="middle">5.2 s</text><text x="369.4" y="232" text-anchor="middle">5.4 s</text></svg><figcaption>Three-point forward stencil uses curvature from $(5.4, 4.31)$ to sharpen the boundary slope from $6.10$ to $6.65\\text{ mm/s}$.</figcaption></figure>
<div>
<ol class="wx-steps">
<li><b>Data ($h=0.2$):</b> $f_0 = 2.09$, $f_1 = 3.31$, $f_2 = 4.31\\text{ mm}$.</li>
<li><b>Apply $O(h^2)$ stencil:</b> $\\dfrac{-3(2.09) + 4(3.31) - 4.31}{2(0.2)} = \\dfrac{2.66}{0.4}$.</li>
<li><b>Compare 2-pt forward:</b> $(3.31 - 2.09)/0.2 = 6.10\\text{ mm/s}$ (only $O(h)$).</li>
</ol>
<div class="wx-ans">$v(5.0) = 6.65\\text{ mm/s}$</div>
</div>
</div>
</div>
<div class="stage-viz" data-viz="w3-noise-floor"></div>
<div class="callout ce"><span class="tag">CE link</span><p>A beam’s bending moment is $M = -EI\\cdot y^{\\prime\\prime}$. If you have measured deflections at equal spacing, the 3-point central second-derivative formula turns them into moments. You will do exactly this in the boss fight.</p></div>
</section>

<section class="sec"><h2><span class="no">E</span>Uneven or noisy data</h2>
<div class="prose"><p>The formulas assume equal spacing and clean values. Real data break both rules:</p>
<ul class="tight"><li><b>Uneven spacing.</b> Interpolate (stage 3-3) to build an evenly spaced grid, then difference it. Example: ground temperature at depths 0, 1.25 and 3.75 m is fitted by the quadratic $P(z) = 10 + 1.6z - 0.26667z(z - 1.25)$. Evaluating it at 3.0, 3.25 and 3.5 m and applying central difference with $h = 0.25$ gives the gradient at 3.25 m: 0.2 °C/m.</li>
<li><b>Noisy data.</b> Fit a smooth regression curve first (stage 3-2), evaluate it on an even grid, then difference. The grain-size quadratic evaluated at 0.017, 0.021, … 0.033 mm gives $d\\sigma /dd \\approx -2245$ MPa/mm at 0.025 mm.</li></ul></div>
<div class="callout trap"><span class="tag">Trap!</span><p>Differencing amplifies noise. An error $\\sigma$ in each reading becomes about $\\sigma /h$ in the slope, so a tiny $h$ on noisy data is the worst of both worlds. Smooth first, then differentiate.</p></div>
</section>

<section class="sec"><h2><span class="no">F</span>MATLAB shortcuts</h2>
<div class="callout mat"><span class="tag">MATLAB link</span>
<p><code>diff(x)</code> returns the successive differences, one element shorter than <code>x</code>. <code>diff(x, 2)</code> applies it twice. <code>polyder(p)</code> returns the coefficients of the derivative of a polynomial.</p>
<pre>h = 0.2;
t = 4:h:6.4;
dfdt = diff(f) / h;               <span class="cm">% forward differences, length(f) - 1 values</span>
d2f  = diff(f, 2) / h^2;          <span class="cm">% second differences</span>

p  = polyfit(d, s, 2);            <span class="cm">% smooth the noisy data first</span>
dp = polyder(p);                  <span class="cm">% derivative of the fitted quadratic</span>
polyval(dp, 0.025)                <span class="cm">% -2245 MPa/mm</span></pre></div>
</section>`;

const WIG={

function labWiggle(root){

   <div class="ctl"><label for="wig-n">Nodes $n$ <span class="v" id="wig-nv"></span></label><input id="wig-n" type="range" min="2" max="14" step="1" value="5"></div>

    q('#wig-nv').textContent=W.nodes?st.n:'6 (fixed)';q('#wig-n').disabled=!W.nodes;q('#wig-n').value=W.nodes?st.n:6;

    const s=q('#wig-s');

/* ---------- Lab: Slope scope ---------- */
const SLF={
 cube:{n:'f = x³ at x = 3',f:x=>x**3,df:x=>3*x*x,x0:3},
 sin:{n:'f = sin x at x = 1',f:Math.sin,df:Math.cos,x0:1},
 exp:{n:'f = eˣ at x = 1',f:Math.exp,df:Math.exp,x0:1}
};
const SLM={fwd:'Forward',bwd:'Backward',cen:'Central',c5:'5-point central'};
const nz=(x,s)=>{if(!s)return 0;const r=Math.sin(Math.round(x*1e9)*12.9898e-3+78.233)*43758.5453;return s*((r-Math.floor(r))*2-1)};
function slopeEst(F,m,h,s){
  const x0=F.x0,g=x=>F.f(x)+nz(x,s);
  if(m==='fwd')return (g(x0+h)-g(x0))/h;
  if(m==='bwd')return (g(x0)-g(x0-h))/h;
  if(m==='cen')return (g(x0+h)-g(x0-h))/(2*h);
  return (g(x0-2*h)-8*g(x0-h)+8*g(x0+h)-g(x0+2*h))/(12*h);
}
function labSlope(root){
  const st={fn:'cube',m:'fwd',e:-1,sg:0,seen:{}};
  root.innerHTML=labHead('slp','Slope scope','try all four formulas with $h \\le 0.1$')+`<div class="lab-body"><div class="lab-plot"><div id="slp-plot"></div>
   <div class="legend"><span><i style="background:var(--c1)"></i>$f(x)$</span><span><i style="background:var(--c2)"></i>secant used</span><span><i style="background:var(--c3)"></i>true tangent</span><span><i style="background:var(--ink);border-radius:50%;height:8px;width:8px"></i>samples used</span></div>
   <div id="slp-eplot" style="margin-top:10px"></div>
   <div class="legend"><span><i style="background:var(--c2)"></i>forward</span><span><i style="background:var(--c3)"></i>backward</span><span><i style="background:var(--c1)"></i>central</span><span><i style="background:var(--ink)"></i>5-point central</span><span>axes: $\\log_{10} h$ and $\\log_{10}|\\text{error}|$</span></div></div>
   <div class="controls"><div class="ctl"><label for="slp-fn">Function</label><select id="slp-fn">${Object.keys(SLF).map(k=>`<option value="${k}">${SLF[k].n}</option>`).join('')}</select></div>
   <div class="btns" role="group" aria-label="Formula">${Object.keys(SLM).map(k=>`<button type="button" class="btn ${k==='fwd'?'on':''}" data-m="${k}">${SLM[k]}</button>`).join('')}</div>
   <div class="ctl"><label for="slp-h">Step $h$ <span class="v" id="slp-hv"></span></label><input id="slp-h" type="range" min="-3" max="0" step="0.05" value="-1"></div>
   <div class="ctl"><label for="slp-sg">Noise in the data (±)</label><select id="slp-sg"><option value="0">none</option><option value="0.001">0.001</option><option value="0.01">0.01</option><option value="0.05">0.05</option></select></div>
   <div class="tiles">${tile('Estimate','','slp-e')}${tile('True $f^{\\prime}$','','slp-t')}${tile('Error','','slp-er')}${tile('Relative error','','slp-rel')}</div>
   <div class="status" id="slp-s"></div></div></div>`;
  const q=s=>$(s,root);
  const hOf=()=>Math.pow(10,st.e);
  function draw(){
    const F=SLF[st.fn],h=hOf(),x0=F.x0,tr=F.df(x0),g=x=>F.f(x)+nz(x,st.sg);
    const w=Math.max(2.4*h,1e-4),xr=[x0-w,x0+w];
    const ys=[];for(let i=0;i<=40;i++)ys.push(F.f(xr[0]+(xr[1]-xr[0])*i/40));
    const used=st.m==='c5'?[-2,-1,0,1,2]:st.m==='fwd'?[0,1]:st.m==='bwd'?[-1,0]:[-1,1];
    const pts=used.map(k=>[x0+k*h,g(x0+k*h)]);
    let lo=Math.min(...ys,...pts.map(p=>p[1])),hi=Math.max(...ys,...pts.map(p=>p[1]));const pad=(hi-lo)*.15||1e-6;lo-=pad;hi+=pad;
    const P=plot('clip-slp',xr,[lo,hi],{label:'Function near x0 with the sampled points'});
    let inner=P.curve(F.f,'cv1',200);
    inner+=P.line(xr[0],F.f(x0)+tr*(xr[0]-x0),xr[1],F.f(x0)+tr*(xr[1]-x0),'ln3');
    if(st.m!=='c5'){const a=pts[0],b=pts[1],sl=(b[1]-a[1])/(b[0]-a[0]);inner+=P.line(xr[0],a[1]+sl*(xr[0]-a[0]),xr[1],a[1]+sl*(xr[1]-a[0]),'ln2')}
    inner+=pts.map(p=>P.dot(p[0],p[1],'dk',5)).join('')+P.dot(x0,F.f(x0),'dg',5);
    q('#slp-plot').innerHTML=P.wrap(inner);
    // error plot
    const E=plot('clip-slpe',[-3,0],[-10,2],{label:'Error against step size on log scales',h:240});
    const mk={fwd:'cv2',bwd:'cv3',cen:'cv1',c5:'cv4'};let ei='';
    Object.keys(mk).forEach(m=>{const pp=[];for(let i=0;i<=60;i++){const e=-3+3*i/60,hh=Math.pow(10,e),er=Math.abs(slopeEst(F,m,hh,st.sg)-tr);pp.push([e,Math.max(-10,Math.log10(er+1e-14))])}
      ei+=`<g opacity="${m===st.m?1:.35}">${E.path(pp,mk[m])}</g>`});
    const cur=Math.abs(slopeEst(F,st.m,h,st.sg)-tr);
    ei+=E.vline(st.e,'dsh')+E.dot(st.e,Math.max(-10,Math.log10(cur+1e-14)),'dg',5.5);
    q('#slp-eplot').innerHTML=E.wrap(ei);
    const est=slopeEst(F,st.m,h,st.sg);
    q('#slp-hv').textContent=h<.01?h.toExponential(1):h.toFixed(h<.1?3:2);
    q('#slp-e').textContent=fmt(est,5);q('#slp-t').textContent=fmt(tr,5);q('#slp-er').textContent=cur<1e-4?cur.toExponential(2):fmt(est-tr,5);q('#slp-rel').textContent=fmt(cur/Math.abs(tr)*100,cur/Math.abs(tr)<1e-4?6:4)+' %';
    const s=q('#slp-s');
    if(st.sg>0&&cur>.05*Math.abs(tr)){s.className='status bad';s.innerHTML=`<b>Noise is winning.</b> The data carry errors of ±${st.sg}, and dividing by $h$ = ${h<.01?h.toExponential(1):h.toFixed(3)} magnifies them to roughly ${(st.sg/h).toPrecision(2)}. Make $h$ larger, or smooth the data first.`}
    else if(st.sg>0){s.className='status warn';s.innerHTML='Noise is present. Watch the error curves bend upward at small $h$. That is the price of differencing noisy data.'}
    else if(st.m==='fwd'||st.m==='bwd'){s.className='status';s.innerHTML=`<b>${SLM[st.m]}: error $\\propto h$.</b> The curve has slope 1 on the log plot. Divide $h$ by 10 and the error falls by about 10.`}
    else if(st.m==='cen'){s.className='status good';s.innerHTML='<b>Central: error $\\propto h^{2}$.</b> Slope 2 on the log plot. Divide $h$ by 10 and the error falls by about 100.'}
    else{s.className='status good';s.innerHTML='<b>5-point central: error $\\propto h^{4}$.</b> Very steep on the log plot, until round-off error stops it near $10^{-11}$.'}
    if(h<=.1000001){st.seen[st.m]=1;if(st.seen.fwd&&st.seen.bwd&&st.seen.cen&&st.seen.c5)labDone('slp')}
  }
  root.addEventListener('input',ev=>{if(ev.target.id==='slp-h'){st.e=+ev.target.value;draw()}});
  root.addEventListener('change',ev=>{if(ev.target.id==='slp-fn'){st.fn=ev.target.value;draw()}if(ev.target.id==='slp-sg'){st.sg=+ev.target.value;draw()}});
  root.addEventListener('click',ev=>{const m=ev.target.closest('[data-m]');if(m){st.m=m.dataset.m;$$('[data-m]',root).forEach(b=>b.classList.toggle('on',b===m));draw()}});
  draw();
}

function gradeEx(e,root){
  if(e.type==='mcq'||e.type==='tf'){const s=$('.opt.sel',root);if(!s)return null;return {ok:+s.dataset.j===e.a,sel:s}}
  if(e.type==='num'){const v=numParse($('input',root).value);if(v==null)return null;const tol=e.t!=null?e.t:(e.tol!=null?e.tol:0.01);return {ok:Math.abs(v-e.a)<=tol+1e-12}}
  if(e.type==='fill'){const ins=$$('.fld input',root),marks=[];let ok=true;
    for(const i of ins){const v=numParse(i.value);if(v==null)return null;const f=e.fields[+i.dataset.j];const tol=f.t!=null?f.t:(f.tol!=null?f.tol:0.01);const g=Math.abs(v-f.a)<=tol+1e-12;marks.push([i,g]);ok=ok&&g}
    return {ok,marks}}
  if(e.type==='classify'){const rows=$$('.row',root),marks=[];let ok=true;
    for(const r of rows){const s=$('.seg .sel',r);if(!s)return null;const g=+s.dataset.k===e.items[+r.dataset.j][1];marks.push([r,g]);ok=ok&&g}
    return {ok,marks}}
  if(e.type==='order'){const idx=$$('[data-idx]',root).map(r=>+r.dataset.idx);return {ok:idx.every((v,i)=>v===i)}}
}
function lockEx(e,root,state){
  $$('input,.opt,.seg button,.mv button,[data-act=check],[data-act=show]',root).forEach(n=>{n.disabled=true});
  root.classList.add('done');$('.ex-state',root).textContent=state;$('.sol',root).classList.add('show');$('.fb',root).classList.remove('show');
  mountViz($('.sol',root));
}
function fillAnswer(e,root){
  if(e.type==='mcq'||e.type==='tf'){$$('.opt',root).forEach(o=>{o.classList.remove('sel','wrong');o.classList.toggle('right',+o.dataset.j===e.a)})}
  if(e.type==='num'){$('input',root).value=minus(e.a)}
  if(e.type==='fill'){$$('.fld input',root).forEach(i=>{i.value=minus(e.fields[+i.dataset.j].a);i.classList.remove('wrong');i.classList.add('right')})}
  if(e.type==='classify'){$$('.row',root).forEach(r=>{r.classList.remove('wrong');r.classList.add('right');$$('.seg button',r).forEach(b=>{b.classList.remove('sel');b.classList.toggle('ans',+b.dataset.k===e.items[+r.dataset.j][1])})})}
  if(e.type==='order'){const box=$('[data-order]',root);const rows=$$('[data-idx]',box).sort((a,b)=>a.dataset.idx-b.dataset.idx);rows.forEach(r=>box.appendChild(r));renumber(box)}
}
const renumber=box=>$$('.pos',box).forEach((p,i)=>p.textContent=i+1);
function restoreEx(e){
  const root=$('#ex-'+e.id);if(!root)return;const r=S.ex[e.id];
  fillAnswer(e,root);lockEx(e,root,r.st==='ok'?'Cleared':'Revealed');
}
function checkEx(e,root,anchor){
  if(root.classList.contains('done'))return;
  const g=gradeEx(e,root),fb=$('.fb',root);
  if(!g){fb.innerHTML='Answer every part first.';fb.classList.add('show');return}
  const r=S.ex[e.id]=S.ex[e.id]||{att:0,st:'open'};r.att++;
  if(g.ok){
    const first=r.att===1,xp=first?e.xp:Math.ceil(e.xp/2);
    r.st='ok';r.xp=xp;
    if(g.marks)g.marks.forEach(([n])=>n.classList.add('right'));
    if(g.sel)g.sel.classList.add('right');
    lockEx(e,root,'Cleared · +'+xp+' XP');
    root.classList.add('win');setTimeout(()=>root.classList.remove('win'),800);
    sfx.ok();
    if(first){S.streak++;S.best=Math.max(S.best,S.streak);
      const bonus={3:5,5:10,10:20}[S.streak];
      if(bonus){banner('Combo x'+S.streak,'+'+bonus+' bonus XP');award(bonus,$('#comboChip'))}}
    award(xp,anchor||root);
    if(S.ex[e.id].xp)grant('coin');
    if(S.best>=3)grant('c3');if(S.best>=5)grant('c5');if(S.best>=10)grant('c10');
    afterProgress(e,root);

    S.streak=0;sfx.no();floatText('Combo lost',$('#comboChip'),'red');
    if(g.sel){g.sel.classList.remove('sel');g.sel.classList.add('wrong')}

    fb.innerHTML=`<b>Not quite.</b> ${e.hint}`;fb.classList.add('show');

function showSolution(e,root){

function stageOf(id){for(const k in EX)if(EX[k].some(e=>e.id===id))return k}

  const BASE_CFG=WORLD.music||{name:'Frontier Theme',bpm:104,root:57,swing:0,chords:[[0,3,7,10],[-2,2,5,9],[3,7,10,14],[7,10,14,17]],arp:[0,1,2,3,2,1,2,0],bass:[1,0,.45,0,1,.4,0,.5],drums:'k.h.s.hk',mel:[[7,null,9,10,12,null,10,9],[7,null,5,7,9,null,5,null],[3,null,5,7,10,null,9,7],[5,null,7,5,2,null,0,null]],lead:'triangle',leadCut:2400,pad:'triangle',padCut:850,arpWave:'sine',arpCut:2000,detune:5};
  const BOSS_CFG={name:'Boss Encounter',bpm:142,root:50,swing:0,chords:[[0,3,7,10],[1,5,8,12],[3,7,10,14],[7,10,13,17],[0,3,7,10],[5,8,12,15],[1,5,8,12],[7,10,13,16]],arp:[0,3,2,3,1,3,2,0],bass:[1,.7,.9,.6,1,.7,.9,.8],drums:'khskkhsk',mel:[[0,null,7,8,7,null,5,3],[1,null,5,7,8,null,7,5],[3,null,10,12,10,null,8,7],[13,12,10,8,7,null,5,null],[12,null,15,13,12,null,10,8],[5,null,8,10,12,null,10,8],[13,12,10,8,7,5,3,1],[7,null,10,8,7,null,0,null]],lead:'sawtooth',leadCut:3100,pad:'triangle',padCut:950,arpWave:'square',arpCut:2100,detune:8};
  let isBoss=location.hash==='#boss',cfg=isBoss?BOSS_CFG:BASE_CFG;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  let MC=null,master=null,dryBus=null,wetBus=null,noiseBuf=null,timer=null,nextT=0,step=0,playing=false;
  function ensureBus(){
    if(MC)return;
    MC=new (window.AudioContext||window.webkitAudioContext)();
    master=MC.createGain();master.gain.value=.44;
    const comp=MC.createDynamicsCompressor();
    dryBus=MC.createGain();dryBus.connect(comp);
    const delay=MC.createDelay(1),dlpf=MC.createBiquadFilter(),dfb=MC.createGain(),dwet=MC.createGain();
    delay.delayTime.value=.25;dlpf.type='lowpass';dlpf.frequency.value=1850;dfb.gain.value=.2;dwet.gain.value=.22;
    wetBus=MC.createGain();wetBus.connect(delay);delay.connect(dlpf);dlpf.connect(dfb);dfb.connect(delay);dlpf.connect(dwet);dwet.connect(comp);
    comp.connect(master);master.connect(MC.destination);
    noiseBuf=MC.createBuffer(1,MC.sampleRate,MC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1;
  }
  function voice(f,t,d,type,v,cut=2200,det=0,wet=.22){
    const flt=MC.createBiquadFilter(),g=MC.createGain();
    flt.type='lowpass';flt.frequency.setValueAtTime(Math.min(cut*1.35,9000),t);flt.frequency.exponentialRampToValueAtTime(Math.max(cut*.55,220),t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    flt.connect(g);g.connect(dryBus);if(wet>0){const w=MC.createGain();w.gain.value=wet;g.connect(w);w.connect(wetBus);}
    const mkO=dt=>{const o=MC.createOscillator();o.type=type;o.frequency.value=f;if(dt)o.detune.value=dt;o.connect(flt);o.start(t);o.stop(t+d+.04);};
    mkO(0);if(det)mkO(det);
  }
  function drum(kind,t){
    if(kind==='k'){
      const o=MC.createOscillator(),g=MC.createGain();o.type='sine';o.frequency.setValueAtTime(118,t);o.frequency.exponentialRampToValueAtTime(42,t+.1);
      g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(dryBus);o.start(t);o.stop(t+.14);
    }else if(kind==='s'&&noiseBuf){
      const s=MC.createBufferSource();s.buffer=noiseBuf;const f=MC.createBiquadFilter();f.type='bandpass';f.frequency.value=1650;
      const g=MC.createGain();g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.0001,t+.07);
      s.connect(f);f.connect(g);g.connect(dryBus);s.start(t);s.stop(t+.08);
    }else if(kind==='h'&&noiseBuf){
      const s=MC.createBufferSource();s.buffer=noiseBuf;const f=MC.createBiquadFilter();f.type='highpass';f.frequency.value=6500;
      const g=MC.createGain();g.gain.setValueAtTime(.026,t);g.gain.exponentialRampToValueAtTime(.0001,t+.035);
      s.connect(f);f.connect(g);g.connect(dryBus);s.start(t);s.stop(t+.04);
    }
  }
  function sched(){
    const e=60/cfg.bpm/2;
    while(nextT<MC.currentTime+.25){
      const bar=Math.floor(step/8)%cfg.chords.length,i=step%8,ch=cfg.chords[bar],t=nextT+(i%2?(cfg.swing||0)*e:0);
      const bv=(cfg.bass||[1,0,.45,0,1,0,.45,0])[i];
      if(bv)voice(mtof(cfg.root-12+ch[0]),t,e*1.55,'triangle',.16*bv,480,0,0);
      if(i===0&&cfg.pad){ch.slice(0,3).forEach(iv=>voice(mtof(cfg.root+iv),t,e*7.5,cfg.pad,.022,cfg.padCut||820,cfg.detune||4,.25));}
      const ai=cfg.arp?cfg.arp[i%cfg.arp.length]:null;
      if(ai!==null&&ai!==undefined&&ch[ai%ch.length]!==undefined)voice(mtof(cfg.root+12+ch[ai%ch.length]),t,e*.85,cfg.arpWave||'sine',.032,cfg.arpCut||2000,0,.35);
      if(cfg.drums)drum(cfg.drums[i],t);
      const mBar=cfg.mel[bar%cfg.mel.length],m=mBar?mBar[i]:null;
      if(m!==null&&m!==undefined&&step>=8)voice(mtof(cfg.root+12+m),t,e*1.45,cfg.lead||'triangle',.065,cfg.leadCut||2300,cfg.detune||5,.32);
      nextT+=e;step++;
    }
  }
  function start(){
    try{ensureBus();MC.resume();if(playing)return;playing=true;nextT=MC.currentTime+.08;step=0;timer=setInterval(sched,75);}catch(e){}
  }
  let silent=null;
  function unlock(){
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    try{ensureBus();
      if(MC.state!=='running')MC.resume();
      const b=MC.createBuffer(1,1,22050),s=MC.createBufferSource();s.buffer=b;s.connect(MC.destination);s.start(0)}catch(e){}
    if(!navigator.audioSession&&!silent){try{silent=new Audio('data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==');silent.loop=true;silent.play().catch(()=>{})}catch(e){}}
  }
  ['click','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(window.__nqIntro&&window.__nqIntro.music().on&&!document.getElementById('nqWelcome')){unlock();start()}else unlock()},true));
  function stop(){playing=false;clearInterval(timer);if(master)master.gain.cancelScheduledValues(0);if(MC)MC.suspend()}
  function sync(){musicOn?start():stop();const b=document.getElementById('musicBtn');if(b){b.setAttribute('aria-pressed',musicOn);b.title=`Background music (${cfg.name||'Theme'})`}}
  window.addEventListener('nq:view',e=>{
    const b=(e&&e.detail)==='boss';if(b===isBoss)return;
    isBoss=b;cfg=isBoss?BOSS_CFG:BASE_CFG;
    if(MC&&master){const now=MC.currentTime;master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);master.gain.linearRampToValueAtTime(.02,now+.05);master.gain.linearRampToValueAtTime(.44,now+.20);nextT=now+.10;}
    step=0;sync();
  });
  document.addEventListener('visibilitychange',()=>{if(!MC)return;if(document.hidden)MC.suspend();else if(musicOn&&playing)MC.resume()});
  const sb=document.getElementById('sfxBtn');
  if(sb&&sb.parentNode&&!document.getElementById('musicBtn')){const b=document.createElement('button');b.className='ctl-btn';b.id='musicBtn';b.type='button';b.textContent='Music';b.title='Background music on or off';b.setAttribute('aria-pressed',musicOn);
    sb.parentNode.insertBefore(b,sb.nextSibling);
    b.addEventListener('click',()=>{musicOn=!musicOn;saveM();playing=playing&&musicOn;sync()})}

  let seen=false;try{seen=sessionStorage.getItem('nq-welcome-w'+WN)==='1'}catch(e){}
  if(location.hash&&location.hash!=='#home')seen=true;
  function showWelcome(){
    const lv=level(S.xp),cont=S.xp>0;
    const guideHtml=(typeof ART!=='undefined'&&ART.guide)?`<div class="chiefline" style="margin:12px 0"><img class="chiefface" src="${ART.guide}" alt="${ART.guideName}"><div><b>${ART.guideName}</b> <span class="hint">(${ART.guideTitle||'Faculty advisor'})</span><br>${WORLD.mission}</div></div>`:`<p>${WORLD.mission}</p>`;
    const w=document.createElement('div');w.id='nqWelcome';w.className='open';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-label','Welcome to NumQuest');
    w.innerHTML=`<div class="wl-card"><div class="wl-ey">CENSCP33Z · Numerical Solutions to CE Problems</div><h2>${WORLD.subtitle}</h2>${guideHtml}
      <div class="wl-act"><button type="button" class="btn" id="nqMus">${musicOn?'Music: ON':'Music: OFF'}</button><button type="button" class="btn" id="nqSfx">${S.sfx?'SFX: ON':'SFX: OFF'}</button><button type="button" class="btn primary" id="nqGo">${cont?'Continue ('+S.xp+' XP)':'Start World '+WN}</button></div>
      ${cont?`<div class="hint mono" style="margin-top:10px">Saved rank: Level ${lv+1} · ${LEVELS[lv][1]}</div>`:''}</div>`;
    document.body.appendChild(w);
    const go=w.querySelector('#nqGo');if(go)go.focus();
    const musBtn=w.querySelector('#nqMus'),sfxBtn=w.querySelector('#nqSfx');
    if(musBtn)musBtn.addEventListener('click',e=>{musicOn=!musicOn;saveM();e.currentTarget.textContent=musicOn?'Music: ON':'Music: OFF';playing=playing&&musicOn;sync()});
    if(sfxBtn)sfxBtn.addEventListener('click',e=>{S.sfx=!S.sfx;save();hud();e.currentTarget.textContent=S.sfx?'SFX: ON':'SFX: OFF'});
    const done=()=>{try{sessionStorage.setItem('nq-welcome-w'+WN,'1')}catch(e){}
      if(musicOn)sync();if(S.sfx)sfx.ok();w.remove();document.removeEventListener('keydown',kd)};
    const kd=e=>{if(e.target.closest&&e.target.closest('button'))return;if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();done()}};
    if(go)go.addEventListener('click',done);document.addEventListener('keydown',kd);
  }
  window.__nqIntro={show:showWelcome,music:()=>({on:musicOn,playing})};
  if(!seen)showWelcome();
})();

load();applyTheme();initMath();build();route();renderMath(document.body);
window.__nq=Object.assign({S:()=>S,total:totalXP,EX,STAGES},WORLD.expose?WORLD.expose():{});

})();
